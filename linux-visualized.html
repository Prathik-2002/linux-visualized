lesson('pwd', {
  n: 'pwd', s: 'Prints the full path of the directory you are currently in.',
  an: 'Like the “You are here” dot on a shopping-mall map: it doesn\'t move you, it just tells you exactly where you are.',
  nm: '<b>p</b>rint <b>w</b>orking <b>d</b>irectory.',
  sx: 'pwd [-L|-P]', p: [['pwd', 'cmd', 'The command itself.', true], ['[-L|-P]', 'opt', '-L (default) shows the path as you navigated it, including symbolic links; -P shows the physical path with links resolved.', false]],
  ex1: 'pwd', bw: '<b>Why pwd is a builtin:</b> the shell already tracks its current directory in $PWD, so printing it needs no new process (/usr/bin/pwd also exists and asks the kernel with getcwd()).',
  sc: [['getcwd', 'only /usr/bin/pwd needs it: asks the kernel for the current directory of the process', 'getcwd("/home/user", 4096) = 11'], ['write', 'prints the path to stdout (fd 1)', 'write(1, "/home/user\\n", 11) = 11']],
  ch: 'Nothing. pwd only reads information.', out: 'One line on stdout: an absolute path that always starts with <code>/</code>, e.g. <code>/home/user</code>.', ec: '0 almost always. It can fail (1) if the current directory was deleted from under you.',
  f: [['-L', '--logical', 'Print the path as you reached it (keeps symlink names). Default.', 'pwd -L', true], ['-P', '--physical', 'Resolve all symbolic links and print the real location on disk.', 'pwd -P', true]],
  e: [['pwd', '/home/user', 'You start in your home directory.'], ['cd docs; pwd', '/home/user/docs', 'After cd, pwd shows the new location.'], ['cd /tmp; pwd', '/tmp', 'Absolute paths work from anywhere.'], ['cd ~; pwd -P', '/home/user', '-P resolves symlinks (none here, so the same).'], ['echo "I am in $(pwd)"', 'I am in /home/user', 'Command substitution: use pwd\'s output inside another command.']],
  u: `<p>Every process has its own <b>working directory</b>; relative paths like <code>docs/report.txt</code> are resolved starting there. The shell stores its working directory in the variable <code>$PWD</code> and the previous one in <code>$OLDPWD</code>.</p><p>The kernel keeps the same information for every process: <code>ls -l /proc/self/cwd</code> is a symbolic link to it.</p>`,
  adv: `<p>The working directory is a pointer in the process's <code>fs_struct</code> (part of <code>task_struct</code>) to a <i>dentry</i>. <code>getcwd(2)</code> walks dentries up to the root to build the string. If the directory is deleted, getcwd returns a path ending in “ (deleted)”. Inspect any process: <code>readlink /proc/PID/cwd</code>.</p>`,
  mi: [['pwd docs', 'pwd ignores arguments — it always prints where YOU are, not where docs is.', 'realpath docs'], ['PWD', 'Commands are case-sensitive: “PWD” is not found (it\'s a variable name, not a command).', 'pwd   # or: echo $PWD'], ['cd /home/user/docs pwd', 'cd receives two arguments and complains “too many arguments”.', 'cd /home/user/docs && pwd']],
  safe: 'pwd only reads — it can never change anything.',
  r: [['cd', 'cd changes where you are; pwd only reports it.'], ['ls', 'ls shows what is in the directory; pwd shows which directory it is.']],
  cs: ['<code>pwd</code> → prints your current directory', 'Output is always an absolute path starting with /', '<code>~</code> in the prompt = your home, /home/user', '<code>echo $PWD</code> gives the same result', '<code>pwd -P</code> resolves symbolic links'],
  q: [['What does pwd print?', ['Your username', 'The current directory as a full path', 'The files in the folder', 'Your password'], 1, 'pwd = print working directory, an absolute path like /home/user.'], ['You are in /home/user and run cd docs. What will pwd show?', ['docs', '/docs', '/home/user/docs', '~/user/docs'], 2, 'pwd always shows the full absolute path.'], ['Which variable holds the same value as pwd?', ['$HOME', '$PATH', '$PWD', '$USER'], 2, '$PWD is updated by cd. $HOME is your home directory.']],
  c: { t: 'Find out where you are: run <code>pwd</code>.', try: 'pwd', chk: ctx => okRun(ctx, 'pwd') },
});
lesson('ls', {
  n: 'ls', s: 'Lists the files and folders inside a directory.',
  an: 'Opening a drawer and reading the labels on every folder inside. With -l you also read the sticker on each folder: owner, size, date.',
  nm: '<b>l</b>i<b>s</b>t (directory contents).',
  sx: 'ls [OPTIONS] [FILE|DIR]...', p: [['ls', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', 'Flags such as -l (long format) or -a (show hidden files). Combine them: -la.', false], ['[FILE|DIR]...', 'arg', 'What to list. Default: the current directory (.). You can give several.', false]],
  ex1: 'ls -la docs',
  sc: [['openat', 'opens the directory to read it', 'openat(AT_FDCWD, "docs", O_RDONLY|O_NONBLOCK|O_CLOEXEC|O_DIRECTORY) = 3'], ['getdents64', 'reads the directory entries (name + inode number)', 'getdents64(3, /* 5 entries */, 32768) = 152'], ['statx (×N)', 'with -l: reads each file\'s inode (mode, owner, size, time)', 'statx(AT_FDCWD, "docs/report.txt", AT_SYMLINK_NOFOLLOW, STATX_BASIC_STATS, …) = 0'], ['write', 'prints the formatted listing', 'write(1, "total 20\\ndrwxr-xr-x 2 …", 260) = 260'], ['close', 'closes the directory', 'close(3) = 0']],
  ch: 'Nothing — ls only reads.', out: 'Names on stdout. In a terminal, ls arranges them in columns and colours them (blue = directory, green = executable, cyan = link); piped into another command it prints one name per line with no colours.', ec: '0 = OK, 1 = minor problem (e.g. a subdirectory couldn\'t be read), 2 = serious trouble (e.g. the path doesn\'t exist).',
  f: [['-l', '', 'Long format: permissions, links, owner, group, size, date, name.', 'ls -l', true], ['-a', '--all', 'Show hidden files (names starting with .) including . and ..', 'ls -a', true], ['-h', '--human-readable', 'With -l, show sizes as 1.5K, 2.4M instead of bytes.', 'ls -lh logs', true], ['-A', '--almost-all', 'Like -a but without . and ..', 'ls -A', false], ['-t', '', 'Sort by modification time, newest first.', 'ls -lt', true], ['-r', '--reverse', 'Reverse the sort order.', 'ls -ltr', false], ['-S', '', 'Sort by size, largest first.', 'ls -lS logs', false], ['-R', '--recursive', 'List subdirectories too, recursively.', 'ls -R projects', false], ['-d', '--directory', 'List the directory itself, not its contents.', 'ls -ld /tmp', false], ['-i', '--inode', 'Show each file\'s inode number.', 'ls -i', false], ['-F', '--classify', 'Append / to dirs, * to executables, @ to links.', 'ls -F', false], ['-1', '', 'One name per line.', 'ls -1', false]],
  e: [['ls', 'backup  bin  data.csv  docs  fruits.txt  logs  notes.txt  …', 'Plain listing of the current directory.'], ['ls -l docs', '-rw-r--r-- 1 user user 29 Nov  8 09:30 readme.txt\n…', 'Long format of another directory.'], ['ls -la', 'drwxr-xr-x  7 user user 4096 … .\n…\n-rw-r--r--  1 user user  121 … .bashrc', 'All files, including hidden dotfiles.'], ['ls -lhS logs', '-rw-r--r-- 1 user user 2.4M … app.log\n-rw-r--r-- 1 user user 1.3M … error.log', 'Largest first with readable sizes.'], ['ls -ld /tmp /root', 'drwxrwxrwt 2 root root 4096 … /tmp\ndrwx------ 2 root root 4096 … /root', '-d shows the directories themselves (note the t sticky bit on /tmp).'], ['ls *.txt', 'fruits.txt  notes.txt', 'The SHELL expands *.txt before ls runs; ls just receives the names.']],
  u: `<p><b>Reading <code>ls -l</code>:</b> <code>-rw-r--r-- 1 user user 104 Nov 18 09:30 notes.txt</code></p><ul><li><code>-</code> type: - file, d directory, l link</li><li><code>rw-r--r--</code> permissions for owner / group / others</li><li><code>1</code> link count (how many names point at this inode)</li><li><code>user user</code> owner and group</li><li><code>104</code> size in bytes</li><li><code>Nov 18 09:30</code> last modification time</li></ul><p>A directory is a special file containing a table of <b>name → inode number</b>. ls reads that table (getdents64) and, for -l, calls stat on every entry to read the inode. Names starting with a dot are hidden by convention only — nothing secret about them.</p>`,
  adv: `<p><code>getdents64</code> fills a buffer with <code>struct linux_dirent64 { d_ino; d_off; d_reclen; d_type; d_name[] }</code>. <code>d_type</code> often lets ls colour entries without calling stat. The "total" line is the sum of allocated blocks (st_blocks, in 1 KiB units by default). Colours come from <code>$LS_COLORS</code> via the alias <code>ls --color=auto</code>, which only colours when stdout is a TTY (isatty(1)).</p>`,
  mi: [['ls -l -a -h', 'Works, but is verbose.', 'ls -lah'], ['ls | grep "*.txt"', 'grep receives a regex, not a glob; "*" at the start is meaningless and matches nothing useful.', 'ls *.txt   # or: ls | grep "\\.txt$"'], ['ls Docs', '“No such file or directory” — Linux file names are case-sensitive.', 'ls docs'], ['for f in $(ls); do …', 'Breaks on file names with spaces.', 'for f in *; do …']],
  safe: 'ls only reads.',
  r: [['cd', 'Move into a folder you saw with ls.'], ['find', 'Search a whole tree by name, size or date — ls only looks at one directory.'], ['stat', 'Every detail about ONE file; ls -l shows a summary for many.'], ['tree', 'ls -R as an indented tree (install with apt).']],
  cs: ['<code>ls</code> list · <code>ls -l</code> details · <code>ls -a</code> hidden files', '<code>ls -lh</code> human sizes · <code>ls -lt</code> newest first', 'First char of -l: d = dir, - = file, l = link', 'Blue = directory, green = executable, cyan = link', 'Flags combine: <code>ls -lahtr</code>'],
  q: [['Which flag shows hidden files?', ['-h', '-a', '-l', '-r'], 1, '-a (all) includes names starting with a dot.'], ['In ls -l, what does the first character “d” mean?', ['deleted', 'directory', 'disabled', 'device'], 1, 'd = directory, - = regular file, l = symbolic link.'], ['What does ls *.txt actually receive as arguments?', ['The literal text *.txt', 'The list of matching file names, expanded by the shell', 'Nothing', 'A regular expression'], 1, 'Glob expansion is done by the shell before ls starts.']],
  c: { t: 'List <b>all</b> files in your home, including hidden ones, in long format.', try: 'ls -la', chk: ctx => okRun(ctx, 'ls') && /\s-\w*a/i.test(ctx.line) && /\s-\w*l|\s-l/.test(ctx.line) },
});
lesson('cd', {
  n: 'cd', s: 'Changes your current directory (moves you to another folder).',
  an: 'Walking into another room. The rooms and their contents don\'t change — only where you are standing.',
  nm: '<b>c</b>hange <b>d</b>irectory.',
  sx: 'cd [DIR]', p: [['cd', 'cmd', 'Shell builtin.', true], ['[DIR]', 'arg', 'Where to go: absolute (/etc), relative (docs, ../backup), ~ (home), - (previous dir). No argument = home.', false]],
  ex1: 'cd docs',
  sc: [['stat', 'checks the target exists and is a directory', 'newfstatat(AT_FDCWD, "docs", {st_mode=S_IFDIR|0755, …}, 0) = 0'], ['chdir', 'tells the kernel to change the shell\'s working directory (needs x permission on the dir)', 'chdir("/home/user/docs") = 0']],
  ch: 'Only the <b>shell\'s</b> working directory changes (and $PWD / $OLDPWD). No files are touched.', out: 'Nothing on success. <code>cd -</code> prints the directory it switches to.', ec: '0 = success, 1 = no such directory / not a directory / permission denied.',
  bw: '<b>Why cd MUST be a builtin:</b> every process has its own current directory, and a child can never change its parent\'s. If cd were a separate program, it would change <i>its own</i> directory and exit — your shell would stay where it was. So bash handles cd itself by calling chdir() in its own process.',
  f: [['-', '', 'Go back to the previous directory ($OLDPWD).', 'cd -', true], ['~', '', 'Your home directory (also: cd with no argument).', 'cd ~', true], ['..', '', 'The parent directory.', 'cd ..', true], ['-P', '', 'Resolve symbolic links (physical path).', 'cd -P /bin', false], ['-L', '', 'Follow symlinks logically (default).', 'cd -L link', false]],
  e: [['cd docs', '', 'Relative path: docs inside the current directory.'], ['cd ..', '', 'Up one level to the parent.'], ['cd /var/log', '', 'Absolute path: starts from the root /.'], ['cd', '', 'No argument: back to your home directory.'], ['cd -', '/var/log', 'Jump back to where you were before, and print it.'], ['cd ~/projects/website', '', '~ expands to /home/user.']],
  u: `<p>Paths are either <b>absolute</b> (start with <code>/</code>, work from anywhere) or <b>relative</b> (start from the current directory). Special names: <code>.</code> this directory, <code>..</code> parent, <code>~</code> home, <code>-</code> previous.</p><p>To enter a directory you need the <b>x</b> (search) permission on it — r only lets you list names. That's why <code>cd /root</code> fails for normal users: /root is <code>drwx------</code>.</p>`,
  adv: `<p>bash calls <code>chdir(2)</code>, which updates <code>current->fs->pwd</code> (a <code>struct path</code> = mount + dentry) in the shell's <code>task_struct</code>. Children inherit a copy at fork(). bash then sets <code>PWD</code> logically (keeping symlink names) unless you use <code>cd -P</code> or <code>set -P</code>. <code>CDPATH</code> adds extra base directories for relative cd.</p>`,
  mi: [['cd Documents', '“No such file or directory” — names are case-sensitive and must exist.', 'ls   # check the exact name first'], ['cd my folder', '“too many arguments”: the space splits it into two words.', 'cd "my folder"   # or: cd my\\ folder'], ['cd notes.txt', '“Not a directory”: you can only cd into directories.', 'cat notes.txt'], ['sudo cd /root', 'sudo: cd: command not found — cd is a builtin, not a program sudo can run.', 'sudo -i   # root shell, then cd /root']],
  safe: 'cd only moves you around; it never modifies files.',
  r: [['pwd', 'Shows where cd took you.'], ['ls', 'Look around after you arrive.'], ['pushd', 'pushd/popd keep a stack of directories (builtins) — handy for jumping back and forth.']],
  cs: ['<code>cd dir</code> enter · <code>cd ..</code> up · <code>cd</code> home', '<code>cd -</code> go back to the previous directory', '<code>/abs/path</code> vs <code>relative/path</code>', 'Quote names with spaces: <code>cd "my dir"</code>', 'Needs x permission on the directory'],
  q: [['Why is cd a shell builtin?', ['It is faster to type', 'A child process cannot change its parent\'s working directory', 'It needs root', 'Historical accident only'], 1, 'A separate program would only change its own directory.'], ['You are in /home/user/docs. Where does cd .. take you?', ['/', '/home', '/home/user', '/home/user/docs/..'], 2, '.. means the parent directory.'], ['What does cd with no arguments do?', ['Nothing', 'Goes to /', 'Goes to your home directory', 'Shows an error'], 2, 'It is the same as cd ~.']],
  c: { t: 'Go into the <code>docs</code> folder, then come back to your home directory.', try: 'cd docs', steps: [['Be inside /home/user/docs', ctx => S.cwd === '/home/user/docs'], ['Return to /home/user (try cd .., cd ~ or cd -)', ctx => S.cwd === '/home/user' && ran(ctx, 'cd')]] },
});
lesson('clear', {
  n: 'clear', s: 'Clears the terminal screen so you get a fresh, empty view.',
  an: 'Wiping a whiteboard. The notes in your notebook (history, files) are untouched — only the board gets clean.',
  nm: '<b>clear</b> (the screen).',
  sx: 'clear [-x]', p: [['clear', 'cmd', 'The command.', true], ['[-x]', 'opt', 'Do not clear the scroll-back buffer.', false]],
  ex1: 'clear',
  sc: [['ioctl', 'asks the terminal for its size/type info', 'ioctl(1, TCGETS, {…}) = 0'], ['write', 'sends the escape codes ESC[H ESC[2J ESC[3J that tell the terminal to home the cursor and erase', 'write(1, "\\33[H\\33[2J\\33[3J", 11) = 11']],
  ch: 'Nothing on the system. Only the terminal\'s display is reset.', out: 'Special control characters (escape sequences) the terminal interprets as “erase screen”.', ec: '0.',
  f: [['-x', '', 'Keep the scroll-back history.', 'clear -x', false], ['Ctrl+L', '', 'Keyboard shortcut that does the same in bash.', 'Ctrl+L', true], ['-T TYPE', '', 'Use the codes for a specific terminal type.', 'clear -T xterm', false]],
  e: [['clear', '', 'Empties the screen.'], ['ls; clear', '', 'Runs ls, then clears (you won\'t see the listing).'], ['clear && pwd', '/home/user', 'A clean screen followed by fresh output.'], ['history | tail -3', '', 'Proof that clear did not erase your command history.'], ['echo $TERM', 'xterm-256color', 'clear uses $TERM to look up the right escape codes.']],
  u: `<p>Terminals understand <b>escape sequences</b>: invisible byte strings starting with ESC (\\033). <code>clear</code> looks up the right sequence for your terminal type (<code>$TERM</code>) in the terminfo database and prints it. The same mechanism produces colours: <code>echo -e "\\e[31mred\\e[0m"</code>.</p>`,
  adv: `<p><code>clear</code> is part of ncurses. It reads the <code>clear</code> capability from <code>/usr/share/terminfo/x/xterm-256color</code> (compiled terminfo), plus <code>E3</code> to drop scroll-back. Equivalent: <code>tput clear</code> or <code>printf '\\033c'</code> (full reset).</p>`,
  mi: [['clear history', 'clear ignores extra words; your history is not cleared.', 'history -c'], ['cls', 'That\'s the Windows command — “command not found”.', 'clear'], ['clear to hide a password you typed', 'It\'s still in the scroll-back and maybe in ~/.bash_history.', 'history -d N; then change the password']],
  safe: 'clear only affects what you see.',
  r: [['history', 'clear wipes the screen, history -c wipes the command list.'], ['echo', 'echo -e can print escape codes yourself.']],
  cs: ['<code>clear</code> or <b>Ctrl+L</b> → empty screen', 'History and files are untouched', 'Works by printing escape codes', '<code>clear -x</code> keeps scroll-back', '<code>reset</code> fixes a garbled terminal'],
  q: [['What does clear delete?', ['Your files', 'Your command history', 'Nothing — it only redraws the screen', 'The current directory'], 2, 'It only sends “erase screen” codes to the terminal.'], ['Which shortcut does the same as clear in bash?', ['Ctrl+C', 'Ctrl+L', 'Ctrl+Z', 'Ctrl+D'], 1, 'Ctrl+L redraws the screen. Ctrl+C interrupts, Ctrl+Z suspends, Ctrl+D ends input.'], ['How does clear know which codes to send?', ['It asks the kernel', 'It reads $TERM and the terminfo database', 'It guesses', 'From /etc/clear.conf'], 1, 'Different terminals use different sequences; $TERM names yours.']],
  c: { t: 'Run <code>clear</code> (or press Ctrl+L) to tidy the screen.', try: 'clear', chk: ctx => okRun(ctx, 'clear') },
});
lesson('echo', {
  n: 'echo', s: 'Prints text (and the values of variables) to the screen.',
  an: 'A parrot: it repeats whatever you give it — but the shell has already “translated” the words (variables, wildcards) before the parrot hears them.',
  nm: '<b>echo</b> — like a sound echo, it repeats what it hears.',
  sx: 'echo [-neE] [STRING]...', p: [['echo', 'cmd', 'Builtin that prints its arguments separated by spaces.', true], ['[-neE]', 'opt', '-n no newline, -e interpret \\n \\t, -E don\'t (default).', false], ['[STRING]...', 'arg', 'Any number of words. Quote them to keep spacing.', false]],
  ex1: 'echo "Hello $USER"',
  sc: [['write', 'the builtin writes the joined arguments plus a newline to fd 1', 'write(1, "Hello user\\n", 11) = 11']],
  ch: 'Nothing — unless you redirect it (> file), which creates or overwrites a file.', out: 'The arguments joined with single spaces, plus a newline (unless -n).', ec: '0 (1 only if writing fails, e.g. the disk is full).',
  f: [['-n', '', 'Do not print the trailing newline.', 'echo -n "no newline"', true], ['-e', '', 'Interpret escapes: \\n newline, \\t tab, \\e escape (colours).', 'echo -e "a\\tb\\nc"', true], ['-E', '', 'Do not interpret escapes (default in bash).', 'echo -E "a\\nb"', false]],
  e: [['echo Hello world', 'Hello world', 'Two arguments joined by one space.'], ['echo "Hello   world"', 'Hello   world', 'Quotes keep the spaces (one argument).'], ['echo $HOME', '/home/user', 'Variable expansion by the shell.'], ["echo '$HOME'", '$HOME', 'Single quotes stop expansion — printed literally.'], ['echo *.txt', 'fruits.txt notes.txt', 'The shell expands the glob before echo runs.'], ['echo "Today: $(date +%F)"', 'Today: 2026-11-18', 'Command substitution inside double quotes.'], ['echo -e "col1\\tcol2"', 'col1\tcol2', '-e turns \\t into a tab.']],
  u: `<p>echo is the best tool to <b>see what the shell does to your words</b>. Try <code>echo ~ $USER *.csv $((2+3))</code>: every expansion happens before echo even starts.</p><p><b>Quoting rules:</b> unquoted — words split on spaces and globs expand; <code>"double"</code> — $variables and $(commands) expand, nothing else; <code>'single'</code> — everything literal.</p><p><code>echo</code> is a builtin, but <code>/usr/bin/echo</code> also exists. For portable scripts, <code>printf</code> is more predictable.</p>`,
  adv: `<p>The builtin does a single <code>write(1, …)</code>; no fork. Via redirection (<code>echo hi > f</code>) bash forks only if needed: for builtins it temporarily dup2()s fd 1, runs the builtin in-process, then restores fd 1. Arguments arrive as a C <code>argv[]</code>; echo never sees quotes — they were removed by the shell (quote removal).</p>`,
  mi: [["echo 'Hello $USER'", 'Prints $USER literally — single quotes block expansion.', 'echo "Hello $USER"'], ['echo "a\\nb"', 'Prints a\\nb — bash\'s echo doesn\'t interpret escapes by default.', 'echo -e "a\\nb"   # or: printf "a\\nb\\n"'], ['echo text > notes.txt', 'Overwrites notes.txt completely!', 'echo text >> notes.txt   # append']],
  w: 'echo itself is harmless, but <b>echo … > file</b> erases the file\'s previous content instantly. Use <code>>></code> to append, and <code>set -o noclobber</code> to make > refuse to overwrite.',
  r: [['printf', 'Precise formatting (%s, %d, padding); better in scripts.'], ['cat', 'cat prints files; echo prints arguments.'], ['redir', 'Send echo\'s output into a file.']],
  cs: ['<code>echo text</code> prints text', '<code>echo "$VAR"</code> expands, <code>\'$VAR\'</code> doesn\'t', '<code>-n</code> no newline · <code>-e</code> escapes', 'Great for debugging expansions', '<code>echo x > f</code> overwrites, <code>>></code> appends'],
  q: [['What does echo \'$HOME\' print?', ['/home/user', '$HOME', 'HOME', 'Nothing'], 1, 'Single quotes make everything literal.'], ['Who expands *.txt in echo *.txt?', ['echo', 'The kernel', 'The shell', 'ls'], 2, 'The shell expands globs before running the command.'], ['How do you print without a trailing newline?', ['echo -e', 'echo -n', 'echo -x', 'echo --no'], 1, '-n suppresses the newline.']],
  c: { t: 'Print your home directory using a <b>variable</b> (not by typing the path).', try: 'echo $HOME', chk: ctx => okRun(ctx, 'echo') && /\$\{?HOME/.test(ctx.line) },
});
lesson('man', {
  n: 'man', s: 'Opens the built-in manual page for a command.',
  an: 'The instruction booklet that came in the box — every command ships with one.',
  nm: '<b>man</b>ual.',
  sx: 'man [SECTION] PAGE', p: [['man', 'cmd', 'The manual viewer.', true], ['[SECTION]', 'arg', 'Manual section number: 1 commands, 2 system calls, 3 library functions, 5 file formats, 8 admin commands.', false], ['PAGE', 'arg', 'Name of the command, function or file.', true]],
  ex1: 'man ls',
  sc: [['openat', 'opens the compressed page /usr/share/man/man1/ls.1.gz', 'openat(AT_FDCWD, "/usr/share/man/man1/ls.1.gz", O_RDONLY) = 3'], ['pipe + fork', 'creates a pipeline: zcat | groff (formatter) | less (pager)', 'pipe2([4, 5], O_CLOEXEC) = 0'], ['execve', 'starts the pager to display it', 'execve("/usr/bin/less", ["less"], …) = 0']],
  ch: 'Nothing.', out: 'A formatted page shown in the pager (less). Sections: NAME, SYNOPSIS, DESCRIPTION, OPTIONS, EXAMPLES, SEE ALSO.', ec: '0 = shown, 16 = no such page.',
  f: [['-k', '--apropos', 'Search page names and descriptions for a keyword.', 'man -k copy', true], ['-f', '--whatis', 'One-line description of a page.', 'man -f ls', false], ['N', '', 'Section number before the page.', 'man 5 passwd', true], ['-a', '--all', 'Show all matching pages in all sections.', 'man -a printf', false]],
  e: [['man ls', 'LS(1)   User Commands   LS(1)\nNAME\n       ls - …', 'The manual for ls (press q to quit).'], ['man cp', 'CP(1) …', 'Every command has one.'], ['man 5 passwd', '', 'Section 5 describes the /etc/passwd FILE format (section 1 is the passwd command).'], ['man -k directory', '', 'Search all manuals for a keyword (apropos).'], ['ls --help', 'Usage: ls [OPTION]... [FILE]...', 'Most commands also have a quick --help summary.']],
  u: `<p><b>Navigating the pager (less):</b> ↑/↓ or j/k scroll, Space next page, b back, <code>/word</code> search, n next match, q quit.</p><p><b>Sections</b> matter: <code>man 1 printf</code> (shell command) vs <code>man 3 printf</code> (C function); <code>man 2 open</code> documents the system call itself. The SYNOPSIS line uses the same notation as this app: <code>[optional]</code>, <code>ITEM...</code>, <code>a|b</code>.</p><p>Builtins like cd have no own page: use <code>help cd</code> or <code>man bash</code>.</p>`,
  adv: `<p>Pages live in <code>/usr/share/man/manN/*.N.gz</code> written in roff/groff macros. <code>man</code> finds them via <code>manpath</code>, decompresses, formats with <code>groff -man -Tutf8</code>, and pipes into <code>$MANPAGER</code> or <code>$PAGER</code> (default less). <code>mandb</code> builds the index used by <code>man -k</code>.</p>`,
  mi: [['man cd', 'No manual entry — cd is a bash builtin.', 'help cd'], ['Being stuck inside man', 'Typing commands does nothing; you are in the pager.', 'Press q to quit'], ['man passwd (wanting the file format)', 'You get the passwd command.', 'man 5 passwd']],
  safe: 'man only displays documentation.',
  r: [['less', 'man uses less to display pages — same keys.'], ['which', 'Find WHERE a command lives; man explains WHAT it does.'], ['history', 'Review what you ran earlier.']],
  cs: ['<code>man cmd</code> → manual · <b>q</b> quits', '<code>/word</code> search, <b>n</b> next', '<code>man -k word</code> search all manuals', '<code>man 5 file</code> choose a section', 'Builtins: <code>help cd</code>'],
  q: [['How do you quit a man page?', ['Ctrl+C', 'q', 'exit', ':wq'], 1, 'man shows pages in less; q quits.'], ['Which section documents system calls like open()?', ['1', '2', '5', '8'], 1, 'Section 2 = system calls.'], ['Why does man cd fail on many systems?', ['cd is a builtin', 'cd is deprecated', 'You need sudo', 'man is broken'], 0, 'Use help cd for builtins.']],
  c: { t: 'Open the manual page for <code>ls</code>.', try: 'man ls', chk: ctx => okRun(ctx, 'man') && /man\s+(\d\s+)?ls\b/.test(ctx.line) },
});
lesson('history', {
  n: 'history', s: 'Shows the list of commands you have typed, with numbers.',
  an: 'The receipt roll of a cash register: every command you “rang up” is printed in order, so you can re-run one.',
  nm: '<b>history</b> of commands.',
  sx: 'history [N] | history -c | history -d OFFSET', p: [['history', 'cmd', 'Bash builtin.', true], ['[N]', 'arg', 'Show only the last N entries.', false], ['-c / -d', 'opt', 'Clear all / delete one entry.', false]],
  ex1: 'history 5',
  sc: [['write', 'builtin prints from bash\'s in-memory list', 'write(1, "   41  ls -la\\n…", 120) = 120']],
  ch: 'Nothing (unless you use -c/-d). At logout bash appends the session to <code>~/.bash_history</code>.', out: 'Numbered lines: <code>   12  ls -la</code>.', ec: '0.',
  f: [['N', '', 'Show the last N commands.', 'history 10', true], ['-c', '', 'Clear the in-memory history.', 'history -c', true], ['-d N', '', 'Delete entry N.', 'history -d 42', false], ['-w', '', 'Write history to ~/.bash_history now.', 'history -w', false], ['!!', '', 'Re-run the previous command (history expansion).', 'sudo !!', true], ['!N', '', 'Re-run command number N.', '!12', true], ['Ctrl+R', '', 'Interactive reverse search through history.', 'Ctrl+R', true]],
  e: [['history', '    1  pwd\n    2  ls -la …', 'Everything typed in this session.'], ['history 3', '', 'Just the last three.'], ['history | grep cd', '', 'Search history with a pipe.'], ['!!', '', 'Repeats the last command (the shell prints it first).'], ['echo "re-run: !!"', '', '!! works inside other commands too.']],
  u: `<p>The ↑/↓ keys walk through the same list. <b>Ctrl+R</b> lets you type part of an old command to find it — the fastest way to repeat long commands. History expansion (<code>!!</code>, <code>!42</code>, <code>!$</code> = last argument of the previous command) is done by the shell before anything else.</p><p>Size limits come from <code>HISTSIZE</code> (in memory) and <code>HISTFILESIZE</code> (in the file). <code>HISTCONTROL=ignorespace</code> skips commands that start with a space — handy for secrets.</p>`,
  adv: `<p>bash uses the GNU readline/history library; entries live in the shell's heap and are appended to <code>$HISTFILE</code> on exit (or each prompt with <code>PROMPT_COMMAND='history -a'</code>). Multiple terminals each keep their own list until they write it. Set <code>HISTTIMEFORMAT='%F %T '</code> to record timestamps.</p>`,
  mi: [['Typing a password on the command line', 'It is saved in ~/.bash_history in plain text.', 'Let programs prompt for passwords; or prefix the command with a space (HISTCONTROL=ignorespace)'], ['!rm', 'Re-runs the last command that started with rm — maybe not the one you expect!', 'history | grep rm; then !N after checking'], ['history -c expecting other terminals to forget', 'Only clears this shell\'s memory list.', 'history -c && history -w']],
  safe: 'Viewing history is harmless; be careful with blind re-runs like !rm.',
  r: [['clear', 'clear empties the screen; history keeps your commands.'], ['grep', 'history | grep word to search.']],
  cs: ['<code>history</code> list · <code>history 10</code> last 10', '<b>↑ / ↓</b> browse · <b>Ctrl+R</b> search', '<code>!!</code> repeat last · <code>!N</code> run number N', '<code>sudo !!</code> = redo with sudo', 'Saved to <code>~/.bash_history</code> at logout'],
  q: [['What does !! do?', ['Deletes history', 'Repeats the previous command', 'Runs as root', 'Prints “!!”'], 1, 'History expansion: the shell substitutes the last command.'], ['Where is history saved between sessions?', ['/etc/history', '~/.bash_history', '/var/log/history', 'Nowhere'], 1, 'bash writes it to $HISTFILE, usually ~/.bash_history.'], ['Fastest way to find a long command you ran yesterday?', ['Scroll up', 'Ctrl+R and type part of it', 'man history', 'cat /var/log/syslog'], 1, 'Ctrl+R = reverse incremental search.']],
  c: { t: 'Show your command history, then re-run the previous command with <code>!!</code>.', try: 'history', steps: [['Run history', ctx => okRun(ctx, 'history')], ['Use !! to repeat a command', ctx => /!!/.test(ctx.raw || '')]] },
});

/* ======================= FILES & FOLDERS ======================= */
lesson('touch', {
  n: 'touch', s: 'Creates an empty file, or updates the timestamp of an existing one.',
  an: 'Tapping a document with a date-stamp: if the page doesn\'t exist you get a fresh blank one; if it does, only the date on it changes.',
  nm: '<b>touch</b> — it “touches” a file to refresh its time.',
  sx: 'touch [OPTIONS] FILE...', p: [['touch', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', '-c don\'t create, -d set a specific date, -r copy another file\'s time.', false], ['FILE...', 'arg', 'One or more file names.', true]],
  ex1: 'touch hello.txt',
  sc: [['openat', 'opens the file, creating it if missing (O_CREAT) with mode 0666 & ~umask', 'openat(AT_FDCWD, "hello.txt", O_WRONLY|O_CREAT|O_NOCTTY|O_NONBLOCK, 0666) = 3'], ['utimensat', 'sets access & modification time to now', 'utimensat(3, NULL, NULL, 0) = 0'], ['close', 'closes the file', 'close(3) = 0']],
  ch: 'A new inode + directory entry if the file was missing (size 0, mode 644 with the default umask); otherwise just new timestamps.', out: 'Nothing on success.', ec: '0 = OK, 1 = e.g. permission denied or parent directory missing.',
  f: [['-c', '--no-create', 'Don\'t create missing files.', 'touch -c maybe.txt', true], ['-a', '', 'Change only the access time.', 'touch -a f', false], ['-m', '', 'Change only the modification time.', 'touch -m f', false], ['-d', '--date', 'Use a given date instead of now.', 'touch -d "2025-01-01" f', true], ['-r', '--reference', 'Copy timestamps from another file.', 'touch -r notes.txt f', false]],
  e: [['touch hello.txt', '', 'Creates an empty file.'], ['touch a.txt b.txt c.txt', '', 'Several files at once.'], ['touch notes.txt; ls -l notes.txt', '-rw-r--r-- 1 user user 104 Nov 18 09:3x notes.txt', 'Existing file: content kept, time updated.'], ['touch file{1..3}.txt', '', 'Brace expansion makes file1.txt file2.txt file3.txt (in real bash).'], ['touch docs/new.md && ls docs', 'new.md  readme.txt  report.txt  todo.md', 'Create inside another folder (it must exist).']],
  u: `<p>Every inode stores timestamps: <b>mtime</b> (content modified), <b>atime</b> (last read), <b>ctime</b> (metadata changed). Build tools like <code>make</code> compare mtimes to decide what to rebuild — touch is the classic way to force a rebuild.</p><p>New files get permissions <code>0666 &amp; ~umask</code>; with the usual umask 022 that is <code>644</code> (rw-r--r--). touch never puts content in a file.</p>`,
  adv: `<p>coreutils touch opens with <code>O_WRONLY|O_CREAT|O_NOCTTY|O_NONBLOCK</code> then calls <code>utimensat(fd, NULL, …)</code> (NULL = now). Creating requires w+x on the parent directory; updating times of a file you don't own requires write permission on it (to set "now") or ownership (to set an arbitrary time). ctime cannot be set by users at all.</p>`,
  mi: [['touch docs', 'docs exists (a directory) — only its timestamp changes, no file is created.', 'touch docs/newfile.txt'], ['touch newdir/file.txt', '“No such file or directory” if newdir doesn\'t exist; touch doesn\'t create folders.', 'mkdir -p newdir && touch newdir/file.txt'], ['touch "my file.txt" vs touch my file.txt', 'Without quotes you get TWO files: my and file.txt.', 'touch "my file.txt"']],
  safe: 'touch never removes or overwrites content — at worst it changes a timestamp.',
  r: [['mkdir', 'touch creates files; mkdir creates directories.'], ['redir', '> file also creates an empty file but would WIPE an existing one.'], ['stat', 'See the three timestamps touch changes.']],
  cs: ['<code>touch f</code> create empty file / refresh time', 'Never deletes content', 'New files: 644 (with umask 022)', '<code>touch -c</code> don\'t create', 'Parent directory must already exist'],
  q: [['What happens to the content of an existing file when you touch it?', ['It is erased', 'It is kept; only the timestamp changes', 'It is duplicated', 'It is compressed'], 1, 'touch only updates times for existing files.'], ['touch newdir/a.txt fails. Why?', ['touch can\'t make .txt files', 'newdir doesn\'t exist', 'You need sudo', 'a.txt is reserved'], 1, 'touch doesn\'t create missing parent directories.'], ['Which syscall actually sets the time?', ['write', 'utimensat', 'chmod', 'unlink'], 1, 'utimensat sets atime/mtime.']],
  c: { t: 'Create an empty file called <code>hello.txt</code> in your home directory.', try: 'touch hello.txt', chk: ctx => { const r = HP('hello.txt'); return r.n && r.n.t === 'f' && fsize(r.n) === 0; } },
});
lesson('mkdir', {
  n: 'mkdir', s: 'Creates new directories (folders).',
  an: 'Putting a new empty folder into a filing cabinet. With -p you can create a whole chain of folders-inside-folders in one go.',
  nm: '<b>m</b>a<b>k</b>e <b>dir</b>ectory.',
  sx: 'mkdir [OPTIONS] DIR...', p: [['mkdir', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', '-p create parents, -v verbose, -m set mode.', false], ['DIR...', 'arg', 'One or more directory paths to create.', true]],
  ex1: 'mkdir -p projects/app/src',
  sc: [['mkdir', 'asks the kernel to create each directory (mode 0777 & ~umask)', 'mkdir("projects/app", 0777) = 0'], ['mkdir (-p)', 'for -p, existing parents return EEXIST and are skipped', 'mkdir("projects", 0777) = -1 EEXIST (File exists)']],
  ch: 'A new inode of type directory plus an entry in the parent. Every new directory automatically contains <code>.</code> and <code>..</code>, so the parent\'s link count goes up by one.', out: 'Nothing (with -v: a line per created directory).', ec: '0 = created, 1 = already exists / parent missing / permission denied.',
  f: [['-p', '--parents', 'Create missing parent directories; no error if it already exists.', 'mkdir -p a/b/c', true], ['-v', '--verbose', 'Print each directory created.', 'mkdir -v new', true], ['-m', '--mode', 'Set permissions directly.', 'mkdir -m 700 private', true]],
  e: [['mkdir reports', '', 'One new folder in the current directory.'], ['mkdir a b c', '', 'Three folders at once.'], ['mkdir -p projects/app/src', '', 'Creates app and src even though app doesn\'t exist yet.'], ['mkdir -pv 2026/{jan,feb}', "mkdir: created directory '2026'…", 'Verbose, with brace expansion (real bash).'], ['mkdir -m 700 private && ls -ld private', 'drwx------ 2 user user 4096 … private', 'Private folder only you can enter.']],
  u: `<p>A directory is a file whose content is a list of names → inode numbers. A new one starts with two entries: <code>.</code> (itself) and <code>..</code> (its parent). That's why <code>ls -ld</code> on an empty dir shows a link count of 2.</p><p>Default permissions are <code>0777 &amp; ~umask</code> = <code>755</code> (rwxr-xr-x). To create a directory you need w and x permission on the parent.</p>`,
  adv: `<p>The <code>mkdir(2)</code> syscall goes through the VFS to the filesystem (ext4_mkdir), which allocates an inode, writes the initial directory block with . and .., increments the parent's i_nlink, and journals the change. -p is implemented in user space: mkdir walks the path and calls mkdir() for each component, ignoring EEXIST.</p>`,
  mi: [['mkdir a/b/c', '“No such file or directory” when a/b doesn\'t exist.', 'mkdir -p a/b/c'], ['mkdir my folder', 'Creates TWO folders: my and folder.', 'mkdir "my folder"'], ['mkdir /opt/app', '“Permission denied”: /opt belongs to root.', 'sudo mkdir /opt/app   # or work inside your home']],
  safe: 'mkdir only adds; it never overwrites. -p is safe to repeat.',
  r: [['touch', 'Creates files instead of directories.'], ['rm', 'rmdir / rm -r remove what mkdir made.'], ['cd', 'Enter the new directory.']],
  cs: ['<code>mkdir dir</code> create a folder', '<code>mkdir -p a/b/c</code> whole path, no error if exists', '<code>mkdir -m 700 d</code> set permissions', 'Quote names with spaces', 'New dirs: 755 with umask 022'],
  q: [['mkdir a/b/c fails because a doesn\'t exist. Fix?', ['mkdir -r', 'mkdir -p', 'mkdir -f', 'sudo mkdir'], 1, '-p creates missing parents.'], ['How many links does a brand-new empty directory have?', ['0', '1', '2', '3'], 2, 'Its name in the parent, and its own “.” entry.'], ['What does mkdir -p do if the directory already exists?', ['Error', 'Deletes it', 'Nothing, success', 'Renames it'], 2, '-p is idempotent.']],
  c: { t: 'Create the nested folders <code>projects/app/src</code> with a single command.', try: 'mkdir -p projects/app/src', chk: ctx => { const r = HP('projects/app/src'); return r.n && r.n.t === 'd'; } },
});
lesson('cp', {
  n: 'cp', s: 'Copies files or folders. The original stays untouched.',
  an: 'Photocopying a document: you get a brand-new sheet with the same text, and the original stays in the drawer.',
  nm: '<b>c</b>o<b>p</b>y.',
  sx: 'cp [OPTIONS] SOURCE... DESTINATION', p: [['cp', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', 'e.g. -r for folders, -i to ask before overwriting, -v to show what happens.', false], ['SOURCE...', 'arg', 'One or more files/folders to copy.', true], ['DESTINATION', 'arg', 'New file name, or an existing directory to copy into. With several sources it MUST be a directory.', true]],
  ex1: 'cp -v notes.txt backup/',
  sc: [['newfstatat', 'checks the destination: backup/ is a directory, so the target becomes backup/notes.txt', 'newfstatat(AT_FDCWD, "backup/", {st_mode=S_IFDIR|0755, …}, 0) = 0'], ['openat (read)', 'opens the source for reading → file descriptor 3', 'openat(AT_FDCWD, "notes.txt", O_RDONLY) = 3'], ['openat (create)', 'creates the destination → fd 4. A NEW inode is allocated — that\'s why it is a real copy', 'openat(AT_FDCWD, "backup/notes.txt", O_WRONLY|O_CREAT|O_EXCL, 0644) = 4'], ['read / write', 'copies the bytes in chunks until end of file (modern cp may use copy_file_range so the kernel copies directly)', 'copy_file_range(3, NULL, 4, NULL, 9223372035781033984, 0) = 104'], ['fchmod', 'copies the permission bits', 'fchmod(4, 0644) = 0'], ['close', 'closes both files', 'close(4) = 0; close(3) = 0']],
  ch: 'A new file (new inode) appears at the destination, or an existing destination file is <b>overwritten without asking</b>. The source is unchanged.', out: 'Nothing by default. With -v: <code>\'notes.txt\' -> \'backup/notes.txt\'</code>.', ec: '0 = all copied, 1 = at least one error (missing source, directory without -r, permission denied).',
  f: [['-r', '--recursive', 'Copy directories and everything inside them (also -R).', 'cp -r docs backup/', true], ['-i', '--interactive', 'Ask before overwriting an existing file.', 'cp -i a.txt b.txt', true], ['-v', '--verbose', 'Print each file as it is copied.', 'cp -v a b', true], ['-p', '--preserve', 'Keep mode, owner and timestamps.', 'cp -p f backup/', true], ['-a', '--archive', 'Exact copy of a tree: -r + preserve everything + keep symlinks.', 'cp -a docs docs.bak', true], ['-n', '--no-clobber', 'Never overwrite existing files.', 'cp -n a b', false], ['-u', '--update', 'Copy only if the source is newer than the destination.', 'cp -u *.txt backup/', false], ['-f', '--force', 'Overwrite even if the destination can\'t be opened (removes it first).', 'cp -f a b', false], ['-l', '--link', 'Make hard links instead of copying data.', 'cp -l big.iso link.iso', false]],
  e: [['cp notes.txt notes.bak', '', 'Copy under a new name in the same folder.'], ['cp -v notes.txt backup/', "'notes.txt' -> 'backup/notes.txt'", 'Copy into a folder, keeping the name.'], ['cp fruits.txt data.csv backup/', '', 'Several sources → destination must be a directory.'], ['cp -r docs backup/', '', 'Copy a whole folder (needs -r).'], ['cp -a projects projects.bak', '', 'Perfect clone: permissions, times, links preserved.'], ['cp -i notes.txt backup/notes.txt', "cp: overwrite 'backup/notes.txt'?", 'Safe mode asks first.']],
  u: `<p><b>Inodes:</b> a file's data and metadata live in an inode; a file name is just a directory entry pointing at it. cp creates a <b>new inode</b> and copies the bytes, so the copy is completely independent — editing one never affects the other (compare with hard links, where two names share ONE inode).</p><p>Check it yourself: <code>ls -i notes.txt backup/notes.txt</code> shows two different inode numbers.</p><p>By default the copy is owned by <b>you</b>, gets the current time as its modification time, and keeps the permission bits (minus your umask). Use <code>-p</code> or <code>-a</code> to preserve owner/times.</p>`,
  adv: `<p>GNU cp 9.x first tries <code>copy_file_range(2)</code> (in-kernel copy, may use reflinks on Btrfs/XFS: instant copy-on-write), falls back to <code>sendfile</code>/read+write with a buffer sized from <code>st_blksize</code>. Sparse files are detected via <code>SEEK_DATA/SEEK_HOLE</code>. With <code>--reflink=auto</code> on a CoW filesystem the copy shares blocks until one side changes. Destination creation uses <code>O_EXCL</code> to avoid races; when overwriting, it opens with <code>O_TRUNC</code> instead (same inode).</p>`,
  mi: [['cp docs backup', '“-r not specified; omitting directory ‘docs’” — folders need -r.', 'cp -r docs backup/'], ['cp report.txt important.txt', 'If important.txt exists it is OVERWRITTEN silently.', 'cp -i report.txt important.txt'], ['cp a.txt b.txt dir   (dir doesn\'t exist)', '“target ‘dir’ is not a directory” — with several sources the last argument must be an existing directory.', 'mkdir dir && cp a.txt b.txt dir/'], ['cp *.log backup (wanting timestamps kept)', 'Modification times become “now”.', 'cp -p *.log backup/']],
  w: 'cp <b>overwrites existing files without asking</b>. Protect yourself with <code>cp -i</code> (or <code>alias cp="cp -i"</code> in ~/.bashrc), <code>cp -n</code> to never overwrite, or <code>cp --backup=numbered</code> to keep the old version.',
  r: [['mv', 'mv moves/renames (no second copy); cp duplicates.'], ['rsync', 'Better for big or repeated copies: only transfers what changed, can resume, works over SSH.'], ['scp', 'Copy to/from another machine.'], ['ln', 'A hard link is a second NAME for the same data — no copy at all.']],
  cs: ['<code>cp src dst</code> copy a file', '<code>cp -r dir dst/</code> copy a folder', '<code>cp -i</code> ask before overwrite · <code>-v</code> verbose', '<code>cp -a</code> exact clone (perms, times, links)', 'A copy = new inode, fully independent'],
  q: [['Why does cp docs backup fail?', ['docs is too big', 'Directories need -r', 'backup is read-only', 'cp can\'t copy to folders'], 1, 'Without -r, cp skips directories.'], ['After cp notes.txt copy.txt, do the two files share an inode?', ['Yes', 'No — the copy gets a new inode', 'Only if on the same disk', 'Only with -v'], 1, 'cp allocates a new inode and copies the data.'], ['Which option prevents accidental overwriting?', ['-v', '-r', '-i', '-a'], 2, '-i asks for confirmation (-n refuses outright).']],
  c: { t: 'Copy the <code>docs</code> folder into <code>backup</code> (so <code>backup/docs/report.txt</code> exists).', try: 'cp -r docs backup/', chk: ctx => { const r = HP('backup/docs/report.txt'); return !!r.n && has('docs/report.txt'); } },
});
lesson('mv', {
  n: 'mv', s: 'Moves or renames files and folders.',
  an: 'Moving a book from one shelf to another — or relabeling its spine. It is still the same book; no copy is made.',
  nm: '<b>m</b>o<b>v</b>e.',
  sx: 'mv [OPTIONS] SOURCE... DESTINATION', p: [['mv', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', '-i ask, -n never overwrite, -v verbose.', false], ['SOURCE...', 'arg', 'File(s)/folder(s) to move.', true], ['DESTINATION', 'arg', 'New name, or an existing directory to move into.', true]],
  ex1: 'mv notes.txt notes-old.txt',
  sc: [['newfstatat', 'checks whether the destination exists / is a directory', 'newfstatat(AT_FDCWD, "notes-old.txt", …) = -1 ENOENT'], ['renameat2', 'on the same filesystem: ONE syscall that rewrites directory entries — the data never moves', 'renameat2(AT_FDCWD, "notes.txt", AT_FDCWD, "notes-old.txt", RENAME_NOREPLACE) = 0'], ['(cross-filesystem)', 'rename fails with EXDEV, so mv falls back to copy + unlink', 'renameat2(…) = -1 EXDEV (Invalid cross-device link)']],
  ch: 'The name/location changes; the inode (and data) stays the same on the same filesystem. An existing destination file is overwritten silently.', out: 'Nothing (with -v: <code>renamed \'a\' -> \'b\'</code>).', ec: '0 = OK, 1 = error.',
  f: [['-i', '--interactive', 'Ask before overwriting.', 'mv -i a b', true], ['-n', '--no-clobber', 'Never overwrite.', 'mv -n a b', true], ['-v', '--verbose', 'Show what is moved.', 'mv -v a dir/', true], ['-f', '--force', 'Don\'t ask (overrides -i).', 'mv -f a b', false], ['-u', '--update', 'Move only if source is newer.', 'mv -u *.txt dir/', false], ['-b', '--backup', 'Keep a backup of an overwritten file (name~).', 'mv -b a b', false], ['-t', '--target-directory', 'Name the destination first.', 'mv -t backup/ a b', false]],
  e: [['mv notes.txt notes-old.txt', '', 'Rename in place.'], ['mv notes-old.txt docs/', '', 'Move into a folder, same name.'], ['mv fruits.txt data.csv backup/', '', 'Move several files at once.'], ['mv projects/website projects/site', '', 'Folders move/rename without -r.'], ['mv -v docs/readme.txt .', "renamed 'docs/readme.txt' -> './readme.txt'", 'Bring a file into the current directory (.).'], ['mv -i data.csv backup/data.csv', "mv: overwrite 'backup/data.csv'?", 'Ask first if the target exists.']],
  u: `<p><b>Why mv is instant</b> on the same filesystem, even for a 50 GB file: the data never moves. A file name is just an entry in a directory pointing at an inode, so mv only removes the old entry and adds a new one (<code>rename()</code>). Check: <code>ls -i</code> before and after shows the same inode number.</p><p><b>Across filesystems</b> (e.g. home → USB stick) inodes can't be shared, so mv copies all the data, then deletes the original. That takes time, and if interrupted you may end up with a partial copy.</p><p>To rename you need write permission on the <b>directory</b>, not on the file.</p>`,
  adv: `<p><code>rename(2)</code> is atomic on POSIX: other processes see either the old or the new name, never neither — that's why programs write a temp file and rename it over the real one for crash-safe updates. <code>renameat2</code> flags: <code>RENAME_NOREPLACE</code> (mv -n), <code>RENAME_EXCHANGE</code> (swap two names atomically). Moving a directory updates its <code>..</code> entry and the link counts of both parents.</p>`,
  mi: [['mv report.txt backup   (backup doesn\'t exist)', 'Renames report.txt to a FILE named backup — no folder is created.', 'mkdir backup && mv report.txt backup/'], ['mv a.txt existing.txt', 'existing.txt is silently replaced and its old content is gone.', 'mv -i a.txt existing.txt'], ['mv *.TXT *.txt (trying to rename many)', 'The globs expand to a list; mv moves files into the last one (or fails).', 'for f in *.TXT; do mv "$f" "\${f%.TXT}.txt"; done']],
  w: 'mv <b>overwrites the destination without asking</b> — the old file is gone (no recycle bin). Use <code>mv -i</code> or <code>mv -n</code>, or <code>alias mv="mv -i"</code>.',
  r: [['cp', 'Use cp to keep the original.'], ['rename', 'Batch-rename with patterns.'], ['rsync', 'Robust large moves across disks (rsync --remove-source-files).']],
  cs: ['<code>mv old new</code> rename', '<code>mv f dir/</code> move into a folder', 'Folders need no -r', 'Same filesystem = instant (only names change)', '<code>-i</code> ask · <code>-n</code> never overwrite'],
  q: [['Why is moving a 10 GB file inside the same disk instant?', ['mv compresses it', 'Only the directory entry changes; the data stays put', 'mv runs in the background', 'It isn\'t instant'], 1, 'rename() just edits directory entries.'], ['What happens with mv a.txt b.txt if b.txt exists?', ['Error', 'b.txt is overwritten', 'Both are merged', 'a.txt is renamed to b.txt.1'], 1, 'Silently replaced unless -i/-n.'], ['Does moving a file across two disks keep the same inode number?', ['Yes', 'No — it is copied, then the original deleted', 'Only with -p', 'Only for small files'], 1, 'Inodes belong to one filesystem.']],
  c: { t: 'Rename <code>notes.txt</code> to <code>notes-old.txt</code>.', try: 'mv notes.txt notes-old.txt', chk: ctx => has('notes-old.txt') && !has('notes.txt') },
});
lesson('rm', {
  n: 'rm', s: 'Deletes files (and, with -r, folders). There is no recycle bin.',
  an: 'Shredding a page, not putting it in a bin. Strictly, it\'s more like tearing the label off a box in the warehouse: the box is marked “free space” and will be reused — but you can\'t find it anymore.',
  nm: '<b>r</b>e<b>m</b>ove.',
  sx: 'rm [OPTIONS] FILE...', p: [['rm', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', '-r for folders, -i to confirm, -f to force/ignore missing.', false], ['FILE...', 'arg', 'What to delete.', true]],
  ex1: 'rm logs/access.log',
  sc: [['newfstatat', 'checks what the target is (file or directory)', 'newfstatat(AT_FDCWD, "logs/access.log", …, AT_SYMLINK_NOFOLLOW) = 0'], ['unlinkat', 'removes the directory entry; the inode\'s link count drops', 'unlinkat(AT_FDCWD, "logs/access.log", 0) = 0'], ['unlinkat (dirs)', 'with -r: files deepest-first, then each empty directory', 'unlinkat(AT_FDCWD, "a/b", AT_REMOVEDIR) = 0']],
  ch: 'The name disappears from its directory. When the link count reaches 0 and no process has the file open, the inode and data blocks are marked free.', out: 'Nothing (with -v: <code>removed \'x\'</code>).', ec: '0 = OK, 1 = some file couldn\'t be removed.',
  f: [['-r', '--recursive', 'Delete directories and everything inside (also -R).', 'rm -r olddir', true], ['-i', '--interactive', 'Ask before every removal.', 'rm -i *.txt', true], ['-I', '', 'Ask once before deleting >3 files or recursing.', 'rm -rI dir', false], ['-f', '--force', 'Never ask; ignore missing files.', 'rm -f maybe.tmp', true], ['-v', '--verbose', 'Print each file removed.', 'rm -v a', true], ['-d', '--dir', 'Remove empty directories.', 'rm -d emptydir', false], ['--preserve-root', '', 'Default: refuse to operate on / recursively.', '', false]],
  e: [['rm out.txt', '', 'Delete one file.'], ['rm -v *.tmp', "removed 'a.tmp'", 'Glob + verbose.'], ['rm -i data.csv', "rm: remove regular file 'data.csv'?", 'Confirm first.'], ['rm -r projects/website', '', 'Delete a folder and all its content.'], ['rm -rf /', "rm: it is dangerous to operate recursively on '/'", 'The famous footgun is blocked by --preserve-root (in the simulator too).'], ['rmdir backup', '', 'rmdir only deletes EMPTY folders — a safer alternative.']],
  u: `<p><b>rm calls unlink()</b>, which removes a <i>name</i>. The inode keeps a <b>link count</b>; the data is freed only when the count reaches 0 <i>and</i> no process has the file open. Consequences:</p><ul><li>If a program still writes to a deleted log file, disk space is NOT freed until the program closes it (<code>lsof | grep deleted</code>).</li><li>Deleted data isn't erased — blocks are just marked free and may be recoverable until overwritten. Use <code>shred</code> for sensitive files (not reliable on SSDs/journaling filesystems).</li><li>There is <b>no recycle bin</b> on the command line.</li></ul><p>Deleting needs write permission on the <b>directory</b>, not on the file. rm asks “remove write-protected file?” when the file itself is read-only.</p>`,
  adv: `<p>For -r, GNU rm uses <code>fts</code> to walk the tree, calling <code>unlinkat(dirfd, name, 0)</code> for files and <code>unlinkat(dirfd, name, AT_REMOVEDIR)</code> for directories after emptying them. In the kernel, <code>vfs_unlink</code> drops the dentry and decrements <code>inode->i_nlink</code>; when both i_nlink and the open-file reference count are 0, <code>evict()</code> frees the inode and returns blocks to the allocator. On a sticky directory (/tmp) you may delete only files you own.</p>`,
  mi: [['rm -rf / tmp/junk  (stray space)', 'Tries to delete / AND tmp/junk. --preserve-root saves you here, but rm -rf ~ /junk would wipe your home.', 'rm -rf /tmp/junk   # check for spaces!'], ['rm -rf $DIR/*  with DIR unset', 'Expands to rm -rf /* — catastrophic.', 'rm -rf "\${DIR:?}"/*   # aborts if DIR is empty'], ['rm docs', '“Is a directory”.', 'rm -r docs   # or rmdir docs if empty'], ['rm * .bak  (meant *.bak)', 'The space makes it delete EVERYTHING in the folder, then “.bak not found”.', 'rm *.bak   # preview first with: ls *.bak']],
  w: '<b>rm is permanent.</b> There is no undo and no trash. Before running it: preview with <code>ls</code> using the exact same pattern; prefer <code>rm -i</code>/<code>-I</code> (or <code>alias rm="rm -I"</code>); never run <code>rm -rf</code> with variables that might be empty; keep backups; consider <code>trash-cli</code> (<code>trash-put</code>) for a recycle bin.',
  r: [['rmdir', 'Only removes empty directories — can\'t destroy content by accident.'], ['find', 'find … -delete removes files matching tests (size, age).'], ['mv', 'Move to a “trash” folder instead of deleting.'], ['unlink', 'Removes exactly one file name, no options.']],
  cs: ['<code>rm f</code> delete file · <code>rm -r dir</code> folder', 'No undo, no recycle bin', '<code>-i</code> confirm · <code>-I</code> confirm once', 'Preview the pattern with <code>ls</code> first', 'Space is freed only when no process holds the file open'],
  q: [['Where do files go after rm?', ['The trash folder', '/tmp', 'Nowhere — the name is removed and blocks marked free', 'Into a backup'], 2, 'There is no recycle bin.'], ['Which option asks for confirmation?', ['-f', '-r', '-i', '-v'], 2, '-i = interactive.'], ['A 5 GB log is deleted but df shows no free space gained. Why?', ['rm failed', 'A process still has the file open', 'df is cached', 'Linux reserves it'], 1, 'Data is freed when the last open handle closes.']],
  c: { t: 'Delete the file <code>logs/access.log</code>.', try: 'rm logs/access.log', chk: ctx => !has('logs/access.log') && has('logs') },
});
lesson('cat', {
  n: 'cat', s: 'Prints the contents of files to the screen (and can join files together).',
  an: 'Reading a document out loud from start to finish, no pauses. Give it several documents and it reads them one after another — that\'s “concatenating”.',
  nm: 'con<b>cat</b>enate (join together).',
  sx: 'cat [OPTIONS] [FILE]...', p: [['cat', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', '-n number lines, -A show hidden characters.', false], ['[FILE]...', 'arg', 'Files to print in order. No file (or -) = read stdin.', false]],
  ex1: 'cat -n notes.txt',
  sc: [['openat', 'opens each file read-only', 'openat(AT_FDCWD, "notes.txt", O_RDONLY) = 3'], ['fstat', 'gets the size/block size to choose a buffer', 'fstat(3, {st_mode=S_IFREG|0644, st_size=104, …}) = 0'], ['read', 'reads a chunk (128 KiB) into memory', 'read(3, "Linux notes\\n- everything is a f"…, 131072) = 104'], ['write', 'writes it to stdout', 'write(1, "     1\\tLinux notes\\n…", 140) = 140'], ['read → 0', 'end of file', 'read(3, "", 131072) = 0'], ['close', 'closes the file', 'close(3) = 0']],
  ch: 'Nothing — read only. (cat a b > c creates/overwrites c.)', out: 'The file contents on stdout, unchanged. Errors (missing file) on stderr.', ec: '0 = all files printed, 1 = at least one couldn\'t be read.',
  f: [['-n', '--number', 'Number all output lines.', 'cat -n notes.txt', true], ['-b', '--number-nonblank', 'Number only non-empty lines.', 'cat -b f', false], ['-A', '--show-all', 'Show tabs as ^I and line ends as $ (reveals hidden whitespace).', 'cat -A data.csv', true], ['-s', '--squeeze-blank', 'Collapse repeated blank lines.', 'cat -s f', false], ['-E', '--show-ends', 'Show $ at line ends.', 'cat -E f', false]],
  e: [['cat notes.txt', 'Linux notes\n- everything is a file\n…', 'Print a file.'], ['cat -n fruits.txt', '     1\tbanana\n     2\tapple…', 'With line numbers.'], ['cat docs/readme.txt docs/report.txt', '', 'Two files back to back.'], ['cat docs/*.txt > all.txt', '', 'Concatenate into a new file.'], ['cat -A data.csv | head -2', 'name,dept,salary,city$\nalice,eng,95000,Berlin$', 'See invisible characters.'], ['echo hi | cat', 'hi', 'No file → cat copies stdin to stdout.']],
  u: `<p>cat is the simplest possible “filter”: read input, write output. With no file it reads <b>stdin</b> — which is why typing just <code>cat</code> seems to hang: it waits for your keyboard (press Ctrl+D for end-of-file).</p><p>For long files cat floods the screen; use <code>less</code> to page or <code>head</code>/<code>tail</code> for parts. Binary files can garble your terminal (fix with <code>reset</code>).</p><p>“Useless use of cat”: <code>cat file | grep x</code> works, but <code>grep x file</code> saves a process.</p>`,
  adv: `<p>coreutils cat uses <code>io_blksize</code> (≥128 KiB) buffers and, when no options are given and the output is a pipe or file, may use <code>copy_file_range</code>/<code>splice</code> to move data without copying it through user space. If input and output are the same file (<code>cat f >> f</code>), it detects it via st_dev/st_ino and refuses: “input file is output file”.</p>`,
  mi: [['cat', 'Seems frozen — it is reading your keyboard.', 'Press Ctrl+D (or Ctrl+C) and give a file name'], ['cat bigfile.log', 'Thousands of lines scroll past.', 'less bigfile.log   # or tail -n 50'], ['cat a.txt > a.txt', 'The shell empties a.txt BEFORE cat runs — the file ends up empty.', 'cat a.txt > tmp && mv tmp a.txt']],
  safe: 'cat itself only reads. Danger only comes from redirection: cat x > existing_file overwrites it.',
  r: [['less', 'For long files: scroll and search.'], ['head', 'Only the beginning.'], ['tail', 'Only the end (and follow with -f).'], ['tee', 'Write to a file AND the screen.']],
  cs: ['<code>cat f</code> show a file', '<code>cat -n</code> numbered lines', '<code>cat a b > c</code> join files', 'No file → reads stdin (Ctrl+D ends)', 'Long file? use <code>less</code>'],
  q: [['What does cat stand for?', ['catalog', 'concatenate', 'capture all text', 'category'], 1, 'It joins (concatenates) files.'], ['You type just “cat” and nothing happens. Why?', ['It crashed', 'It is waiting for input on stdin', 'No permission', 'The file is empty'], 1, 'Without a file name, cat reads the keyboard until Ctrl+D.'], ['Which shows line numbers?', ['cat -l', 'cat -n', 'cat -A', 'cat -s'], 1, '-n numbers lines.']],
  c: { t: 'Show <code>notes.txt</code> (or <code>notes-old.txt</code>) <b>with line numbers</b>.', try: 'cat -n notes.txt', chk: ctx => okRun(ctx, 'cat') && /-\w*n|-b/.test(ctx.line) },
});
lesson('less', {
  n: 'less', s: 'Shows a file one screen at a time, with scrolling and search.',
  an: 'A book reader app: you turn pages forward and back and can search for a word — instead of having the whole book read aloud at once (cat).',
  nm: '<b>less</b> — an improved successor of the older pager “more” (“less is more”).',
  sx: 'less [OPTIONS] FILE...', p: [['less', 'cmd', 'The pager.', true], ['[OPTIONS]', 'opt', '-N line numbers, -S don\'t wrap long lines, +F follow.', false], ['FILE...', 'arg', 'File(s) to view, or stdin from a pipe.', false]],
  ex1: 'less logs/app.log',
  sc: [['openat', 'opens the file', 'openat(AT_FDCWD, "logs/app.log", O_RDONLY) = 3'], ['ioctl', 'asks the terminal its size to know how many lines fit', 'ioctl(1, TIOCGWINSZ, {ws_row=40, ws_col=120}) = 0'], ['read (on demand)', 'reads only the parts you scroll to — fast even for huge files', 'read(3, "2026-11-18 09:00:12 INFO …", 65536) = 65536'], ['read (keyboard)', 'waits for your key presses on the terminal', 'read(2, "q", 1) = 1']],
  ch: 'Nothing.', out: 'An interactive full-screen view (the simulator prints the content with an “(END)” marker).', ec: '0.',
  f: [['-N', '--LINE-NUMBERS', 'Show line numbers.', 'less -N notes.txt', true], ['-S', '--chop-long-lines', 'Don\'t wrap long lines (scroll sideways).', 'less -S data.csv', false], ['+F', '', 'Follow mode, like tail -f (Ctrl+C to stop).', 'less +F logs/app.log', true], ['-i', '--ignore-case', 'Case-insensitive search.', 'less -i f', false], ['-R', '--RAW-CONTROL-CHARS', 'Show colours from piped commands.', 'grep --color=always x f | less -R', false]],
  e: [['less logs/app.log', '', 'Page through a log.'], ['less -N notes.txt', '', 'With line numbers.'], ['ps aux | less', '', 'Page any command\'s output.'], ['less +F logs/app.log', '', 'Watch a log grow (press F inside less to switch on).'], ['man ls', '', 'man uses less too — same keys.']],
  u: `<p><b>Keys inside less:</b> Space / PgDn = next page · b = back · ↑↓ = line · g / G = start / end · <code>/text</code> search forward · <code>?text</code> backward · n / N = next / previous match · F = follow · q = quit · h = help.</p><p>less doesn't load the whole file, so it opens multi-gigabyte logs instantly — unlike an editor.</p>`,
  adv: `<p>less puts the terminal into raw/noncanonical mode with <code>tcsetattr</code> so each key arrives immediately, uses the alternate screen buffer (smcup/rmcup terminfo capabilities), and keeps an LRU of file blocks. When input is a pipe it buffers what it has read so you can scroll back. <code>LESSOPEN</code> preprocessors let it show .gz files directly (zless).</p>`,
  mi: [['Typing commands while less is open', 'Keys are interpreted by less (e.g. “d” scrolls).', 'Press q first'], ['less dir/', '“dir is a directory”.', 'ls dir/'], ['Using cat for a 10,000-line file', 'Floods the terminal; you only see the end.', 'less file']],
  safe: 'less is read-only. (Pressing v opens an editor — then you could change the file.)',
  r: [['cat', 'Dump the whole file at once — good for short files.'], ['head', 'First lines only, non-interactive.'], ['tail', 'Last lines / follow a growing file.'], ['man', 'Uses less to display manuals.']],
  cs: ['<code>less f</code> page through a file · <b>q</b> quit', 'Space / b = page down / up', '<code>/word</code> search · n next', 'g top · G bottom · F follow', 'Works on pipes: <code>cmd | less</code>'],
  q: [['How do you search for “ERROR” inside less?', ['Ctrl+F ERROR', '/ERROR', 'grep ERROR', ':find ERROR'], 1, 'Type / then the text, Enter; n jumps to the next match.'], ['Why is less fast on huge files?', ['It compresses them', 'It only reads the parts you look at', 'It uses the GPU', 'It isn\'t'], 1, 'It reads on demand.'], ['Which key quits less?', ['x', 'Esc', 'q', 'Ctrl+Q'], 2, 'q quits.']],
  c: { t: 'Open <code>logs/app.log</code> in the pager.', try: 'less logs/app.log', chk: ctx => okRun(ctx, 'less') || okRun(ctx, 'more') },
});
lesson('head', {
  n: 'head', s: 'Shows the first lines of a file (10 by default).',
  an: 'Reading only the headline and first paragraph of a newspaper article.',
  nm: '<b>head</b> — the top part.',
  sx: 'head [OPTIONS] [FILE]...', p: [['head', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', '-n N lines, -c N bytes.', false], ['[FILE]...', 'arg', 'Files (or stdin).', false]],
  ex1: 'head -n 3 logs/app.log',
  sc: [['openat', 'opens the file', 'openat(AT_FDCWD, "logs/app.log", O_RDONLY) = 3'], ['read', 'reads one buffer — usually enough for 10 lines', 'read(3, "2026-11-18 09:00:12 INFO request…", 8192) = 8192'], ['write', 'writes the first N lines', 'write(1, "2026-11-18 09:00:12 INFO …\\n…", 196) = 196'], ['close', 'stops reading — the rest of the file is never read', 'close(3) = 0']],
  ch: 'Nothing.', out: 'The first N lines. With several files, each block starts with <code>==> name <==</code>.', ec: '0 = OK, 1 = a file couldn\'t be read.',
  f: [['-n N', '--lines=N', 'Show the first N lines.', 'head -n 5 f', true], ['-N', '', 'Short form of -n N.', 'head -3 f', true], ['-n -N', '', 'All lines EXCEPT the last N.', 'head -n -2 f', false], ['-c N', '--bytes=N', 'First N bytes.', 'head -c 20 f', false], ['-q', '--quiet', 'No ==> name <== headers.', 'head -q a b', false]],
  e: [['head logs/app.log', '', 'First 10 lines.'], ['head -n 3 logs/app.log', '', 'First 3 lines.'], ['head -1 data.csv', 'name,dept,salary,city', 'Just the CSV header.'], ['ls -t | head -3', '', 'The 3 most recently changed files.'], ['sort -t, -k3 -nr data.csv | head -2', '', 'Top 2 salaries: numeric sort on field 3, highest first (the text header sorts as 0, i.e. last).'], ['head -c 11 notes.txt', 'Linux notes', 'First 11 bytes.']],
  u: `<p>head stops reading as soon as it has enough lines, so <code>head</code> on a 100 GB file is instant. In a pipeline, when head exits, the command before it gets <b>SIGPIPE</b> the next time it writes and stops too — so <code>yes | head -3</code> terminates.</p>`,
  adv: `<p>For <code>-n -N</code> (all but last N) head must buffer, since it can't know where the end is until EOF. When the upstream writer hits a closed pipe, write() returns EPIPE and the kernel sends SIGPIPE (default action: terminate), which is why pipelines with head clean up quickly.</p>`,
  mi: [['head -5 -n data.csv', 'Mixed-up option order → error.', 'head -n 5 data.csv'], ['head file1 file2 | wc -l', 'Counts the ==> headers too.', 'head -q file1 file2 | wc -l'], ['Using head to read the END of a file', 'head shows the beginning.', 'tail file']],
  safe: 'head is read-only.',
  r: [['tail', 'The end instead of the beginning.'], ['less', 'Scroll through everything.'], ['sed', 'sed -n "5,10p" prints any range of lines.']],
  cs: ['<code>head f</code> first 10 lines', '<code>head -n 3 f</code> / <code>head -3 f</code>', '<code>head -1 file.csv</code> = header row', '<code>cmd | head</code> limit any output', 'Stops early → fast on huge files'],
  q: [['How many lines does head show by default?', ['5', '10', '20', 'All'], 1, '10 lines.'], ['How to show the first 3 lines of f?', ['head 3 f', 'head -n 3 f', 'head -l 3 f', 'head f 3'], 1, '-n 3 (or -3).'], ['Why does “yes | head -2” stop?', ['yes has a limit', 'head exits and yes gets SIGPIPE', 'The pipe fills up', 'It doesn\'t stop'], 1, 'Writing to a closed pipe kills the writer with SIGPIPE.']],
  c: { t: 'Show only the first <b>3</b> lines of <code>logs/app.log</code>.', try: 'head -n 3 logs/app.log', chk: ctx => okRun(ctx, 'head') && lines(outOf(ctx)).length === 3 },
});
lesson('tail', {
  n: 'tail', s: 'Shows the last lines of a file (10 by default) — and can follow it as it grows.',
  an: 'Reading the last page of a diary to see the most recent entries; with -f you sit and watch new entries being written.',
  nm: '<b>tail</b> — the end part.',
  sx: 'tail [OPTIONS] [FILE]...', p: [['tail', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', '-n N, -f follow, -F follow by name.', false], ['[FILE]...', 'arg', 'Files (or stdin).', false]],
  ex1: 'tail -n 5 logs/app.log',
  sc: [['openat', 'opens the file', 'openat(AT_FDCWD, "logs/app.log", O_RDONLY) = 3'], ['lseek', 'jumps near the END of the file instead of reading from the start', 'lseek(3, -8192, SEEK_END) = 2508389'], ['read', 'reads the last block and counts newlines backwards', 'read(3, "…", 8192) = 8192'], ['write', 'prints the last N lines', 'write(1, "…", 270) = 270'], ['inotify (-f)', 'with -f: waits for the kernel to report changes', 'inotify_add_watch(4, "logs/app.log", IN_MODIFY) = 1']],
  ch: 'Nothing.', out: 'The last N lines; with -f, keeps printing new lines until Ctrl+C.', ec: '0 = OK, 1 = error.',
  f: [['-n N', '--lines=N', 'Show the last N lines.', 'tail -n 20 f', true], ['-f', '--follow', 'Keep the file open and print new lines as they are appended.', 'tail -f /var/log/syslog', true], ['-F', '', 'Follow by name: survives log rotation (file replaced).', 'tail -F app.log', true], ['-n +N', '', 'Start at line N (skip the first N-1).', 'tail -n +2 data.csv', true], ['-c N', '--bytes=N', 'Last N bytes.', 'tail -c 100 f', false], ['-q', '--quiet', 'No headers with multiple files.', 'tail -q a b', false]],
  e: [['tail logs/app.log', '', 'Last 10 lines.'], ['tail -n 5 logs/app.log', '', 'Last 5.'], ['tail -n +2 data.csv', 'alice,eng,95000,Berlin\n…', 'Everything except the header line.'], ['tail -f logs/app.log', '', 'Watch a log live (simulated: stops at once).'], ['history | tail -3', '', 'Your last three commands.'], ['tail -n 2 logs/error.log logs/app.log', '==> logs/error.log <==\n…', 'Several files with headers.']],
  u: `<p>Logs grow at the end, so <code>tail</code> is the #1 troubleshooting tool: <code>tail -n 50 /var/log/syslog</code>, <code>tail -f app.log</code> while reproducing a bug. Combine with grep: <code>tail -f app.log | grep ERROR</code>.</p><p><code>-f</code> follows the open file descriptor; if the log is rotated (renamed and recreated), use <code>-F</code> to reopen the new file by name.</p>`,
  adv: `<p>tail seeks from the end (<code>lseek(fd, -bufsize, SEEK_END)</code>) and scans backwards for newlines, so it's O(N lines) not O(file size). For -f, GNU tail uses <code>inotify(7)</code> to sleep until IN_MODIFY, falling back to polling every second on filesystems that don't support it (some network mounts). On pipes it can't seek and must read everything.</p>`,
  mi: [['tail -f file | grep x | head', 'grep may buffer output, so nothing appears for a long time.', 'tail -f file | grep --line-buffered x'], ['tail -f rotated.log', 'After rotation it keeps watching the old, renamed file.', 'tail -F rotated.log'], ['tail -n 2 data.csv (wanting all but the header)', 'Only 2 lines.', 'tail -n +2 data.csv']],
  safe: 'tail is read-only.',
  r: [['head', 'Beginning instead of end.'], ['less', 'less +F also follows, but lets you scroll back.'], ['journalctl', 'journalctl -f follows systemd logs.']],
  cs: ['<code>tail f</code> last 10 lines', '<code>tail -n 50 f</code>', '<code>tail -f log</code> follow live (Ctrl+C stops)', '<code>tail -F</code> survives log rotation', '<code>tail -n +2</code> skip the first line'],
  q: [['Which option follows a growing file?', ['-g', '-f', '-r', '-l'], 1, '-f = follow.'], ['How to print data.csv without its header line?', ['tail -n 1', 'tail -n +2', 'head -n -1', 'tail -c 2'], 1, '+2 means start from line 2.'], ['How does tail -f learn about new data efficiently?', ['It re-reads the file every ms', 'inotify notifications from the kernel', 'It asks the disk', 'Cron'], 1, 'inotify wakes it up on changes.']],
  c: { t: 'Show the last <b>5</b> lines of <code>logs/app.log</code>.', try: 'tail -n 5 logs/app.log', chk: ctx => okRun(ctx, 'tail') && lines(outOf(ctx)).length === 5 },
});
