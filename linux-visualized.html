lesson('ip', {
  n: 'ip', s: 'Shows and configures network interfaces, IP addresses and routes (replaces ifconfig/route).',
  an: 'The building\'s network map: which doors (interfaces) exist, which address is painted on each, and which road (route) leads where.',
  nm: '<b>ip</b> (from the iproute2 suite).',
  sx: 'ip [-br] OBJECT [COMMAND]   (OBJECT: addr | link | route | neigh)', p: [['ip', 'cmd', 'The command.', true], ['[-br]', 'opt', 'Brief, one line per interface.', false], ['OBJECT', 'arg', 'addr (a), link (l), route (r), neigh (n).', true], ['[COMMAND]', 'arg', 'show (default), add, del, set… (changes need root).', false]],
  ex1: 'ip addr',
  sc: [['socket(AF_NETLINK)', 'opens a netlink socket to talk to the kernel\'s network stack', 'socket(AF_NETLINK, SOCK_RAW|SOCK_CLOEXEC, NETLINK_ROUTE) = 3'], ['sendmsg RTM_GETADDR', 'asks for all addresses', 'sendmsg(3, {…RTM_GETADDR…}, 0) = 40'], ['recvmsg', 'receives the answer and prints it', 'recvmsg(3, {…}, 0) = 1300']],
  ch: 'show: nothing. add/del/set (root): live network config (lost at reboot unless saved in netplan/NetworkManager).', out: 'Interfaces with state, MAC (link/ether), IPv4 (inet) and IPv6 (inet6) addresses; or the routing table.', ec: '0, non-zero on errors.',
  f: [['a / addr', '', 'Addresses of all interfaces.', 'ip a', true], ['-br a', '', 'Brief table.', 'ip -br a', true], ['r / route', '', 'Routing table; “default via” = gateway.', 'ip r', true], ['l / link', '', 'Interfaces and their state/MAC.', 'ip link', false], ['n / neigh', '', 'ARP/neighbour cache (IP → MAC).', 'ip neigh', false], ['addr add', '', 'Add an address (root).', 'sudo ip addr add 10.0.0.9/24 dev eth0', false], ['link set up/down', '', 'Enable/disable an interface (root).', 'sudo ip link set eth0 down', false]],
  e: [['ip a', '2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> …\n    inet 10.0.0.5/24 …', 'Your addresses.'], ['ip -br a', 'lo  UNKNOWN  127.0.0.1/8\neth0  UP  10.0.0.5/24', 'Compact.'], ['ip r', 'default via 10.0.0.1 dev eth0 …', 'The default gateway.'], ['ip neigh', '10.0.0.1 dev eth0 lladdr 52:54:00:12:35:02 REACHABLE', 'Neighbours\' MAC addresses.'], ['hostname -I', '10.0.0.5 172.17.0.1', 'Just the IPs.']],
  u: `<p>An <b>interface</b> (lo = loopback, eth0/enp3s0 = Ethernet, wlan0 = Wi-Fi, docker0 = bridge) has a MAC address and one or more IP addresses with a <b>prefix</b> (/24 = 255.255.255.0: first 24 bits are the network). <b>Routes</b> decide where packets go: addresses in 10.0.0.0/24 are reached directly; everything else goes to the <b>default gateway</b>.</p><p>Troubleshooting order: interface UP? → has an IP? → default route? → gateway reachable (ping)? → DNS works (dig)?</p>`,
  adv: `<p>ip uses rtnetlink messages (RTM_NEWADDR, RTM_GETROUTE…). The kernel keeps multiple routing tables and policy rules (<code>ip rule</code>); <code>ip route get 8.8.8.8</code> shows the exact route decision. Network namespaces (<code>ip netns</code>) give containers separate interfaces and tables. Changes are runtime-only; persistent config lives in netplan (/etc/netplan/*.yaml), NetworkManager or systemd-networkd.</p>`,
  mi: [['ifconfig', 'Often not installed anymore (deprecated net-tools).', 'ip a'], ['sudo ip link set eth0 down over SSH', 'You just cut your own connection.', 'Use a console, or schedule a rollback'], ['Expecting ip addr add to survive reboot', 'Runtime only.', 'Configure netplan/NetworkManager']],
  w: 'Changing addresses, routes or bringing interfaces down on a <b>remote</b> machine can disconnect you instantly. Make changes from a console, or prepare an automatic rollback.',
  r: [['ss', 'Which ports/connections are open on those interfaces.'], ['ping', 'Test reachability.'], ['traceroute', 'Follow the route hop by hop.']],
  cs: ['<code>ip a</code> addresses · <code>ip -br a</code> brief', '<code>ip r</code> routes (default via = gateway)', '<code>ip link</code> interfaces · <code>ip neigh</code> ARP', 'Changes need root and are temporary', 'Replaces ifconfig / route'],
  q: [['Which shows the default gateway?', ['ip a', 'ip r', 'ip l', 'ip n'], 1, 'Routing table.'], ['What does /24 mean?', ['24 hosts', 'The first 24 bits are the network part', 'Port 24', 'IPv6'], 1, '255.255.255.0.'], ['lo is…', ['Wi-Fi', 'the loopback interface (127.0.0.1)', 'a USB NIC', 'logging'], 1, 'Talks to itself.']],
  c: { t: 'Find your machine\'s IP address and its default gateway.', try: 'ip a', steps: [['ip a (or ip -br a)', ctx => okRun(ctx, 'ip') && /\b(a|addr|address)\b/.test(ctx.line)], ['ip r', ctx => okRun(ctx, 'ip') && /\b(r|route)\b/.test(ctx.line)]] },
});
lesson('ss', {
  n: 'ss', s: 'Shows network sockets: listening ports, open connections, and which process owns them (replaces netstat).',
  an: 'The switchboard of a hotel: which room numbers (ports) have a receptionist waiting (LISTEN), and which lines are currently connected to guests (ESTAB).',
  nm: '<b>s</b>ocket <b>s</b>tatistics.',
  sx: 'ss [-t] [-u] [-l] [-n] [-p] [-a]   (commonly: ss -tulpn)', p: [['ss', 'cmd', 'The command.', true], ['-t -u', 'opt', 'TCP / UDP.', false], ['-l -a', 'opt', 'Listening only / all.', false], ['-n -p', 'opt', 'Numeric ports / show process (root for others\').', false]],
  ex1: 'sudo ss -tulpn',
  sc: [['socket(AF_NETLINK, NETLINK_SOCK_DIAG)', 'asks the kernel directly for socket info — fast even with many connections', 'socket(AF_NETLINK, SOCK_RAW|SOCK_CLOEXEC, NETLINK_SOCK_DIAG) = 3'], ['sendmsg / recvmsg', 'request and receive the socket list', 'recvmsg(3, …) = 2400'], ['readlink /proc/*/fd/*', 'with -p: maps socket inodes to processes', 'readlinkat(…"/proc/520/fd/6"…, "socket:[21304]") = 14']],
  ch: 'Nothing.', out: 'Netid State Recv-Q Send-Q Local Address:Port Peer Address:Port Process.', ec: '0.',
  f: [['-t / -u', '--tcp / --udp', 'Protocol filter.', 'ss -t', true], ['-l', '--listening', 'Only listening sockets.', 'ss -tl', true], ['-n', '--numeric', 'Port numbers, not names.', 'ss -tln', true], ['-p', '--processes', 'Owning process (others need sudo).', 'sudo ss -tlp', true], ['-a', '--all', 'Listening + established.', 'ss -ta', false], ['state X', '', 'Filter by state.', 'ss -t state established', false], ['dport = :N', '', 'Filter by port.', "ss -t 'dport = :22'", false]],
  e: [['ss -tln', 'tcp LISTEN 0 4096 0.0.0.0:22 …\ntcp LISTEN … 0.0.0.0:80 …', 'Listening TCP ports.'], ['sudo ss -tulpn', '… users:(("nginx",pid=520,fd=6))', 'With processes — the classic “what\'s listening?” check.'], ['ss -t', '', 'Established connections (your SSH session).'], ['ss -tln | grep :3306', '127.0.0.1:3306', 'MySQL only listens on localhost — not reachable from outside.'], ['sudo systemctl stop nginx; ss -tln', '', 'Port 80 disappears.']],
  u: `<p>A <b>listening socket</b> on <code>0.0.0.0:80</code> accepts connections on every interface; <code>127.0.0.1:3306</code> only from the machine itself (a good security default for databases). <b>ESTAB</b> = an active connection. This is the first check when a service “doesn't respond”: is it even listening, on the right address and port?</p><p>Ports below 1024 need root to bind. <code>-p</code> shows other users' processes only with sudo.</p>`,
  adv: `<p>ss uses the sock_diag netlink interface (inet_diag), which is much faster than netstat's parsing of /proc/net/tcp. Recv-Q/Send-Q for LISTEN sockets show the accept-queue length/limit (backlog). TCP states: SYN-SENT, SYN-RECV, ESTAB, FIN-WAIT-1/2, TIME-WAIT, CLOSE-WAIT (often a sign the app forgets to close sockets).</p>`,
  mi: [['netstat -tulpn', 'Often not installed.', 'ss -tulpn'], ['ss -tlp without sudo', 'Process column empty for root-owned services.', 'sudo ss -tlp'], ['Seeing 127.0.0.1:PORT and wondering why it\'s unreachable remotely', 'It only listens on loopback.', 'Configure the app to bind 0.0.0.0 (and firewall it)']],
  safe: 'Read-only.',
  r: [['lsof', 'lsof -i :PORT also maps ports to processes.'], ['ufw', 'Allow the port through the firewall.'], ['ip', 'Interface addresses.']],
  cs: ['<code>sudo ss -tulpn</code> what\'s listening', '0.0.0.0 = all interfaces · 127.0.0.1 = local only', 'LISTEN vs ESTAB', '<code>-p</code> needs sudo for others\' processes', 'Replaces netstat'],
  q: [['What does 127.0.0.1:3306 LISTEN mean?', ['Open to the internet', 'Only reachable from this machine', 'Closed', 'UDP'], 1, 'Loopback only.'], ['Which flags show listening TCP/UDP with numbers and processes?', ['-abc', '-tulpn', '-xyz', '-all'], 1, 't u l p n.'], ['Why is the Process column empty for nginx?', ['Bug', 'Need sudo to see other users\' processes', 'nginx hides', 'It\'s UDP'], 1, 'Permission.']],
  c: { t: 'List listening TCP ports with numbers <b>and</b> owning processes (you\'ll need sudo to see them all).', try: 'sudo ss -tlnp', chk: ctx => ran(ctx, 'ss') && ran(ctx, 'sudo') && /l/.test(ctx.line) && /p/.test(ctx.line) },
});
lesson('dig', {
  n: 'dig', s: 'Queries DNS servers and shows the full answer: what IP a name points to, mail servers, name servers…',
  an: 'Asking the phone directory service, and seeing not only the number but who answered, how long the entry is valid, and what exactly you asked.',
  nm: '<b>D</b>omain <b>I</b>nformation <b>G</b>roper.',
  sx: 'dig [@SERVER] NAME [TYPE] [+short] [+trace]', p: [['dig', 'cmd', 'The command (dnsutils / bind9-dnsutils).', true], ['[@SERVER]', 'arg', 'Ask a specific DNS server (e.g. @8.8.8.8).', false], ['NAME', 'arg', 'Domain name to look up.', true], ['[TYPE]', 'arg', 'A (default), AAAA, MX, NS, TXT, CNAME, ANY.', false], ['[+short] [+trace]', 'opt', 'Only the answer / follow the delegation from the root.', false]],
  ex1: 'dig google.com',
  sc: [['socket(AF_INET, SOCK_DGRAM)', 'UDP socket', 'socket(AF_INET, SOCK_DGRAM, IPPROTO_UDP) = 3'], ['sendto :53', 'sends the query to the resolver from /etc/resolv.conf', 'sendto(3, "\\243c\\1 \\0\\1…google\\3com\\0\\0\\1\\0\\1", 39, 0, {sin_port=htons(53), sin_addr=inet_addr("127.0.0.53")}, 16) = 39'], ['recvfrom', 'receives the answer', 'recvfrom(3, "…", 65535, 0, …) = 55']],
  ch: 'Nothing.', out: 'HEADER (status NOERROR / NXDOMAIN), QUESTION, ANSWER (name TTL IN TYPE value), query time and server.', ec: '0 (even for NXDOMAIN; check the status), 9 no reply.',
  f: [['+short', '', 'Only the answer values.', 'dig google.com +short', true], ['TYPE', '', 'MX, NS, AAAA, TXT, CNAME…', 'dig google.com MX', true], ['@server', '', 'Query a specific server.', 'dig @8.8.8.8 example.com', true], ['+trace', '', 'Walk root → TLD → authoritative.', 'dig +trace example.com', false], ['-x IP', '', 'Reverse lookup (IP → name).', 'dig -x 8.8.8.8', false]],
  e: [['dig google.com', ';; ANSWER SECTION:\ngoogle.com.  300  IN  A  142.250.185.78', 'Full answer.'], ['dig google.com +short', '142.250.185.78', 'Just the IP.'], ['dig google.com MX +short', '10 smtp.google.com.', 'Mail servers.'], ['dig www.example.com', 'www.example.com. … CNAME example.com.', 'An alias (CNAME) then the A record.'], ['dig nosuch.zzz', 'status: NXDOMAIN', 'The name doesn\'t exist.'], ['cat /etc/resolv.conf', 'nameserver 127.0.0.53', 'Which resolver you use (systemd-resolved).']],
  u: `<p><b>Resolution chain:</b> your stub resolver asks a <b>recursive resolver</b>, which asks a <b>root server</b> (“who handles .com?”), then the <b>TLD server</b> (“who handles google.com?”), then the domain's <b>authoritative server</b>, which gives the record. Each answer has a <b>TTL</b> (seconds it may be cached) — that's why DNS changes take time to “propagate”.</p><p>Record types: <b>A</b> IPv4, <b>AAAA</b> IPv6, <b>CNAME</b> alias, <b>MX</b> mail server, <b>NS</b> name servers, <b>TXT</b> text (SPF, verification).</p>`,
  adv: `<p>DNS messages are binary (RFC 1035): 12-byte header with ID and flags (QR, RD, RA, AD), then question and resource records with label-compressed names. UDP port 53 (TCP for large answers / zone transfers; DoT 853, DoH 443). Ubuntu's systemd-resolved listens on 127.0.0.53; <code>resolvectl status</code> shows the real upstream servers. /etc/hosts is consulted first by getaddrinfo (nsswitch.conf), but NOT by dig.</p>`,
  mi: [['Using ping to debug DNS', 'Mixes up network and name problems.', 'dig name +short'], ['Expecting dig to use /etc/hosts', 'dig only asks DNS servers.', 'getent hosts name'], ['Changing a record and expecting instant effect', 'Caches keep the old answer until TTL expires.', 'Lower the TTL beforehand; query the authoritative server with @']],
  safe: 'Read-only.',
  r: [['ping', 'Reachability after the name resolved.'], ['curl', 'Full request incl. DNS.'], ['ip', 'Interfaces and routes.']],
  cs: ['<code>dig name +short</code>', '<code>dig name MX</code> / NS / AAAA / TXT', '<code>dig @8.8.8.8 name</code> ask another server', 'status: NOERROR vs NXDOMAIN', 'root → TLD → authoritative; TTL = cache time'],
  q: [['Which record type gives an IPv4 address?', ['AAAA', 'A', 'MX', 'NS'], 1, 'A.'], ['What does NXDOMAIN mean?', ['Timeout', 'The name does not exist', 'No IPv6', 'Server error'], 1, 'Non-existent domain.'], ['Why do DNS changes take time to appear?', ['Slow servers', 'Answers are cached for their TTL', 'Manual approval', 'They don\'t'], 1, 'TTL caching.']],
  c: { t: 'Find the IP address of <code>google.com</code> (short form) and its mail server (MX).', try: 'dig google.com +short', steps: [['dig google.com +short', ctx => okRun(ctx, 'dig') && outOf(ctx).includes('142.250')], ['dig google.com MX', ctx => okRun(ctx, 'dig') && /MX/i.test(ctx.line)]] },
});
lesson('traceroute', {
  n: 'traceroute', s: 'Shows each router (hop) packets pass through on the way to a destination, with delays.',
  an: 'Sending letters with “return after 1 stop”, “return after 2 stops”… — each returned letter tells you the next post office on the route.',
  nm: '<b>trace</b> the <b>route</b>.',
  sx: 'traceroute [-n] [-I] HOST', p: [['traceroute', 'cmd', 'The command (install with apt).', true], ['[-n] [-I]', 'opt', '-n no DNS names, -I use ICMP, -T TCP.', false], ['HOST', 'arg', 'Destination.', true]],
  ex1: 'traceroute google.com',
  sc: [['socket + setsockopt(IP_TTL, 1)', 'sends probes with TTL 1, 2, 3…', 'setsockopt(3, SOL_IP, IP_TTL, [1], 4) = 0'], ['sendto', 'UDP probe to a high port (or ICMP with -I)', 'sendto(3, …, 32, 0, {sin_port=htons(33434), …}, 16) = 32'], ['recvmsg (ICMP)', 'each router where TTL hits 0 replies “Time Exceeded” → reveals its address', 'recvmsg(4, {…ICMP_TIME_EXCEEDED…}) = 56']],
  ch: 'Nothing.', out: 'One line per hop: number, name (IP), three round-trip times. <code>* * *</code> = no reply from that hop.', ec: '0.',
  f: [['-n', '', 'Numeric only (faster).', 'traceroute -n 8.8.8.8', true], ['-I', '', 'ICMP probes.', 'sudo traceroute -I host', false], ['-T', '', 'TCP SYN probes (pass firewalls).', 'sudo traceroute -T -p 443 host', false], ['-m N', '', 'Max hops.', 'traceroute -m 15 host', false], ['mtr', '', '(related) live combined ping+traceroute.', 'mtr google.com', true]],
  e: [['traceroute google.com', ' 1  _gateway (192.168.1.1)  0.5 ms …\n 2  * * *\n 3  72.14.215.85 …', 'The path to Google.'], ['traceroute -n 8.8.8.8', '', 'By IP, no reverse lookups.'], ['traceroute example.com', '', 'A longer path (more hops, more latency).'], ['traceroute web01', '', 'Same LAN: one hop.'], ['ping -c 2 google.com', '', 'Compare total latency.']],
  u: `<p>Every IP packet has a <b>TTL</b> (time to live) that each router decrements; at 0 the router drops it and sends back <b>ICMP Time Exceeded</b>. traceroute exploits this: TTL 1 reveals hop 1, TTL 2 hop 2, and so on until the destination answers. Three probes per hop give three times.</p><p><code>* * *</code> usually means that router doesn't answer probes (common, harmless). Latency jumping at one hop and staying high after it points to a congested link there.</p>`,
  adv: `<p>Classic traceroute uses UDP to ports 33434+ (destination replies ICMP Port Unreachable); Windows tracert uses ICMP Echo. Load-balanced paths (ECMP) can show different routers per probe — Paris-traceroute keeps flow identifiers constant. TTL in replies (ping) hints at hop count: initial TTLs are 64 (Linux), 128 (Windows), 255 (routers).</p>`,
  mi: [['Panicking about * * * in the middle', 'Router just doesn\'t reply to probes.', 'Only worry if later hops also fail'], ['traceroute blocked by firewall', 'All stars after a point.', 'traceroute -T -p 443 host'], ['Judging per-hop latency spikes', 'Routers deprioritise answering probes.', 'Look at the end-to-end trend (mtr)']],
  safe: 'Harmless diagnostic traffic.',
  r: [['ping', 'End-to-end check only.'], ['ip', 'Your route to the first hop.'], ['dig', 'Name resolution.']],
  cs: ['<code>traceroute host</code> hop by hop', 'Works by increasing TTL 1,2,3…', '<code>* * *</code> = hop silent (often fine)', '<code>-n</code> skip DNS', '<code>mtr</code> live version'],
  q: [['What makes routers reveal themselves?', ['DNS', 'TTL expiring → ICMP Time Exceeded', 'ARP', 'SSH'], 1, 'TTL trick.'], ['What does * * * mean?', ['Network down', 'No reply from that hop within the timeout', 'Encrypted', 'Max hops'], 1, 'Often filtered.'], ['First hop is usually…', ['google', 'your gateway/router', 'DNS server', 'the ISP CEO'], 1, '_gateway.']],
  c: { t: 'Trace the route to <code>google.com</code>.', try: 'traceroute google.com', chk: ctx => okRun(ctx, 'traceroute') },
});
lesson('ufw', {
  n: 'ufw / iptables', k: 'ufw', s: 'Configures the firewall: which incoming (and outgoing) packets are allowed or dropped.',
  an: 'A bouncer with a guest list: for each arriving packet, check the rules from the top; the first matching rule decides “in” or “out”; if nobody matches, the house policy applies.',
  nm: '<b>U</b>ncomplicated <b>F</b>ire<b>w</b>all · <b>iptables</b> = IP packet filter tables.',
  sx: 'sudo ufw allow|deny PORT[/PROTO] · sudo ufw enable · sudo ufw status   |   sudo iptables -A CHAIN -p PROTO --dport N -j ACCEPT|DROP', p: [['ufw / iptables', 'cmd', 'Friendly front-end / low-level tool (both need root).', true], ['allow|deny / -A CHAIN', 'arg', 'Add a rule (iptables: append to INPUT/OUTPUT/FORWARD).', true], ['PORT[/PROTO] / --dport', 'arg', 'Which traffic.', true], ['-j TARGET', 'arg', 'iptables action: ACCEPT, DROP, REJECT.', false]],
  ex1: 'sudo ufw allow 22',
  sc: [['(ufw)', 'writes rules to /etc/ufw/user.rules and loads them via iptables/nftables', ''], ['socket(AF_NETLINK, NETLINK_NETFILTER)', 'nftables backend: sends the rule set to the kernel', 'sendmsg(3, {…NFT_MSG_NEWRULE…}, 0) = 220'], ['(kernel, per packet)', 'netfilter hooks check every packet against the chain in order; first match wins, else chain policy', '']],
  ch: 'The kernel\'s packet filter rules (ufw rules persist; raw iptables rules are lost at reboot unless saved).', out: 'Rule added · status table.', ec: '0, 1 on errors.',
  f: [['ufw status [verbose]', '', 'Show rules and default policies.', 'sudo ufw status', true], ['ufw allow PORT', '', 'Allow incoming.', 'sudo ufw allow 80/tcp', true], ['ufw deny PORT', '', 'Block.', 'sudo ufw deny 3306', true], ['ufw enable / disable', '', 'Turn on/off.', 'sudo ufw enable', true], ['ufw delete RULE', '', 'Remove a rule.', 'sudo ufw delete allow 80', false], ['ufw default deny incoming', '', 'Default policy.', '', false], ['iptables -L -n -v', '', 'List raw rules.', 'sudo iptables -L', true], ['iptables -A INPUT … -j DROP', '', 'Append a rule.', 'sudo iptables -A INPUT -p tcp --dport 80 -j DROP', false]],
  e: [['sudo ufw status', 'Status: inactive', 'Off by default on Ubuntu.'], ['sudo ufw allow 22', 'Rule added', 'ALWAYS allow SSH first.'], ['sudo ufw allow 80/tcp', 'Rule added', 'Web server.'], ['sudo ufw enable', 'Firewall is active and enabled on system startup', 'Activate (default: deny incoming).'], ['sudo ufw status', '22  ALLOW IN  Anywhere\n80/tcp  ALLOW IN  Anywhere', 'Check.'], ['sudo iptables -A INPUT -p tcp --dport 8080 -j DROP; sudo iptables -L', '', 'The low-level way.']],
  u: `<p>Linux's firewall lives in the kernel (<b>netfilter</b>). Rules are grouped in <b>chains</b>: INPUT (packets for this machine), OUTPUT (from it), FORWARD (passing through). Each packet is checked against the rules <b>top to bottom; the first match decides</b> (ACCEPT, DROP silently, REJECT with an error). If nothing matches, the chain's <b>default policy</b> applies.</p><p>ufw gives a simple model: default deny incoming, allow outgoing, plus your allow rules. Established connections' replies are allowed automatically (connection tracking).</p>`,
  adv: `<p>Modern distros use nftables underneath (iptables-nft translates). Connection tracking (<code>conntrack</code>) labels packets NEW/ESTABLISHED/RELATED so a single “ESTABLISHED,RELATED ACCEPT” rule permits replies. Docker inserts its own chains (DOCKER, DOCKER-USER) that can bypass ufw rules for published ports — a classic surprise. Persist raw iptables with iptables-save/iptables-persistent.</p>`,
  mi: [['sudo ufw enable on a remote server before allowing SSH', 'You lock yourself out.', 'sudo ufw allow 22 && sudo ufw enable'], ['iptables -A INPUT -j DROP then -A INPUT … ACCEPT', 'The DROP comes first and matches everything.', 'Use -I to insert ACCEPT rules above, or order correctly'], ['Expecting ufw to protect Docker published ports', 'Docker rules may bypass ufw.', 'Bind containers to 127.0.0.1 or use DOCKER-USER chain']],
  w: '<b>Enabling a firewall over SSH without allowing port 22 first cuts you off</b> — on cloud VMs that may mean console-only recovery. Rule ORDER matters: a broad DROP above your ACCEPT rules blocks everything. Test with a second session open.',
  r: [['ss', 'Which ports services listen on (what you need to allow).'], ['ssh', 'Keep port 22 open!'], ['ip', 'Interfaces the rules apply to.']],
  cs: ['<code>sudo ufw allow 22</code> BEFORE <code>enable</code>', '<code>sudo ufw status</code> · <code>allow/deny PORT</code>', 'First matching rule wins; then default policy', 'iptables chains: INPUT · OUTPUT · FORWARD', 'ACCEPT · DROP (silent) · REJECT (error)'],
  q: [['What must you do before ufw enable on a remote server?', ['Reboot', 'Allow SSH (22)', 'Disable IPv6', 'Nothing'], 1, 'Or you lock yourself out.'], ['If no rule matches a packet…', ['It\'s accepted', 'The default policy applies', 'It\'s logged only', 'Kernel panic'], 1, 'Chain policy.'], ['DROP vs REJECT?', ['Same', 'DROP silently discards; REJECT replies with an error', 'REJECT is silent', 'DROP logs'], 1, 'Silence vs “connection refused”.']],
  c: { t: 'Set up the firewall safely: allow SSH (22) and HTTP (80), then enable it.', try: 'sudo ufw allow 22', steps: [['Allow 22', ctx => S.firewall.rules.some(r => r.port.startsWith('22') && r.action === 'ALLOW')], ['Allow 80', ctx => S.firewall.rules.some(r => r.port.startsWith('80') && r.action === 'ALLOW')], ['Enable ufw', ctx => S.firewall.enabled]] },
});
lesson('rsync', {
  n: 'rsync', s: 'Synchronises files and folders efficiently — locally or over SSH — copying only what changed.',
  an: 'A smart mover who first compares both houses and only carries over the furniture that is new or different (and with --delete, removes what you threw away).',
  nm: '<b>r</b>emote <b>sync</b>.',
  sx: 'rsync [-a] [-v] [-z] [-n] [--delete] SOURCE[/] DEST', p: [['rsync', 'cmd', 'The command.', true], ['[OPTIONS]', 'opt', '-a archive (recursive + keep perms/times/links), -v, -z compress, -n dry-run, --delete.', false], ['SOURCE[/]', 'arg', 'Trailing slash = copy the CONTENTS; no slash = copy the folder itself.', true], ['DEST', 'arg', 'Local path or [user@]host:path.', true]],
  ex1: 'rsync -av docs/ backup/docs2/',
  sc: [['(ssh, for remote)', 'starts rsync on the other side through ssh', 'execve("/usr/bin/ssh", ["ssh", "web01", "rsync", "--server", …])'], ['newfstatat (both sides)', 'builds file lists with size + mtime', 'newfstatat(AT_FDCWD, "docs/report.txt", …) = 0'], ['(delta algorithm)', 'for changed files: rolling checksums find matching blocks; only differences are sent', ''], ['write + rename', 'writes to a temp file, then renames into place (atomic)', 'rename("backup/docs2/.report.txt.X1y2", "backup/docs2/report.txt") = 0']],
  ch: 'Destination files created/updated; with --delete, extra files removed. Unchanged files untouched.', out: 'With -v: the list of transferred files and a summary (sent/received bytes, speedup).', ec: '0 OK, 23 partial transfer, 255 ssh failure…',
  f: [['-a', '--archive', 'Recursive + preserve permissions, times, owners, symlinks.', 'rsync -a src/ dst/', true], ['-v', '--verbose', 'List files.', 'rsync -av …', true], ['-n', '--dry-run', 'Show what WOULD happen.', 'rsync -avn …', true], ['--delete', '', 'Remove files in DEST that are not in SOURCE.', 'rsync -av --delete src/ dst/', true], ['-z', '--compress', 'Compress over the network.', 'rsync -avz src/ host:dst/', false], ['-P', '', '--progress + --partial (resume).', 'rsync -avP big.iso host:', false], ['--exclude', '', 'Skip patterns.', "rsync -a --exclude='*.log' …", false], ['-e ssh', '', 'Remote shell options.', "rsync -e 'ssh -p 2222' …", false]],
  e: [['rsync -av --dry-run docs/ backup/docs2/', 'sending incremental file list\nreadme.txt…\n(DRY RUN)', 'Preview.'], ['rsync -av docs/ backup/docs2/', '', 'Do it.'], ['rsync -av docs/ backup/docs2/', '', 'Second run: nothing to send — already in sync.'], ['echo extra >> docs/todo.md; rsync -av docs/ backup/docs2/', 'todo.md', 'Only the changed file is sent.'], ['rsync -av --delete docs/ backup/docs2/', '', 'Mirror exactly (removes extras in dest).'], ['rsync -avz docs/ web01:docs/', '', 'Over SSH to a server.']],
  u: `<p><b>The trailing slash matters:</b> <code>rsync -a docs/ dest/</code> copies the <i>contents</i> of docs into dest; <code>rsync -a docs dest/</code> creates <code>dest/docs/</code>.</p><p>rsync compares size and modification time (or checksums with -c) and skips unchanged files; for changed files it uses a <b>delta algorithm</b> to send only the differing blocks. That makes repeated backups and syncs very fast. Always try <code>-n</code> (dry run) first, especially with <code>--delete</code>.</p>`,
  adv: `<p>The rsync algorithm (Tridgell, 1996): the receiver splits its old file into blocks and sends weak rolling (Adler-32-like) + strong (MD5/xxhash) checksums; the sender slides over its version to find matches and sends literal data only for the rest. <code>--link-dest=DIR</code> hard-links unchanged files to a previous backup → space-efficient snapshots. <code>--inplace</code> avoids the temp-file copy for huge files.</p>`,
  mi: [['rsync -a --delete src dest/ (no slash on src)', 'Creates dest/src and DELETES everything else in dest!', 'Use dry-run: rsync -avn --delete src/ dest/'], ['Swapping source and destination', '--delete then wipes your source-of-truth.', 'Double-check the order: SOURCE then DEST'], ['cp -r for nightly backups', 'Copies everything every time.', 'rsync -a']],
  w: '<b>--delete</b> removes files from the destination that aren\'t in the source — with a wrong path or a missing trailing slash, that can wipe a backup or even your data. ALWAYS run with <code>-n</code> (dry run) first and read the “deleting …” lines.',
  r: [['cp', 'Simple one-off copies.'], ['scp', 'Single files over SSH.'], ['cron', 'Schedule nightly rsync backups.'], ['ln', '--link-dest uses hard links for snapshots.']],
  cs: ['<code>rsync -av src/ dst/</code> sync contents', '<code>-n</code> dry run FIRST', '<code>--delete</code> mirror (dangerous)', 'Trailing slash on source = contents', 'Only changes are transferred'],
  q: [['Difference between rsync -a src/ d/ and src d/?', ['None', 'With slash copies contents; without creates d/src', 'Slash = recursive', 'Slash = remote'], 1, 'Trailing slash semantics.'], ['Which option previews without changing anything?', ['-p', '-n', '-v', '-z'], 1, '--dry-run.'], ['Why is a second rsync run fast?', ['Caching', 'Unchanged files are skipped', 'Compression', 'It isn\'t'], 1, 'Size+mtime comparison.']],
  c: { t: 'Preview a sync of <code>docs/</code> to <code>backup/docs2/</code> with a <b>dry run</b>, then do it for real.', try: 'rsync -av --dry-run docs/ backup/docs2/', steps: [['Dry run', ctx => ctx.events.some(e => e.type === 'rsync' && e.dry)], ['Real sync (backup/docs2/report.txt exists)', ctx => has('backup/docs2/report.txt')]] },
});

lesson('vars', {
  n: 'variables', k: '=', s: 'Store values in named variables (NAME=value) and use them with $NAME — the basis of every shell script.',
  an: 'Labelled jars on a shelf: put something in a jar named “name”, later write $name wherever you want its contents poured in.',
  nm: 'Shell <b>variables</b> (parameters).',
  sx: 'NAME=value   ·   echo "$NAME"   ·   \${NAME}   ·   $(command)   ·   $((math))', p: [['NAME=value', 'arg', 'Assignment — NO spaces around =.', true], ['$NAME / \${NAME}', 'arg', 'Expansion: replaced by the value.', false], ['$(cmd)', 'arg', 'Command substitution: the output of cmd.', false], ['$((expr))', 'arg', 'Integer arithmetic.', false]],
  ex1: 'name="Linux"; echo "Hello, $name"',
  sc: [['(none for assignment)', 'assignment is done inside bash (its memory) — no system call', ''], ['write', 'echo prints the already-expanded text', 'write(1, "Hello, Linux\\n", 13) = 13']],
  ch: 'Only the shell\'s memory. Variables vanish when the shell exits (and are NOT seen by child processes unless exported).', out: '—', ec: 'Assignment returns 0.',
  f: [['NAME=v', '', 'Assign (no spaces!).', 'count=3', true], ['"$NAME"', '', 'Use — quote it to keep spaces.', 'echo "$name"', true], ['\${NAME}', '', 'Braces separate from following text.', 'echo "\${name}_backup"', true], ['$(cmd)', '', 'Capture command output.', 'today=$(date +%F)', true], ['$((a+b))', '', 'Arithmetic.', 'i=$((i+1))', true], ['\${#NAME}', '', 'Length of the value.', 'echo \${#name}', false], ['$1 $2 $@ $#', '', 'Script arguments, all args, count.', 'echo "first: $1"', true], ['unset NAME', '', 'Delete a variable.', 'unset name', false]],
  e: [['name="Linux"; echo "Hello, $name"', 'Hello, Linux', 'Assign and use.'], ['file=notes.txt; wc -l $file', '5 notes.txt', 'Variables as arguments.'], ['today=$(date +%F); echo "backup-$today.tgz"', 'backup-2026-11-18.tgz', 'Command substitution.'], ['n=5; echo $((n * 2 + 1))', '11', 'Arithmetic.'], ['echo "\${name}_v2"', 'Linux_v2', 'Braces.'], ['bash script.sh', 'Hello, Linux!…', 'A script using variables (watch the variables panel).']],
  u: `<p><b>No spaces around =</b>: <code>name = x</code> runs a command called “name” with arguments “=” and “x”. Variable names: letters, digits, underscore; by convention UPPERCASE for environment variables, lowercase for your own.</p><p><b>Always double-quote expansions</b> (<code>"$file"</code>): unquoted, the value is split on spaces and globs expand — a file named “my notes.txt” would become two arguments. All values are strings; <code>$((…))</code> does integer math.</p><p>Special parameters: <code>$?</code> last exit code, <code>$$</code> shell PID, <code>$!</code> last background PID, <code>$0</code> script name, <code>$1…$9</code> arguments, <code>$@</code> all arguments, <code>$#</code> their count.</p>`,
  adv: `<p>bash stores variables in hash tables per scope (global, function-local via <code>local</code>). <code>declare -i</code> (integer), <code>-a</code> (indexed array: <code>arr=(a b c); echo \${arr[1]}</code>), <code>-A</code> (associative), <code>-r</code> (readonly), <code>-x</code> (export). Parameter expansion tricks: <code>\${v:-default}</code>, <code>\${v:?error}</code>, <code>\${v%.txt}</code> (strip suffix), <code>\${v//a/b}</code> (replace).</p>`,
  mi: [['name = Linux', '“name: command not found”.', 'name=Linux'], ['rm $file (file="my notes.txt")', 'Tries to delete “my” and “notes.txt”.', 'rm "$file"'], ["echo '$name'", 'Single quotes: no expansion.', 'echo "$name"'], ['echo $name_v2', 'Looks for a variable named name_v2.', 'echo "\${name}_v2"']],
  safe: 'Variables only live in memory. (Unquoted variables in rm/mv commands are a classic cause of accidents.)',
  r: [['export', 'Make variables visible to child processes.'], ['ifloops', 'Use variables in conditions and loops.'], ['echo', 'Inspect expansions.']],
  cs: ['<code>x=5</code> (no spaces!)', '<code>"$x"</code> always quote', '<code>\${x}_suffix</code> braces', '<code>$(cmd)</code> output · <code>$((x+1))</code> math', '<code>$1 $@ $# $? $$</code> specials'],
  q: [['Why does name = Linux fail?', ['Reserved word', 'Spaces make it a command with arguments', 'Needs export', 'Needs quotes'], 1, 'No spaces around =.'], ['How to store the output of date in a variable?', ['d=date', 'd=$(date)', 'd="date"', 'd=\${date}'], 1, 'Command substitution.'], ['Why quote "$file"?', ['Style', 'Prevent word splitting and globbing', 'Faster', 'Required by bash'], 1, 'Spaces in values.']],
  c: { t: 'Create a variable <code>name</code> holding your name and print a greeting with it; then run <code>bash script.sh</code> and watch its variables.', try: 'name="Ada"; echo "Hello, $name"', steps: [['Assign and echo a variable', ctx => ctx.events.some(e => e.type === 'assign') && ran(ctx, 'echo')], ['Run script.sh with bash', ctx => ran(ctx, 'bash') && ctx.line.includes('script.sh')]] },
});
lesson('ifloops', {
  n: 'if / for / while', k: 'if', s: 'Control flow in shell scripts: make decisions with if, repeat with for and while.',
  an: 'A recipe with instructions like “if the dough is sticky, add flour” and “for each of the 12 cupcakes, add icing”.',
  nm: 'Shell <b>conditionals</b> and <b>loops</b>.',
  sx: 'if CMD; then …; elif CMD; then …; else …; fi   ·   for V in LIST; do …; done   ·   while CMD; do …; done', p: [['if CMD; then … fi', 'arg', 'Runs the block if CMD exits with 0 (usually a test: [ … ]).', false], ['for VAR in LIST; do … done', 'arg', 'Repeat for each word in LIST.', false], ['while CMD; do … done', 'arg', 'Repeat while CMD succeeds.', false], ['[ EXPR ]', 'arg', 'The test command: -f file, -d dir, -z str, = !=, -eq -lt -gt …', false]],
  ex1: 'for i in 1 2 3; do echo "Counting: $i"; done',
  sc: [['(parsed by bash)', 'keywords if/for/while are shell syntax; bash runs the conditions/bodies itself', ''], ['(per iteration)', 'each command inside is run normally (builtins in-process, programs via fork/exec)', ''], ['[ … ]', '[ is a builtin (also /usr/bin/[) that evaluates the test and returns 0/1', '']],
  ch: 'Whatever the commands in the blocks do.', out: 'Output of the commands in the blocks.', ec: 'Exit code of the last command executed.',
  f: [['[ -f F ]', '', 'F is a regular file.', 'if [ -f notes.txt ]; then …', true], ['[ -d D ]', '', 'D is a directory.', '[ -d docs ]', true], ['[ -z S ] / -n', '', 'String empty / not empty.', '[ -z "$x" ]', false], ['[ A = B ] / !=', '', 'String comparison.', '[ "$a" = "yes" ]', true], ['-eq -ne -lt -le -gt -ge', '', 'Integer comparison.', '[ $n -gt 3 ]', true], ['&& ||', '', 'Short-circuit: run if previous succeeded/failed.', '[ -d x ] || mkdir x', true], ['break / continue', '', 'Leave loop / next iteration.', 'break', false], ['$(seq 1 5) / {1..5}', '', 'Number lists for for-loops.', 'for i in $(seq 1 5)', false]],
  e: [['for i in 1 2 3; do echo "Counting: $i"; done', 'Counting: 1\nCounting: 2\nCounting: 3', 'Loop over a list.'], ['for f in *.txt; do echo "file: $f"; done', '', 'Loop over files (glob).'], ['x=5; if [ $x -gt 3 ]; then echo big; else echo small; fi', 'big', 'Decision.'], ['i=0; while [ $i -lt 3 ]; do echo $i; i=$((i+1)); done', '0\n1\n2', 'while with a counter.'], ['if [ -d docs ]; then echo "docs exists"; fi', 'docs exists', 'Test for a directory.'], ['bash script.sh', '', 'A script combining all of them — watch the flowchart.']],
  u: `<p><b>if</b> doesn't test “true/false” — it runs a command and checks its <b>exit code</b>: 0 = then-branch. <code>[ … ]</code> is just a command (test) that returns 0 or 1, which is why it needs spaces: <code>[ $x -gt 3 ]</code>, not <code>[$x -gt 3]</code>. Any command works: <code>if grep -q ERROR app.log; then …</code>.</p><p><b>for</b> iterates over words (after expansion): lists, globs, <code>$(command)</code>. <b>while</b> repeats as long as its condition command succeeds; <code>while read -r line; do …; done &lt; file</code> processes a file line by line.</p><p>bash also has <code>[[ … ]]</code> (safer, supports pattern matching and &amp;&amp;/|| inside) and <code>(( … ))</code> for arithmetic tests.</p>`,
  adv: `<p>Compound commands are parsed into an AST before execution; the whole if/for/while runs in the current shell (no subshell) unless piped into. <code>while … done &lt; file</code> keeps variables, but <code>cat file | while …</code> runs the loop in a subshell (variables lost afterwards). <code>set -e</code> exits on errors but has subtle exceptions inside conditions; <code>set -u</code> errors on unset variables; <code>set -o pipefail</code> for pipelines.</p>`,
  mi: [['if [$x -gt 3]', '“[5: command not found” — [ needs spaces.', 'if [ "$x" -gt 3 ]'], ['if [ $name = yes ] with empty name', '“unary operator expected”.', 'if [ "$name" = yes ]'], ['for f in $(ls)', 'Breaks on spaces in names.', 'for f in *'], ['[ 10 > 9 ]', '> is a REDIRECTION here — creates a file named 9!', '[ 10 -gt 9 ]']],
  safe: 'Control flow itself is harmless; the commands inside may not be — test loops with echo first.',
  r: [['exitcodes', 'What if actually checks.'], ['functions', 'Reusable blocks.'], ['vars', 'Values to test and loop over.']],
  cs: ['<code>if [ cond ]; then …; else …; fi</code>', '<code>for x in a b c; do …; done</code>', '<code>while [ cond ]; do …; done</code>', 'Spaces inside [ ] and quote "$vars"', '-eq -lt -gt for numbers, = != for strings'],
  q: [['What does if actually check?', ['A boolean', 'The exit code of a command (0 = then)', 'A variable', 'Output text'], 1, '[ is a command too.'], ['Which compares integers?', ['=', '-eq', '==', '-is'], 1, '-eq, -lt, -gt…'], ['Why must [ $x ] have spaces?', ['Style', '[ is a command; its arguments must be separate words', 'POSIX joke', 'No reason'], 1, '[ is like test.']],
  c: { t: 'Write a <b>for loop</b> that prints the numbers 1 to 3, and an <b>if</b> that checks whether the <code>docs</code> folder exists.', try: 'for i in 1 2 3; do echo "n=$i"; done', steps: [['A for loop', ctx => /^\s*for\s/m.test(ctx.line) && ctx.trace && ctx.trace.length > 1], ['An if statement testing docs', ctx => /^\s*if\s/m.test(ctx.line) && ctx.line.includes('docs')]] },
});
lesson('functions', {
  n: 'functions', k: 'function', s: 'Name a block of commands so you can call it repeatedly, with arguments, like a small command.',
  an: 'Writing a recipe card once (“make tea”) and then just saying “make tea for 3” whenever needed.',
  nm: 'Shell <b>functions</b>.',
  sx: 'name() { COMMANDS; }   ·   name ARG1 ARG2   ·   inside: $1 $2 $@ $#, local VAR, return N', p: [['name() { … }', 'arg', 'Definition (or: function name { … }).', true], ['name ARGS', 'arg', 'Call it like any command.', true], ['$1 $2 … $@ $#', 'arg', 'Arguments inside the function.', false], ['return N', 'arg', 'Exit status of the function (0–255).', false]],
  ex1: 'greet() { echo "Hello, $1!"; }; greet Ada',
  sc: [['(none)', 'a function runs inside the current shell — no fork/exec, so it can change variables and the directory', '']],
  ch: 'Whatever the body does — in the CURRENT shell (functions can cd, set variables).', out: 'The body\'s output.', ec: 'The return value, or the last command\'s exit code.',
  f: [['name() { …; }', '', 'Define (note ; before }).', 'hi() { echo hi; }', true], ['$1 $2', '', 'Positional arguments.', 'echo "$1"', true], ['$@ / $#', '', 'All args / count.', 'for a in "$@"', false], ['local v=x', '', 'Variable visible only inside.', 'local count=0', true], ['return N', '', 'Return status (not a value!).', 'return 1', true], ['$(func)', '', 'Capture its output as the “return value”.', 'r=$(add 2 3)', false], ['type name', '', 'Show a function\'s definition.', 'type greet', false]],
  e: [['greet() { echo "Hello, $1!"; }; greet Ada', 'Hello, Ada!', 'Define and call.'], ['add() { echo $(( $1 + $2 )); }; add 2 3', '5', 'Output as result.'], ['f() { echo "arg1=$1"; return 3; }; f hello; echo $?', 'arg1=hello\n3', 'Return status.'], ['isdir() { [ -d "$1" ]; }; isdir docs && echo yes', 'yes', 'Functions as tests.'], ['type greet', 'greet is a function', 'Inspect.']],
  u: `<p>Functions behave like commands: arguments arrive as <code>$1, $2…</code>, they write to stdout, and they have an exit status (<code>return N</code>, 0 = success). To “return” data, <b>echo</b> it and capture with <code>$(…)</code>.</p><p>Unlike scripts, functions run in the <b>current shell</b>, so they can change your working directory and variables — that's how useful helpers in ~/.bashrc work (e.g. <code>mkcd() { mkdir -p "$1" &amp;&amp; cd "$1"; }</code>). Use <code>local</code> to avoid clobbering global variables.</p>`,
  adv: `<p>bash stores function bodies as parsed command trees; <code>declare -f</code> prints them, <code>export -f name</code> makes them available to child bash processes via the environment. Calling a function sets new positional parameters (<code>FUNCNAME</code>, <code>BASH_SOURCE</code> arrays track the call stack). Recursion works but there's no tail-call optimisation.</p>`,
  mi: [['greet() { echo hi }', 'Syntax error: the closing } needs a ; or newline before it.', 'greet() { echo hi; }'], ['return "hello"', 'return only takes a number (0–255).', 'echo "hello" and capture with $(…)'], ['Variables leaking out', 'Without local, assignments change globals.', 'local name="$1"']],
  safe: 'Defining functions is harmless; they run with your privileges like any command.',
  r: [['ifloops', 'Use control flow inside functions.'], ['bashrc', 'Keep handy functions in ~/.bashrc.'], ['exitcodes', 'return values are exit codes.']],
  cs: ['<code>name() { cmd; }</code> define', 'Call: <code>name arg1 arg2</code> → $1 $2', '<code>local</code> for internal variables', '<code>return N</code> = exit status', 'Return data with echo + $(…)'],
  q: [['How does a function receive arguments?', ['Through $1, $2…', 'Through globals only', 'With read', 'It can\'t'], 0, 'Positional parameters.'], ['What can return give back?', ['Any string', 'A status number 0–255', 'An array', 'A file'], 1, 'Use echo for data.'], ['Can a function cd for the caller?', ['No', 'Yes, it runs in the current shell', 'Only with export', 'Only as root'], 1, 'No subprocess.']],
  c: { t: 'Define a function <code>greet</code> that prints “Hello, NAME!” using its first argument, then call it.', try: 'greet() { echo "Hello, $1!"; }; greet Ada', chk: ctx => !!S.funcs.greet && /Hello, \w+!/.test(outOf(ctx) + (ctx.pipes.map(p => p.cmds.map(c => c.out).join('')).join(''))) },
});
lesson('exitcodes', {
  n: 'exit codes ($?)', k: 'echo', s: 'Every command returns a number when it ends: 0 means success, anything else means some kind of failure.',
  an: 'A thumbs-up or a coded error card that every worker hands back when done: 0 = all good, 2 = missing materials, 127 = I don\'t even exist.',
  nm: 'Exit <b>status</b>, read via the special variable <b>$?</b>.',
  sx: 'COMMAND; echo $?   ·   cmd1 && cmd2   ·   cmd1 || cmd2   ·   exit N', p: [['$?', 'arg', 'Exit code of the last command.', false], ['&&', 'opt', 'Run next only if previous succeeded (0).', false], ['||', 'opt', 'Run next only if previous failed (≠0).', false], ['exit N', 'arg', 'End a script with code N.', false]],
  ex1: 'ls nope; echo $?',
  sc: [['exit_group', 'the program ends by passing a status to the kernel', 'exit_group(2) = ?'], ['wait4', 'the parent shell collects it and stores it in $?', 'wait4(2401, [{WIFEXITED(s) && WEXITSTATUS(s) == 2}], 0, NULL) = 2401']],
  ch: '—', out: '—', ec: '0 success · 1 general error · 2 misuse/serious trouble · 126 not executable · 127 command not found · 128+N killed by signal N (130 Ctrl+C, 137 kill -9) · 255 out of range/ssh error.',
  f: [['$?', '', 'Last exit code.', 'echo $?', true], ['&&', '', 'AND chain.', 'mkdir d && cd d', true], ['||', '', 'OR fallback.', 'cd d || exit 1', true], ['exit N', '', 'Leave script with code N.', 'exit 0', true], ['set -e', '', 'Script stops at the first failing command.', 'set -e', false], ['\${PIPESTATUS[@]}', '', 'Codes of every pipeline member.', 'echo \${PIPESTATUS[@]}', false], ['true / false', '', 'Commands that just return 0 / 1.', 'false; echo $?', false]],
  e: [['ls docs; echo $?', 'readme.txt …\n0', 'Success = 0.'], ['ls nope; echo $?', "ls: cannot access 'nope'…\n2", 'ls uses 2 for serious trouble.'], ['grep banana fruits.txt > /dev/null; echo $?', '0', 'grep: 0 = found.'], ['grep kiwi fruits.txt; echo $?', '1', '1 = not found (not an error message!).'], ['nosuchcmd; echo $?', 'bash: nosuchcmd: command not found\n127', '127.'], ['mkdir -p tmpdir && cd tmpdir && pwd', '/home/user/tmpdir', 'Chain that stops at the first failure.'], ['false || echo fallback', 'fallback', '|| as a fallback.']],
  u: `<p>Exit codes are how programs tell scripts whether they worked — text output is for humans. <b>$?</b> holds the last one and is overwritten by the very next command (even <code>echo</code>), so save it if needed: <code>rc=$?</code>.</p><p><code>&amp;&amp;</code> and <code>||</code> let you chain without if: <code>make &amp;&amp; ./app</code>, <code>cd /x || exit 1</code>. In scripts, end with <code>exit 0</code> on success and a non-zero code on errors, so callers (cron, CI, other scripts) can react.</p>`,
  adv: `<p>The kernel stores the 8-bit status in the zombie's task until the parent calls wait(); <code>WEXITSTATUS</code> extracts it, <code>WIFSIGNALED/WTERMSIG</code> tell if a signal killed it (bash reports 128+sig). Codes &gt; 255 wrap (exit 256 → 0). <code>/usr/include/sysexits.h</code> suggests codes like 64 usage, 65 data error. A pipeline's status is the last command's unless <code>set -o pipefail</code>.</p>`,
  mi: [['cmd; echo "done"; echo $?', '$? is now echo\'s code (0).', 'cmd; rc=$?; echo "done"; echo $rc'], ['Treating grep\'s 1 as an error', '1 = no match.', 'Check for 2 for real errors'], ['rm -rf "$dir"/* after a failed cd', 'Deletes in the WRONG directory.', 'cd "$dir" || exit 1']],
  safe: 'Checking exit codes makes scripts safer — use && and || exit to stop on failures.',
  r: [['ifloops', 'if uses exit codes.'], ['grep', '0 found, 1 not found, 2 error.'], ['functions', 'return sets a function\'s code.']],
  cs: ['0 = success, non-zero = failure', '<code>echo $?</code> last code (save it: rc=$?)', '<code>a && b</code> · <code>a || b</code>', '127 not found · 126 not executable · 130 Ctrl+C', '<code>exit N</code> in scripts'],
  q: [['What does exit code 127 mean?', ['Success', 'Permission denied', 'Command not found', 'Killed'], 2, '127.'], ['In a && b, when does b run?', ['Always', 'If a succeeded (0)', 'If a failed', 'Never'], 1, 'AND.'], ['grep returns 1. What happened?', ['Crash', 'No match found', 'File missing', 'Syntax error'], 1, '2 would be an error.']],
  c: { t: 'Produce a failing command and inspect its exit code with <code>echo $?</code>; then use <code>||</code> to print a fallback message.', try: 'ls nope; echo $?', steps: [['echo $? after a failure (non-zero shown)', ctx => ctx.line.includes('$?') && /\b[1-9]\d*\b/.test(outOf(ctx))], ['Use || for a fallback', ctx => ctx.line.includes('||') && ctx.code === 0]] },
});
lesson('export', {
  n: 'export', s: 'Makes a variable part of the environment, so programs and scripts started from this shell can see it.',
  an: 'Writing a note on the shared whiteboard instead of in your private notebook: everyone you send off on a task (child processes) can read the whiteboard — but they can\'t write back to yours.',
  nm: '<b>export</b> (to child processes).',
  sx: 'export NAME[=VALUE]...   ·   export -p   ·   env', p: [['export', 'cmd', 'Bash builtin.', true], ['NAME[=VALUE]', 'arg', 'Variable to export (and optionally set).', false], ['-p', 'opt', 'List exported variables.', false]],
  ex1: 'export GREETING=hi; bash -c \'echo $GREETING\'',
  sc: [['(builtin)', 'marks the variable for export in bash\'s tables', ''], ['execve(…, envp)', 'when starting any program, bash passes all exported variables as the envp array', 'execve("/usr/bin/bash", ["bash", "-c", "echo $GREETING"], ["GREETING=hi", "PATH=…", …]) = 0']],
  ch: 'Only this shell\'s environment table (and every child started afterwards).', out: 'export -p lists <code>declare -x NAME="value"</code>.', ec: '0.',
  f: [['export N=V', '', 'Set and export.', 'export EDITOR=nano', true], ['export N', '', 'Export an existing variable.', 'x=1; export x', true], ['export -p', '', 'List exported variables.', 'export -p', false], ['env / printenv', '', 'Show the environment.', 'printenv PATH', true], ['N=V cmd', '', 'Set only for one command.', 'LANG=C sort f', true], ['export PATH="$HOME/bin:$PATH"', '', 'Extend PATH.', '', true]],
  e: [['GREETING=hi; bash -c \'echo $GREETING\'', '', 'Not exported → the child sees nothing.'], ['export GREETING=hi; bash -c \'echo $GREETING\'', 'hi', 'Exported → visible to the child.'], ['printenv HOME USER', '/home/user\nuser', 'Read environment variables.'], ['export PATH="$HOME/bin:$PATH"; echo $PATH', '/home/user/bin:/usr/local/sbin:…', 'Add your own bin dir to PATH.'], ['LANG=C date', '', 'One-off variable for a single command.']],
  u: `<p>There are two kinds: <b>shell variables</b> (only this shell) and <b>environment variables</b> (copied into every child process at exec). <code>export</code> turns the first into the second. Children get a <b>copy</b>: they can never modify the parent's environment — that's why a script can't change your shell's PATH unless you <code>source</code> it.</p><p>Important ones: PATH, HOME, USER, SHELL, LANG, EDITOR, TERM. Make exports permanent in <code>~/.bashrc</code> or <code>~/.profile</code>.</p>`,
  adv: `<p>The environment is an array of "NAME=value" strings passed to <code>execve(2)</code> and placed on the new process's stack; readable at <code>/proc/PID/environ</code>. Size limits share ARG_MAX with argv. setuid programs and sudo sanitise it (env_reset, secure_path) because variables like LD_PRELOAD could hijack them.</p>`,
  mi: [['./setpath.sh (script does export PATH=…)', 'The script runs in a child; your shell is unchanged.', 'source setpath.sh'], ['export PATH=~/bin', 'Replaces PATH entirely → ls, cat… “command not found”.', 'export PATH="$HOME/bin:$PATH"'], ['export $NAME=value', 'Exports a variable named after the VALUE of NAME.', 'export NAME=value']],
  w: 'Overwriting <b>PATH</b> (instead of extending it) makes almost every command “not found” in that shell. Don\'t put secrets in exported variables carelessly — every child process (and /proc/PID/environ readers) can see them.',
  r: [['vars', 'Shell variables.'], ['bashrc', 'Make exports permanent.'], ['which', 'PATH lookup.']],
  cs: ['<code>export NAME=value</code>', 'Children get a COPY; they can\'t change yours', '<code>printenv</code> / <code>env</code> show it', 'Extend PATH: <code>export PATH="$HOME/bin:$PATH"</code>', '<code>NAME=v cmd</code> one-off'],
  q: [['Why does a child not see a plain variable?', ['Bug', 'It isn\'t exported to the environment', 'Needs sudo', 'Wrong quotes'], 1, 'export it.'], ['Can a child process change its parent\'s variables?', ['Yes', 'No', 'With export', 'With sudo'], 1, 'Only copies flow downward.'], ['Right way to add ~/bin to PATH?', ['export PATH=~/bin', 'export PATH="$HOME/bin:$PATH"', 'PATH+=bin', 'set PATH'], 1, 'Keep the old value.']],
  c: { t: 'Show that a child only sees <b>exported</b> variables: export <code>GREETING=hi</code> and print it from <code>bash -c</code>.', try: "export GREETING=hi; bash -c 'echo $GREETING'", chk: ctx => S.env.GREETING != null && ran(ctx, 'bash') && outOf(ctx).includes(S.env.GREETING) },
});
lesson('bashrc', {
  n: '.bashrc', k: 'source', s: 'Your personal shell startup file: aliases, functions, prompt and variables applied to every new terminal.',
  an: 'The settings card a hotel keeps for a regular guest: favourite pillow, wake-up call, newspaper — applied automatically every time they check in.',
  nm: '<b>bash</b> <b>r</b>un <b>c</b>ommands (“rc” files are startup scripts).',
  sx: 'nano ~/.bashrc   ·   source ~/.bashrc   ·   alias NAME=\'COMMAND\'', p: [['~/.bashrc', 'arg', 'Read by every interactive non-login bash.', true], ['source FILE (or . FILE)', 'cmd', 'Run a file in the CURRENT shell (apply changes now).', false], ['alias N=\'CMD\'', 'arg', 'Shortcut definition.', false]],
  ex1: 'source ~/.bashrc',
  sc: [['openat ~/.bashrc', 'bash reads the file at startup (or when sourced)', 'openat(AT_FDCWD, "/home/user/.bashrc", O_RDONLY) = 3'], ['read', 'executes each line in the current shell', 'read(3, "# ~/.bashrc: executed by bash…", 121) = 121']],
  ch: 'Settings in the current shell (aliases, functions, variables, PS1). Editing the file only affects NEW shells until you source it.', out: 'Usually nothing.', ec: 'Exit code of the last command in the file.',
  f: [['alias', '', 'Define a shortcut.', "alias ll='ls -la'", true], ['unalias', '', 'Remove one.', 'unalias ll', false], ['source / .', '', 'Reload in the current shell.', 'source ~/.bashrc', true], ['export', '', 'Environment for all programs.', 'export EDITOR=nano', true], ['PS1', '', 'Prompt format (\\u user, \\h host, \\w dir).', 'PS1="\\u:\\w\\$ "', false], ['HISTSIZE', '', 'History length.', 'HISTSIZE=10000', false], ['~/.profile', '', 'Login shells (SSH, console) read this instead; Ubuntu\'s sources .bashrc.', '', false]],
  e: [['cat ~/.bashrc', 'export EDITOR=nano\nalias ll="ls -la"…', 'What\'s in yours.'], ['alias', "alias la='ls -A'\nalias ll='ls -la'", 'Active aliases.'], ["echo \"alias gs='git status'\" >> ~/.bashrc", '', 'Add an alias (>> to append!).'], ['source ~/.bashrc; alias', '', 'Apply it now.'], ["echo 'mkcd() { mkdir -p \"$1\" && cd \"$1\"; }' >> ~/.bashrc", '', 'Add a function.'], ['type ll', "ll is aliased to `ls -la'", 'Check.']],
  u: `<p>Which file runs when? <b>Login shells</b> (SSH, console login) read <code>/etc/profile</code> then <code>~/.bash_profile</code> or <code>~/.profile</code>. <b>Interactive non-login shells</b> (a new terminal window) read <code>~/.bashrc</code>. Ubuntu's ~/.profile sources ~/.bashrc, so putting things in ~/.bashrc covers both.</p><p>Put <b>aliases, functions, prompt, shell options</b> in ~/.bashrc; environment variables like PATH can go in ~/.profile. After editing, run <code>source ~/.bashrc</code> — running <code>bash ~/.bashrc</code> would apply it to a child shell that immediately exits.</p>`,
  adv: `<p>System-wide: /etc/bash.bashrc and /etc/profile.d/*.sh. Non-interactive shells (scripts) read neither .bashrc nor .profile (only $BASH_ENV) — don't rely on aliases in scripts (aliases aren't expanded in non-interactive shells by default). <code>bash --norc</code> / <code>--noprofile</code> skip them for debugging. ~/.bashrc often starts with <code>case $- in *i*) ;; *) return;; esac</code> to bail out when not interactive.</p>`,
  mi: [['echo "alias x=…" > ~/.bashrc', 'Overwrites the whole file — your old settings are gone.', 'echo "alias x=…" >> ~/.bashrc'], ['bash ~/.bashrc to apply changes', 'Runs in a child shell; nothing changes for you.', 'source ~/.bashrc'], ['A syntax error in ~/.bashrc', 'Every new terminal prints errors (or worse).', 'Test with: bash -n ~/.bashrc']],
  w: 'Using <code>&gt;</code> instead of <code>&gt;&gt;</code> on ~/.bashrc wipes your configuration. Back it up first (<code>cp ~/.bashrc ~/.bashrc.bak</code>) and check syntax with <code>bash -n ~/.bashrc</code>. Never paste untrusted lines into it — they run in every shell you open.',
  r: [['export', 'Environment variables.'], ['functions', 'Helpers to keep in .bashrc.'], ['append', 'Use >> to add lines.']],
  cs: ['~/.bashrc = every new interactive bash', '<code>alias ll=\'ls -la\'</code>', '<code>source ~/.bashrc</code> apply now', 'Append with >>, never >', 'Login shells: ~/.profile'],
  q: [['How do you apply ~/.bashrc changes to the current shell?', ['bash ~/.bashrc', 'source ~/.bashrc', 'restart Linux', 'chmod +x ~/.bashrc'], 1, 'source runs it in the current shell.'], ['Which file does an SSH login read first?', ['~/.bashrc only', '~/.profile (or ~/.bash_profile)', '/etc/hosts', 'none'], 1, 'Login shell.'], ['What is an alias?', ['A user account', 'A shortcut name for a command', 'A symlink', 'An env var'], 1, 'Expanded by the shell.']],
  c: { t: 'Add an alias <code>gs</code> (for anything you like) to <b>~/.bashrc</b> using <code>&gt;&gt;</code>, then <code>source</code> it so it works now.', try: "echo \"alias gs='git status'\" >> ~/.bashrc", steps: [['~/.bashrc contains a new alias gs', ctx => /alias gs=/.test((HP('.bashrc').n || {}).data || '')], ['source ~/.bashrc', ctx => ctx.events.some(e => e.type === 'source') && !!S.aliases.gs]] },
});

lesson('namespaces', {
  n: 'namespaces', k: 'unshare', s: 'A kernel feature that gives a process its own private view of system resources: process list, network, mounts, hostname, users.',
  an: 'Putting blinkers on a horse: the horse still runs on the same track (kernel), but sees only its own lane.',
  nm: 'Linux <b>namespaces</b> (pid, net, mnt, uts, ipc, user, cgroup, time).',
  sx: 'unshare [--pid --fork --mount-proc] [--net] [--uts] [-r] COMMAND   ·   lsns', p: [['unshare', 'cmd', 'Run a command in new namespaces.', true], ['--pid --fork --mount-proc', 'opt', 'New PID namespace (command becomes PID 1) + its own /proc.', false], ['--net / --uts / -r', 'opt', 'Own network stack / hostname / user namespace mapping you to root.', false], ['lsns', 'cmd', 'List namespaces.', false]],
  ex1: 'sudo unshare --pid --fork --mount-proc ps',
  sc: [['unshare(CLONE_NEWPID|CLONE_NEWNS)', 'creates new namespaces for the calling process', 'unshare(CLONE_NEWNS|CLONE_NEWPID) = 0'], ['fork', 'the first child in a new PID namespace becomes PID 1 there', 'clone(…) = 2450   (= PID 1 inside)'], ['mount("proc", "/proc")', '--mount-proc remounts /proc so ps sees only the new namespace', 'mount("proc", "/proc", "proc", MS_NOSUID|MS_NODEV|MS_NOEXEC, NULL) = 0'], ['execve', 'runs the command inside', 'execve("/usr/bin/ps", ["ps"], …) = 0']],
  ch: 'Only for the new process tree; the host is unaffected.', out: 'Whatever the command shows — e.g. ps listing only PID 1.', ec: 'The command\'s exit code; 1 if not permitted.',
  f: [['--pid --fork', '', 'New PID namespace.', 'sudo unshare -pf …', true], ['--mount-proc', '', 'Fresh /proc for that namespace.', '', true], ['--net', '', 'Empty network stack (only lo, down).', 'sudo unshare --net ip a', true], ['--uts', '', 'Own hostname.', 'sudo unshare --uts hostname box', false], ['-r', '--map-root-user', 'User namespace: you appear as root inside.', 'unshare -r whoami', true], ['lsns', '', 'List namespaces.', 'sudo lsns', true], ['nsenter', '', 'Enter another process\'s namespaces.', 'sudo nsenter -t PID -n ip a', false]],
  e: [['lsns | head -4', 'NS TYPE NPROCS PID USER COMMAND\n4026531834 time …', 'The default namespaces.'], ['sudo unshare --pid --fork --mount-proc ps', '    PID TTY TIME CMD\n      1 pts/0 00:00:00 ps', 'Inside: ps is PID 1 and sees nothing else!'], ['unshare -r whoami', 'root', 'User namespace: “root” inside, still you outside.'], ['sudo unshare --net ip a', '1: lo: <LOOPBACK> … state DOWN', 'A completely empty network.'], ['docker run -d --name web nginx; sudo lsns', '', 'A container = a set of namespaces.']],
  u: `<p>Namespaces don't create a new kernel (that's a VM). They make the <b>same kernel</b> show different things to different processes:</p><ul><li><b>pid</b> — own process numbering (first process = PID 1)</li><li><b>net</b> — own interfaces, IPs, routes, ports, firewall</li><li><b>mnt</b> — own mount table / filesystem view</li><li><b>uts</b> — own hostname</li><li><b>ipc</b> — own shared memory / message queues</li><li><b>user</b> — own UID mapping (root inside, nobody outside)</li><li><b>cgroup</b>, <b>time</b></li></ul><p>Combine namespaces + cgroups (limits) + a root filesystem image → a <b>container</b>.</p>`,
  adv: `<p>Every process points to an <code>nsproxy</code> holding its namespaces; <code>/proc/PID/ns/*</code> are handles (inode numbers = namespace IDs, as lsns shows). Syscalls: <code>clone(CLONE_NEW*)</code>, <code>unshare()</code>, <code>setns()</code> (used by nsenter and docker exec). PID namespaces nest: a process has one PID per level. User namespaces allow unprivileged users to create other namespaces (rootless containers).</p>`,
  mi: [['sudo unshare --pid ps', 'ps still shows host processes: it reads the HOST /proc.', 'Add --fork --mount-proc'], ['Thinking “root” inside a user namespace = real root', 'Mapped to your normal UID outside.', 'Check with id on the host'], ['Treating namespaces as a security boundary as strong as a VM', 'Same kernel: a kernel bug can escape.', 'Add seccomp/AppArmor, or use VMs for hostile workloads']],
  safe: 'Experiments with unshare are contained to the new process tree.',
  r: [['cgroups', 'The other half of containers: resource limits.'], ['docker', 'Puts it all together.'], ['ps', 'Compare host vs namespace views.']],
  cs: ['Namespaces = isolated VIEWS, same kernel', 'pid · net · mnt · uts · ipc · user · cgroup · time', '<code>sudo unshare -pf --mount-proc ps</code>', '<code>unshare -r whoami</code> → root (fake)', '<code>lsns</code> list · <code>nsenter</code> join'],

lesson('cgroups', {
  n: 'cgroups', k: 'docker', s: 'Control groups: a kernel feature that limits and measures CPU, memory, I/O and process counts for groups of processes.',
  an: 'Separate electricity meters and fuses for each apartment in a building: everyone shares the power plant (kernel), but each flat has its own limit and its own usage reading.',
  nm: '<b>c</b>ontrol <b>groups</b>.',
  sx: 'cat /sys/fs/cgroup/…/memory.max   ·   systemd-cgls   ·   docker run --memory 256m --cpus 0.5 …   ·   docker stats', p: [['/sys/fs/cgroup', 'arg', 'The cgroup v2 filesystem: one directory per group, files = settings/counters.', true], ['memory.max / cpu.max', 'arg', 'Limits.', false], ['systemd-cgls', 'cmd', 'Show the cgroup tree.', false], ['docker --memory / --cpus', 'opt', 'Set limits for a container.', false]],
  ex1: 'docker run -d --name web -m 256m nginx',
  sc: [['mkdir /sys/fs/cgroup/…/docker-ID.scope', 'creating a cgroup = creating a directory', 'mkdir("/sys/fs/cgroup/system.slice/docker-fa53….scope", 0755) = 0'], ['write memory.max', 'setting a limit = writing to a file', 'write(4, "268435456", 9) = 9'], ['write cgroup.procs', 'moving a process into the group', 'write(5, "2470", 4) = 4'], ['read memory.current', 'docker stats reads usage counters', 'read(6, "15728640\\n", 64) = 9']],
  ch: 'Cgroup directories/files under /sys/fs/cgroup.', out: 'Counters and limits as plain text.', ec: '—',
  f: [['memory.max', '', 'Hard memory limit (OOM-kill beyond).', 'cat /sys/fs/cgroup/memory.max', true], ['cpu.max', '', '"quota period" e.g. "50000 100000" = half a CPU.', '', true], ['pids.max', '', 'Max number of processes (fork bombs).', '', false], ['io.max', '', 'Disk bandwidth limits.', '', false], ['systemd-cgls', '', 'Tree of all cgroups.', 'systemd-cgls', true], ['docker -m / --cpus', '', 'Container limits.', 'docker run -m 256m --cpus 0.5 nginx', true], ['docker stats', '', 'Live usage per container.', 'docker stats --no-stream', true]],
  e: [['systemd-cgls', 'Control group /:\n-.slice\n├─user.slice …\n└─system.slice\n  ├─nginx.service …', 'Every service is its own cgroup.'], ['cat /sys/fs/cgroup/memory.max', 'max', 'Root cgroup: unlimited.'], ['docker run -d --name web -m 256m nginx', '', 'Container limited to 256 MiB.'], ['docker stats --no-stream', 'web … 15MiB / 256MiB …', 'Usage vs limit.'], ['systemctl status nginx', '… CGroup: /system.slice/nginx.service', 'systemd shows the cgroup too.']],
  u: `<p>cgroups organise processes in a <b>tree</b>; each node can have <b>limits</b> (memory.max, cpu.max, pids.max, io.max) and exposes <b>accounting</b> (memory.current, cpu.stat). Children inherit their parent's group. systemd puts every service, user session and container in its own cgroup — that's how it can stop all of a service's processes and how <code>systemctl status</code> shows memory use.</p><p>Exceed <b>memory.max</b> and the kernel's OOM killer terminates a process in that group (not elsewhere). <b>cpu.max</b> throttles CPU time; <b>pids.max</b> stops fork bombs.</p>`,
  adv: `<p>cgroup v2 is a single unified hierarchy mounted at /sys/fs/cgroup; controllers are enabled per subtree via <code>cgroup.subtree_control</code>. Pressure stall info per group in <code>memory.pressure</code>/<code>cpu.pressure</code>. Limits are enforced in the kernel's memory controller (memcg charges every page) and CPU bandwidth controller (CFS quota). Inside a container, /proc/meminfo still shows host memory — tools must read the cgroup files.</p>`,
  mi: [['Running a container without memory limits on a shared host', 'One leaky container can starve everything.', 'docker run -m 512m …'], ['Reading free inside a container', 'Shows host memory, not the limit.', 'cat /sys/fs/cgroup/memory.max'], ['Too low memory limit', 'Process gets OOM-killed (exit 137).', 'Measure with docker stats, then set a sensible limit']],
  safe: 'Reading cgroup files is harmless; writing limits (root) can starve or kill workloads.',
  r: [['namespaces', 'Isolation (views) vs cgroups (limits).'], ['docker', 'Sets both up for you.'], ['systemctl', 'Services live in cgroups.'], ['nice', 'Soft priority vs hard cgroup limits.']],
  cs: ['cgroups = LIMITS + ACCOUNTING for process groups', 'Files in /sys/fs/cgroup (v2)', 'memory.max · cpu.max · pids.max', '<code>systemd-cgls</code> tree', '<code>docker run -m 256m --cpus 0.5</code>'],
  q: [['What do cgroups do?', ['Isolate views', 'Limit and account resources', 'Encrypt', 'Schedule cron'], 1, 'Namespaces isolate; cgroups limit.'], ['How do you set a limit in cgroup v2?', ['A syscall only', 'Write a value into a file like memory.max', 'Edit /etc/cgroups', 'Reboot'], 1, 'Everything is a file.'], ['A container exceeding memory.max gets…', ['Slower', 'OOM-killed', 'More memory', 'Paused'], 1, 'Exit 137.']],
  c: { t: 'Run an nginx container named <code>web</code> with a <b>256 MB memory limit</b>, then check its usage with docker stats.', try: 'docker run -d --name web -m 256m nginx', steps: [['Container with memory limit', ctx => S.containers.some(c => c.up && c.mem)], ['docker stats', ctx => ran(ctx, 'docker') && ctx.line.includes('stats')]] },
});
lesson('docker', {
  n: 'docker run / ps / exec', k: 'docker', s: 'Runs applications in containers: isolated processes with their own filesystem image, network and limits.',
  an: 'Shipping containers for software: everything the app needs is packed in a standard box that runs the same on any ship (Linux host) — and boxes don\'t mess with each other.',
  nm: '<b>docker</b> — as in dock workers loading containers.',
  sx: 'docker run [-d] [--name N] [-p HOST:CTR] [-m MEM] IMAGE [CMD]   ·   docker ps [-a]   ·   docker exec [-it] NAME CMD   ·   docker stop|rm NAME', p: [['docker', 'cmd', 'Client talking to the dockerd daemon via /var/run/docker.sock.', true], ['run / ps / exec / stop / rm', 'arg', 'Sub-command.', true], ['[OPTIONS]', 'opt', '-d detached, --name, -p port mapping, -m memory, --cpus, -e env, -v volume, --rm.', false], ['IMAGE [CMD]', 'arg', 'Image (nginx, ubuntu:24.04…) and optional command.', false]],
  ex1: 'docker run -d --name web -p 8080:80 nginx',
  sc: [['connect /var/run/docker.sock', 'the CLI sends an HTTP API request to dockerd', 'connect(3, {sa_family=AF_UNIX, sun_path="/var/run/docker.sock"}, 23) = 0'], ['(image)', 'pulls missing layers from the registry and stacks them with overlayfs', 'mount("overlay", "/var/lib/docker/overlay2/…/merged", "overlay", 0, "lowerdir=…,upperdir=…") = 0'], ['clone(CLONE_NEWPID|NEWNET|NEWNS|NEWUTS|NEWIPC)', 'containerd/runc create namespaces', 'clone3({flags=CLONE_NEWNS|CLONE_NEWPID|CLONE_NEWNET|…}) = 2470'], ['cgroup + pivot_root + execve', 'apply limits, switch root to the image, exec the entrypoint as PID 1', 'execve("/docker-entrypoint.sh", ["/docker-entrypoint.sh", "nginx", "-g", "daemon off;"], …)']],
  ch: 'Images in /var/lib/docker, a running container process on the host (visible in ps!), network rules for published ports.', out: 'run -d prints the container ID; ps lists containers; exec shows the command\'s output.', ec: '0, 125 docker error, 126/127 command problems, or the container\'s own code.',
  f: [['run -d', '', 'Start in the background.', 'docker run -d nginx', true], ['--name N', '', 'Name it.', '--name web', true], ['-p H:C', '', 'Publish container port C on host port H.', '-p 8080:80', true], ['-m / --cpus', '', 'Memory / CPU limits (cgroups).', '-m 256m --cpus 0.5', false], ['-it', '', 'Interactive terminal.', 'docker run -it ubuntu bash', true], ['--rm', '', 'Delete when it exits.', 'docker run --rm alpine echo hi', false], ['ps [-a]', '', 'Running (all) containers.', 'docker ps -a', true], ['exec', '', 'Run a command inside a running container.', 'docker exec web ps', true], ['stop / rm', '', 'Stop (SIGTERM, then SIGKILL) / remove.', 'docker stop web', true], ['images / pull / logs', '', 'Local images / download / container logs.', 'docker logs web', false]],
  e: [['docker run -d --name web -p 8080:80 nginx', 'fa5373f267c2…', 'Start a web server container.'], ['docker ps', 'CONTAINER ID   IMAGE   …   NAMES\nfa5373f267c2   nginx:latest   …   web', 'Running containers.'], ['docker exec web ps', '    PID TTY TIME CMD\n      1 ?   00:00:00 nginx\n     29 pts/0 00:00:00 ps', 'Inside: nginx is PID 1.'], ['ps aux | grep nginx', '', 'On the host the SAME process has a normal, high PID.'], ['docker run --rm ubuntu cat /etc/os-release', 'PRETTY_NAME="Ubuntu 24.04.1 LTS"', 'A different distro userland, same kernel.'], ['docker stop web; docker ps -a', '', 'Stopped (Exited).']],
  u: `<p>A container is just a <b>process</b> on the host with: its own <b>namespaces</b> (it sees its own PID 1, network, hostname, filesystem), <b>cgroup</b> limits, and a root filesystem built from an <b>image</b> — a stack of read-only layers plus a thin writable layer. It starts in milliseconds because there's no OS to boot: the host kernel is shared.</p><p><b>Images vs containers:</b> an image is the template (like a class), a container is a running instance (like an object). Data written inside a container is lost when it's removed — use <b>volumes</b> (<code>-v</code>) for persistent data.</p><p>Membership in the <code>docker</code> group equals root access (you can mount the host's / into a container), so grant it carefully.</p>`,
  adv: `<p>Stack: docker CLI → dockerd (REST API) → containerd → runc (OCI runtime) → clone() with CLONE_NEW* flags, cgroup setup, <code>pivot_root</code> into the overlayfs merged dir, capability dropping, seccomp profile and AppArmor, then execve of the entrypoint. Port publishing adds nftables/iptables DNAT rules and a veth pair attached to the docker0 bridge. docker exec uses setns() to join the existing namespaces.</p>`,
  mi: [['docker run nginx (then the terminal is “stuck”)', 'Foreground: attached to the container.', 'docker run -d nginx'], ['Storing database files inside the container', 'Lost on docker rm.', 'docker run -v dbdata:/var/lib/mysql …'], ['-p 80 (expecting it on host 80)', 'Random host port.', '-p 80:80'], ['Adding users to the docker group casually', 'Root-equivalent.', 'Rootless Docker/Podman, or sudo']],
  w: '<b>docker group membership = root</b> on the host. <code>docker rm</code> / <code>docker system prune</code> delete containers, their writable layers and possibly volumes (<code>-v</code>/<code>--volumes</code>) permanently. Published ports may bypass ufw rules.',
  r: [['namespaces', 'Isolation mechanism.'], ['cgroups', 'Resource limits.'], ['systemctl', 'dockerd is a systemd service.'], ['ps', 'Container processes are visible on the host.']],
  cs: ['<code>docker run -d --name web -p 8080:80 nginx</code>', '<code>docker ps [-a]</code> · <code>docker logs web</code>', '<code>docker exec -it web bash</code>', '<code>docker stop web && docker rm web</code>', 'Container = process + namespaces + cgroups + image'],
  q: [['What is a container really?', ['A small VM', 'A host process with namespaces, cgroups and an image filesystem', 'A zip file', 'A kernel module'], 1, 'Shared kernel.'], ['Image vs container?', ['Same', 'Image = template, container = running instance', 'Container = template', 'Image = running'], 1, 'Class vs object.'], ['How do you run a command in a running container?', ['docker run', 'docker exec', 'docker attach only', 'ssh'], 1, 'exec joins its namespaces.']],
  c: { t: 'Start an nginx container named <code>web</code> in the background, list it, and run <code>ps</code> inside it.', try: 'docker run -d --name web nginx', steps: [['docker run -d --name web nginx', ctx => S.containers.some(c => c.name === 'web' && c.up)], ['docker ps', ctx => ran(ctx, 'docker') && /docker ps/.test(ctx.line)], ['docker exec web ps', ctx => ran(ctx, 'docker') && /exec/.test(ctx.line) && /PID/.test(outOf(ctx))]] },
});
