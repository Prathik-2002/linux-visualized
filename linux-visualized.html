<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Visualized</title>
<style>
:root{
  --bg:#0e1117;--panel:#151a23;--panel2:#1b212c;--border:#2a3242;--text:#e6e9ef;--muted:#8d96aa;
  --blue:#5aa9ff;--teal:#2dd4bf;--green:#4ade80;--orange:#fb923c;--red:#f87171;--purple:#b197fc;--yellow:#facc15;
  --term:#0a0d12;--termtext:#d7dde8;--chip:#222a37;--shadow:0 6px 24px rgba(0,0,0,.35);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,"DejaVu Sans Mono",monospace;
  --r:10px;--dur:450ms;
}
:root[data-theme="light"]{
  --bg:#f4f6fa;--panel:#ffffff;--panel2:#f0f3f8;--border:#d9dfe9;--text:#1b2230;--muted:#5b6578;
  --blue:#1d6fd6;--teal:#0f8f80;--green:#16883e;--orange:#c2560c;--red:#c62828;--purple:#6d4bd1;--yellow:#a16207;
  --term:#101419;--termtext:#d7dde8;--chip:#e8edf5;--shadow:0 6px 24px rgba(20,30,50,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
code,kbd,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--chip);padding:1px 5px;border-radius:5px}
a{color:var(--blue)}
.top{height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;white-space:nowrap}
.brand svg{color:var(--green)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.levels{display:flex;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px}
.levels button{border:0;background:none;padding:4px 12px;border-radius:999px;color:var(--muted);font-size:13px}
.levels button[aria-pressed="true"]{background:var(--blue);color:#fff}
.btn{border:1px solid var(--border);background:var(--panel2);padding:5px 12px;border-radius:8px;font-size:13px}
.btn:hover{border-color:var(--blue)}
.btn[aria-pressed="true"]{background:var(--orange);color:#111;border-color:var(--orange)}
.icon-btn{border:1px solid var(--border);background:var(--panel2);width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:16px}
.mobile-only{display:none}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1.08fr);height:calc(100% - 54px)}
#sidebar{border-right:1px solid var(--border);overflow:auto;background:var(--panel);padding:10px 0 30px}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:4px 14px 8px;font-size:12px;color:var(--muted)}
.side-head label{display:flex;gap:5px;align-items:center;cursor:pointer}
.mod{padding:8px 14px 6px}
.mod h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:3px;background:var(--border);border-radius:3px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.mod ul{list-style:none;margin:0;padding:0}
.mod li button{width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:7px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;color:var(--text)}
.mod li button:hover{background:var(--panel2)}
.mod li button.cur{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue);font-weight:600}
.mod li button.locked{color:var(--muted)}
.st{width:14px;text-align:center;font-size:11px;flex:none}
.st.ok{color:var(--green)}
#mid{display:flex;flex-direction:column;padding:14px;gap:10px;min-width:0;overflow:hidden}
.lesson-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lesson-head h1{margin:0;font:700 20px var(--mono)}
.lesson-head span{color:var(--muted);font-size:13px}
.challenge{border:1px solid var(--border);border-left:3px solid var(--orange);background:var(--panel);border-radius:var(--r);padding:9px 12px;font-size:13px}
.challenge.ok{border-left-color:var(--green)}
.challenge b{color:var(--orange)}
.challenge.ok b{color:var(--green)}
.challenge .steps{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.challenge .steps li.ok{color:var(--green)}
.try-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px dashed var(--muted);background:none;border-radius:999px;padding:4px 12px;font-family:var(--mono);font-size:12.5px;color:var(--text)}
.chip:hover{border-color:var(--yellow);color:var(--yellow)}
.term{flex:1;min-height:260px;background:var(--term);color:var(--termtext);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font:13.5px/1.5 var(--mono);overflow:auto;cursor:text;box-shadow:var(--shadow)}
#out .ln{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.inrow{display:flex;align-items:baseline}
.inrow input{flex:1;background:none;border:0;outline:0;color:var(--termtext);font:inherit;padding:0;margin-left:7px;caret-color:#facc15;min-width:40px}
.p-u{color:#4ade80;font-weight:600}.p-p{color:#5aa9ff;font-weight:600}
.c-dir{color:#5aa9ff;font-weight:600}.c-ex{color:#4ade80;font-weight:600}.c-ln{color:#2dd4bf}.c-err,.err{color:#f87171}.c-y{color:#facc15}.c-b{font-weight:700}.c-dim{color:#7c879b}.c-mag{color:#c4a7ff}
.hint{color:#facc15}
.tok{border-radius:3px;cursor:help;transition:background .15s}
.tok:hover,.tok.hl{background:rgba(250,204,21,.28);color:#fde68a}
.ok-msg{color:#4ade80}
#right{overflow:auto;border-left:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;font-weight:650;margin-bottom:8px;gap:8px}
.card-h small{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
#viz{width:100%;height:auto;display:block;background:var(--panel2);border-radius:8px;aspect-ratio:640/360}
.controls{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.controls .icon-btn{width:32px;height:30px;font-size:14px}
.controls label{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.controls input[type=range]{width:90px;accent-color:var(--blue)}
#stepLbl{font-size:12px;color:var(--muted)}
#timeline{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
#timeline li{position:relative;padding:3px 0 9px 24px;cursor:pointer;color:var(--muted);font-size:13px}
#timeline li::before{content:"";position:absolute;left:4px;top:7px;width:10px;height:10px;border-radius:50%;border:2px solid var(--muted);background:var(--panel)}
#timeline li::after{content:"";position:absolute;left:9px;top:21px;bottom:-2px;width:2px;background:var(--border)}
#timeline li:last-child::after{display:none}
#timeline li.done{color:var(--text)}
#timeline li.done::before{background:var(--green);border-color:var(--green)}
#timeline li.now{color:var(--blue);font-weight:700}
#timeline li.now::before{border-color:var(--blue);background:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 25%,transparent)}
#timeline li small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:11.5px}
#timeline li:hover{color:var(--blue)}
details.sec{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{cursor:pointer;padding:10px 12px;font-weight:650;list-style:none;display:flex;gap:8px;align-items:center}
details.sec>summary::before{content:"▸";transition:transform .2s;color:var(--muted)}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary .n{color:var(--muted);font:12px var(--mono)}
.sec-b{padding:0 14px 12px}
.sec-b p{margin:.4em 0 .7em}
.analogy{border-left:3px solid var(--teal);padding:6px 10px;background:var(--panel2);border-radius:0 8px 8px 0;margin:8px 0}
.syn{font:15px var(--mono);display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.syn span{padding:3px 8px;border-radius:6px;border:1px solid var(--border)}
.syn .cmd{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
.syn .opt{color:var(--yellow);border-color:color-mix(in srgb,var(--yellow) 45%,transparent)}
.syn .arg{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 50%,transparent)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
td code{white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.req{font-size:11px;padding:1px 6px;border-radius:9px;background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.optl{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--chip);color:var(--muted)}
ol.exec{padding-left:0;list-style:none;counter-reset:s;margin:4px 0}
ol.exec>li{counter-increment:s;position:relative;padding:6px 0 6px 34px;border-bottom:1px dashed var(--border)}
ol.exec>li::before{content:attr(data-k);position:absolute;left:4px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font:600 11px var(--mono);color:var(--blue)}
ol.exec>li.now{background:color-mix(in srgb,var(--blue) 10%,transparent)}
.toks{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.toks code{border:1px solid var(--border)}
.sys{font:12.5px var(--mono);margin:4px 0 0;padding-left:16px}
.sys li{margin:2px 0}
.sys b{color:var(--orange)}
.ex{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--panel2)}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ex-h code{background:none;padding:0;color:var(--green);font-size:13px;word-break:break-all}
.ex pre{margin:6px 0 4px;font:12px var(--mono);color:var(--muted);white-space:pre-wrap;background:var(--term);color:var(--termtext);padding:6px 8px;border-radius:6px}
.ex p{margin:0;font-size:13px;color:var(--muted)}
.run{border:1px solid var(--green);color:var(--green);background:none;border-radius:6px;padding:2px 9px;font-size:12px;white-space:nowrap}
.run:hover{background:var(--green);color:#111}
.mistake{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:8px 0}
.mistake .w{color:var(--red);font-family:var(--mono)}
.mistake .r{color:var(--green);font-family:var(--mono)}
.warn{border:1px solid var(--red);background:color-mix(in srgb,var(--red) 10%,transparent);border-radius:8px;padding:10px 12px}
.warn b{color:var(--red)}
.calm{border:1px solid var(--green);background:color-mix(in srgb,var(--green) 8%,transparent);border-radius:8px;padding:10px 12px}
.rel{display:flex;flex-direction:column;gap:6px}
.rel button{border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:6px 10px;text-align:left}
.rel button b{font-family:var(--mono);color:var(--blue);margin-right:6px}
.rel button span{color:var(--muted)}
.cheat{background:var(--term);color:var(--termtext);border-radius:8px;padding:10px 12px;font:12.5px var(--mono)}
.cheat ol{margin:0;padding-left:20px}.cheat li{margin:3px 0}
.quiz-q{margin:10px 0 14px}
.quiz-q .opts{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.quiz-q .opts button{text-align:left;border:1px solid var(--border);background:var(--panel2);border-radius:8px;padding:6px 10px}
.quiz-q .opts button.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.quiz-q .opts button.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 15%,transparent)}
.quiz-q .expl{margin-top:6px;font-size:13px;color:var(--muted)}
.score{font-weight:600}
.adv{border:1px solid var(--purple);border-radius:8px;padding:8px 12px;margin-top:10px}
.adv h4{margin:2px 0 6px;color:var(--purple)}
.gl{text-decoration:underline dotted var(--muted);text-underline-offset:3px;cursor:help}
.gl:hover{color:var(--blue)}
#tip{position:fixed;z-index:50;max-width:320px;background:var(--panel);color:var(--text);border:1px solid var(--yellow);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .15s}
#tip.on{opacity:1}
#tip b{color:var(--yellow);font-family:var(--mono)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal[hidden]{display:none}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:min(860px,100%);height:min(640px,100%);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.modal-h{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.modal-h input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font:inherit}
.gloss-body{display:grid;grid-template-columns:230px 1fr;min-height:0}
#glossList{overflow:auto;border-right:1px solid var(--border);padding:6px}
#glossList button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px}
#glossList button:hover,#glossList button.cur{background:var(--panel2);color:var(--blue)}
#glossEntry{overflow:auto;padding:16px 20px}
#glossEntry h2{margin-top:0}
#glossEntry .see button{margin:3px;border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--green);color:var(--text);padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
#shade{display:none}
.calc{display:grid;grid-template-columns:auto repeat(3,46px) 56px;gap:4px;align-items:center;margin:8px 0;font-size:13px}
.calc button{border:1px solid var(--border);background:var(--panel2);border-radius:6px;padding:4px 0;font-family:var(--mono)}
.calc button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.calc .o{font:700 16px var(--mono);color:var(--purple);text-align:center}
.calc-out{font:600 15px var(--mono);margin-top:4px}
/* SVG viz */
#viz text{font-family:var(--mono);font-size:12px;fill:var(--text)}
#viz .lbl-m{fill:var(--muted);font-size:11px}
#viz .ttl{font-size:13px;font-weight:700}
#viz .fade{transition:opacity var(--dur),transform var(--dur),fill var(--dur),stroke var(--dur)}
#viz *{transition:opacity var(--dur),fill var(--dur),stroke var(--dur)}
#viz .mv{transition:transform var(--dur) ease-in-out,opacity var(--dur)}
#viz.noanim *{transition:none!important}
#viz .hid{opacity:0}
#viz .grow>*{transform-box:fill-box;transform-origin:center;transition:transform var(--dur) cubic-bezier(.3,1.5,.6,1),opacity var(--dur)}
#viz .grow.hid>*{transform:scale(.2)}
#viz .gone{opacity:0}
#viz .dim{opacity:.28}
#viz rect,#viz circle,#viz path,#viz line,#viz polygon{stroke-width:1.5}
#viz .n-dir rect{fill:color-mix(in srgb,var(--blue) 18%,var(--panel));stroke:var(--blue)}
#viz .n-file rect{fill:color-mix(in srgb,var(--teal) 14%,var(--panel));stroke:var(--teal)}
#viz .n-link rect{fill:color-mix(in srgb,var(--teal) 8%,var(--panel));stroke:var(--teal);stroke-dasharray:4 3}
#viz .n-proc rect{fill:color-mix(in srgb,var(--orange) 16%,var(--panel));stroke:var(--orange)}
#viz .n-perm rect{fill:color-mix(in srgb,var(--purple) 16%,var(--panel));stroke:var(--purple)}
#viz .n-plain rect{fill:var(--panel);stroke:var(--border)}
#viz .n-ok rect{fill:color-mix(in srgb,var(--green) 20%,var(--panel));stroke:var(--green)}
#viz .n-root rect{fill:color-mix(in srgb,var(--red) 16%,var(--panel));stroke:var(--red)}
#viz .del rect{fill:color-mix(in srgb,var(--red) 30%,var(--panel))!important;stroke:var(--red)!important}
#viz .del text{fill:var(--red)!important;text-decoration:line-through}
#viz .hl rect{stroke:var(--yellow)!important;stroke-width:2.5}
#viz .cur rect{stroke-width:2.5;fill:color-mix(in srgb,var(--blue) 35%,var(--panel))}
#viz .ghost rect{stroke-dasharray:5 4;fill:transparent!important}
#viz .on-bit rect{fill:var(--purple);stroke:var(--purple)}
#viz .on-bit text{fill:#fff}
#viz .off-bit rect{fill:transparent;stroke:var(--border)}
#viz .off-bit text{fill:var(--muted)}
#viz .flip rect{stroke:var(--yellow)!important;stroke-width:3}
#viz .wire{fill:none;stroke:var(--muted);stroke-dasharray:4 4}
#viz .wire-s{fill:none;stroke:var(--muted)}
#viz .arr{fill:none;stroke:var(--blue);stroke-width:2}
#viz .arr-r{fill:none;stroke:var(--red);stroke-width:2}
#viz .arr-g{fill:none;stroke:var(--green);stroke-width:2}
#viz .arr-o{fill:none;stroke:var(--orange);stroke-width:2}
#viz .pk{fill:var(--yellow)}
#viz .pk-r{fill:var(--red)}
#viz .pk-g{fill:var(--green)}
#viz .pk-b{fill:var(--blue)}
#viz .pkt rect{fill:var(--yellow);stroke:none}
#viz .pkt text{fill:#111;font-size:10.5px}
#viz .tk rect{fill:var(--chip);stroke:var(--border)}
#viz .tk.hl rect{fill:color-mix(in srgb,var(--yellow) 30%,var(--panel));stroke:var(--yellow)}
#viz .lane{fill:color-mix(in srgb,var(--blue) 6%,transparent);stroke:none}
#viz .lane-k{fill:color-mix(in srgb,var(--purple) 9%,transparent);stroke:none}
#viz .sep{stroke:var(--purple);stroke-dasharray:6 4}
#viz .cell rect{fill:var(--panel);stroke:var(--border)}
#viz .cell.sel rect{fill:color-mix(in srgb,var(--blue) 25%,var(--panel));stroke:var(--blue)}
#viz .cell.mat rect{fill:color-mix(in srgb,var(--yellow) 30%,var(--panel));stroke:var(--yellow)}
#viz .cell.new rect{fill:color-mix(in srgb,var(--green) 25%,var(--panel));stroke:var(--green)}
#viz .meter{fill:var(--green)}
#viz .meter-bg{fill:var(--panel);stroke:var(--border)}
#viz .t-red{fill:var(--red)!important}#viz .t-green{fill:var(--green)!important}#viz .t-blue{fill:var(--blue)!important}#viz .t-orange{fill:var(--orange)!important}#viz .t-purple{fill:var(--purple)!important}#viz .t-y{fill:var(--yellow)!important}
#viz .bigx{stroke:var(--red);stroke-width:4}
@media (max-width:900px){
  body{overflow:auto}
  .mobile-only{display:grid}
  .top{padding:0 10px;gap:8px;height:auto;min-height:54px;flex-wrap:wrap;padding-block:8px}
  .brand span{font-size:15px}
  .top-r{flex-wrap:wrap;gap:6px;margin-left:0;width:100%}
  .levels button{padding:4px 9px;font-size:12px}
  .app{display:flex;flex-direction:column;height:auto}
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:270px;z-index:45;transform:translateX(-100%);transition:transform .3s;box-shadow:var(--shadow)}
  #sidebar.open{transform:none}
  #shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:44}
  #shade.on{display:block}
  #mid{padding:12px 16px;overflow:visible}
  .term{height:360px;flex:none}
  #right{border-left:0;overflow:visible;padding:0 16px 30px}
  .gloss-body{grid-template-columns:1fr;grid-template-rows:150px 1fr}
  #glossList{border-right:0;border-bottom:1px solid var(--border)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button id="menuBtn" class="icon-btn mobile-only" aria-label="Open lesson list">☰</button>
  <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="18" rx="3"/><path d="M6 9l3 3-3 3M12 15h6"/></svg><span>Linux Visualized</span></div>
  <div class="top-r">
    <div class="levels" role="group" aria-label="Difficulty level">
      <button data-level="beginner">Beginner</button><button data-level="intermediate">Intermediate</button><button data-level="advanced">Advanced</button>
    </div>

/* ---------- glossary ---------- */
let GL_RE = null;
function glossTerms() { const out = []; for (const [k, g] of Object.entries(GLOSSARY)) { out.push([k, k]); (g.aka || []).forEach(a => out.push([a, k])); } return out.sort((a, b) => b[0].length - a[0].length); }

  const terms = glossTerms(); const map = new Map(terms.map(([t, k]) => [t.toLowerCase(), k]));
  if (!GL_RE) GL_RE = new RegExp(`(?<![\\w$/.-])(${terms.map(t => t[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})(?![\\w-])`, 'i');

    const used = new Set();
    const walker = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('code,pre,button,summary,.gl,a,.syn,.cheat,b.k') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });

    for (let tn of nodes) {
      let guard = 0;
      while (tn && guard++ < 20) {
        const m = GL_RE.exec(tn.nodeValue); if (!m) break;
        const key = map.get(m[1].toLowerCase());
        if (used.has(key)) { // skip this occurrence, continue after it
          const rest = tn.splitText(m.index + m[1].length); tn = rest; continue;
        }
        used.add(key);
        const mid = tn.splitText(m.index); const after = mid.splitText(m[1].length);
        const sp = document.createElement('span'); sp.className = 'gl'; sp.dataset.term = key; sp.textContent = mid.nodeValue; sp.tabIndex = 0;
        mid.replaceWith(sp); tn = after;
      }
    }
  });
}

  showGloss(term || Object.keys(GLOSSARY).sort()[0]);

}

    if (e.key === 'ArrowDown') { e.preventDefault(); if (UI.hIdx == null) return; UI.hIdx++; if (UI.hIdx >= S.history.length) { UI.hIdx = null; inp.value = ''; } else inp.value = S.history[UI.hIdx]; return; }
    if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); clearTerm(); return; }
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C') && inp.selectionStart === inp.selectionEnd) { e.preventDefault(); echoCommand(inp.value + '^C'); inp.value = ''; S.lastExit = 130; return; }
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); inp.value = inp.value.slice(inp.selectionStart); return; }
  });
  document.addEventListener('keydown', e => { if (S.fg && document.activeElement !== inp) fgKey(e); if (e.key === 'Escape') { if (!$('#glossModal').hidden) $('#glossModal').hidden = true; closeDrawer(); } });
  $('#term').addEventListener('mouseup', () => { if (!window.getSelection().toString()) inp.focus(); });
  document.addEventListener('mouseover', e => { const t = e.target.closest('.tok,.gl'); if (!t) return; if (t.classList.contains('tok')) showTip(t, t.dataset.tipHtml); else { const g = GLOSSARY[t.dataset.term]; if (g) showTip(t, `<b>${esc(t.dataset.term)}</b> ${g.s}<br><span style="color:var(--muted);font-size:11px">click for the full entry</span>`); } });
  document.addEventListener('mouseout', e => { if (e.target.closest('.tok,.gl')) hideTip(); });
  document.addEventListener('focusin', e => { const t = e.target.closest('.gl'); if (t && GLOSSARY[t.dataset.term]) showTip(t, `<b>${esc(t.dataset.term)}</b> ${GLOSSARY[t.dataset.term].s}`); });
  document.addEventListener('focusout', e => { if (e.target.closest('.gl')) hideTip(); });
  document.addEventListener('click', e => {
    const gl = e.target.closest('.gl'); if (gl) { hideTip(); openGlossary(gl.dataset.term); return; }
    const gd = e.target.closest('[data-gloss]'); if (gd) { e.preventDefault(); openGlossary(gd.dataset.gloss); return; }
    const run = e.target.closest('[data-run]'); if (run) { typeAndRun(run.dataset.run); return; }
    const ls = e.target.closest('[data-lesson]'); if (ls) { const id = ls.dataset.lesson; if (!LESSONS[id]) return; $('#glossModal').hidden = true; if (isLocked(id)) { toast('🔒 That lesson is locked — tick “Unlock all” to jump ahead.'); return; } openLesson(id); return; }
    const q = e.target.closest('.quiz-q button'); if (q) { quizAnswer(+q.closest('.quiz-q').dataset.q, +q.dataset.o); return; }
    if (e.target.closest('[data-retry]')) { const L = L_(UI.lesson); const pass = (UI.quiz[L.id] || {}).pass; UI.quiz[L.id] = { ans: [], pass }; save(); renderExplain(); return; }
    if (e.target.closest('[data-copy]')) { const L = L_(UI.lesson); const text = `${L.n} — cheat sheet\n` + (L.cs || []).map((c, i) => `${i + 1}. ${c.replace(/<[^>]+>/g, '')}`).join('\n'); const done = () => toast('📋 Cheat sheet copied'); try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); } catch (er) { fallbackCopy(text, done); } }
  });
  document.querySelectorAll('.levels button').forEach(b => b.onclick = () => { UI.level = b.dataset.level; renderLevel(); const id = UI.lastLesson[UI.level] && LESSONS[UI.lastLesson[UI.level]] ? UI.lastLesson[UI.level] : ownModules(UI.level)[0].ids[0]; openLesson(id); if (V.ctx) vizLoad(V.ctx); save(); });
  $('#sandboxBtn').onclick = () => { UI.sandbox = !UI.sandbox; $('#sandboxBtn').setAttribute('aria-pressed', String(UI.sandbox)); renderChallenge(); renderSidebar(); toast(UI.sandbox ? '🧪 Sandbox: everything unlocked, no challenges. Reset any time.' : 'Lesson mode'); };
  $('#resetBtn').onclick = () => { newSystem(); SH.args = [['bash']]; clearTerm(); banner(); termWrite('\x1b[32mSystem reset to its starting state.\x1b[0m\n'); updatePrompt(); welcomeViz(); V.steps = []; V.ctx = null; renderTimeline(); };
  $('#unlockAll').onchange = e => { UI.unlockAll = e.target.checked; save(); renderSidebar(); };
  $('#glossBtn').onclick = () => openGlossary();
  $('#glossClose').onclick = () => { $('#glossModal').hidden = true; };
  $('#glossModal').onclick = e => { if (e.target.id === 'glossModal') $('#glossModal').hidden = true; };
  $('#glossSearch').oninput = e => { renderGlossList(e.target.value); const f = document.querySelector('#glossList button'); if (f) showGloss(f.dataset.g); };
  $('#themeBtn').onclick = () => setTheme(UI.theme === 'dark' ? 'light' : 'dark');
  $('#menuBtn').onclick = () => { $('#sidebar').classList.add('open'); $('#shade').classList.add('on'); };
  $('#shade').onclick = closeDrawer;
  $('#vReplay').onclick = () => { if (!V.ctx) return; vizJump(-1); vizPlay(true); };
  $('#vPlay').onclick = () => { if (!V.steps.length) return; if (!V.playing && V.i >= V.steps.length - 1) vizJump(-1); vizPlay(!V.playing); };
  $('#vFwd').onclick = () => { vizPlay(false); if (V.i < V.steps.length - 1) vizApply(V.i + 1); };
  $('#vBack').onclick = () => { vizPlay(false); vizJump(Math.max(-1, V.i - 1)); };
  $('#vSpeed').oninput = e => { V.speed = +e.target.value; V.svg.style.setProperty('--dur', Math.round(450 / V.speed) + 'ms'); if (V.playing) vizPlay(true); };
  inp.focus();
}
function fallbackCopy(text, done) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed — select the text manually'); } ta.remove(); }
/* ================= GLOSSARY ================= */
const GLOSSARY = {
  'shell': { s: 'The program that reads your commands and runs them (here: bash).', d: 'A shell is an ordinary program that shows a prompt, reads a line you type, splits it into words, expands variables and wildcards, and then either runs a builtin itself or asks the kernel to start a program. bash is the default on most Linux systems; others include zsh, dash and fish.', aka: ['bash'], see: ['kernel', 'builtin', 'prompt', '$PATH'] },
  'kernel': { s: 'The core of the operating system that controls hardware, memory and processes.', d: 'The Linux kernel is the one program that runs with full hardware access ("kernel space"). Everything else — the shell, ls, your browser — runs in "user space" and must ask the kernel for anything privileged (reading a file, starting a process, sending a packet) through system calls.', see: ['system call', 'user space', 'process'] },
  'user space': { s: 'Where normal programs run, with no direct hardware access.', d: 'The CPU runs ordinary programs in a restricted mode. To do anything involving hardware or other processes, they make a system call, which switches into kernel space and back.', aka: ['kernel space'], see: ['kernel', 'system call'] },
  'process': { s: 'A running instance of a program, with its own PID, memory and open files.', d: 'When you run a command, the kernel creates a process: it gets a unique PID, its own memory, a current directory, environment variables, a table of open file descriptors and a parent process. When it finishes it returns an exit code to its parent.', aka: ['processes'], see: ['PID', 'fork', 'exec', 'exit code', 'process state'], lesson: 'ps' },
  'PID': { s: 'Process ID — the unique number the kernel gives every process.', d: 'PIDs are assigned in increasing order and reused after wrapping around (see /proc/sys/kernel/pid_max). PID 1 is the init system (systemd), which starts everything else and adopts orphaned processes. $$ is your shell\'s PID, $! the PID of the last background job.', aka: ['PIDs', 'process ID'], see: ['process', 'PPID', 'signal'], lesson: 'ps' },
  'PPID': { s: 'Parent Process ID — the PID of the process that created this one.', d: 'Every process except PID 1 (and kernel threads) has a parent. Commands you type are children of your shell. If a parent dies first, the child is "orphaned" and re-parented to PID 1.', see: ['PID', 'orphan', 'fork'] },
  'fork': { s: 'System call that clones the current process into a parent and a child.', d: 'fork() (on Linux really clone()) creates an almost exact copy of the calling process. The shell forks before running any external command; the child then calls exec() to become the new program, while the parent waits for it (unless you used &).', aka: ['fork()', 'clone'], see: ['exec', 'process', 'builtin'] },
  'exec': { s: 'System call that replaces the current program with a new one.', d: 'execve(path, argv, envp) loads a program file into the current process, replacing its code and memory but keeping its PID and open files. That is why redirections set up by the shell before exec still apply to the new program.', aka: ['execve', 'exec()'], see: ['fork', 'file descriptor'] },
  'system call': { s: 'A request from a program to the kernel (open, read, write, fork…).', d: 'System calls are the only doorway from user space into the kernel. There are ~450 on Linux: openat, read, write, close, stat, mkdir, unlink, rename, fork/clone, execve, kill, mount… strace shows every system call a program makes.', aka: ['system calls', 'syscall', 'syscalls'], see: ['kernel', 'strace'], lesson: 'strace' },
  'inode': { s: 'The on-disk record holding a file\'s metadata and pointers to its data.', d: 'Every file and directory has an inode with: type, permissions, owner, group, size, timestamps, link count and the locations of its data blocks. The inode does NOT contain the file\'s name — names live in directories, which map name → inode number. ls -i shows inode numbers.', aka: ['inodes', 'inode number'], see: ['directory entry', 'hard link', 'link count'], lesson: 'stat' },
  'directory entry': { s: 'A name → inode number pair stored inside a directory.', d: 'A directory is a special file whose content is a table of entries. Renaming a file only changes these entries, which is why mv within one filesystem is instant.', aka: ['dentry'], see: ['inode', 'hard link'] },
  'link count': { s: 'How many directory entries (names) point at an inode.', d: 'The second column of ls -l. A regular file starts at 1; each hard link adds one. The data is only freed when the link count drops to 0 and no process still has the file open.', aka: ['nlink'], see: ['hard link', 'inode'], lesson: 'ln' },
  'hard link': { s: 'An extra name for the same inode.', d: 'Created with ln. All hard links are equal — there is no "original". They must be on the same filesystem and cannot point to directories.', aka: ['hard links'], see: ['symbolic link', 'inode', 'link count'], lesson: 'ln' },
  'symbolic link': { s: 'A small file that contains a path to another file.', d: 'Created with ln -s. A symlink has its own inode; opening it makes the kernel follow the stored path. If the target is moved or deleted the link "dangles" (breaks). Symlinks can cross filesystems and point to directories.', aka: ['symlink', 'symlinks', 'soft link'], see: ['hard link'], lesson: 'ln-s' },
  'file descriptor': { s: 'A small number a process uses to refer to an open file, pipe or socket.', d: 'open() returns the lowest free number. Every process starts with 0 = stdin, 1 = stdout, 2 = stderr. Redirection works by making these numbers point somewhere else (dup2). See them in /proc/PID/fd.', aka: ['file descriptors', 'fd', 'fds'], see: ['stdin', 'stdout', 'stderr', 'redirection'], lesson: 'redir' },
  'stdin': { s: 'Standard input — file descriptor 0, normally your keyboard.', d: 'Where a program reads input when no file is given. Can come from a pipe (cmd1 | cmd2) or a file (cmd < file).', aka: ['standard input'], see: ['stdout', 'stderr', 'pipe'] },
  'stdout': { s: 'Standard output — file descriptor 1, normally your terminal.', d: 'Where a program writes its normal results. Redirect with > or >>, or pipe into another command with |.', aka: ['standard output'], see: ['stdin', 'stderr', 'redirection'] },
  'stderr': { s: 'Standard error — file descriptor 2, for error messages.', d: 'Kept separate from stdout so errors still reach your screen even when the output is piped or redirected. Redirect it with 2> file, or merge it into stdout with 2>&1.', aka: ['standard error'], see: ['stdout', 'redirection'] },
  'pipe': { s: 'A kernel buffer connecting one process\'s stdout to another\'s stdin.', d: 'cmd1 | cmd2 starts both commands at the same time; whatever cmd1 writes is read by cmd2. The buffer is 64 KiB by default; the writer pauses when it is full and the reader waits when it is empty. No temporary file is created.', aka: ['pipes', 'pipeline'], see: ['stdin', 'stdout', 'file descriptor'], lesson: 'pipe' },
  'redirection': { s: 'Making a command read from or write to a file instead of the terminal.', d: '> file (overwrite stdout), >> file (append), < file (stdin from file), 2> file (stderr), 2>&1 (stderr to wherever stdout goes), &> file (both). The SHELL sets these up before the program starts.', aka: ['redirect', 'redirects'], see: ['file descriptor', 'stdout'], lesson: 'redir' },
  'signal': { s: 'A small asynchronous notification sent to a process (SIGTERM, SIGKILL…).', d: 'Signals are numbered messages delivered by the kernel. Common: 1 HUP (hang-up / reload), 2 INT (Ctrl+C), 9 KILL (cannot be caught), 15 TERM (polite stop, default of kill), 19 STOP (pause), 18 CONT (resume), 20 TSTP (Ctrl+Z). Programs can install handlers for most signals.', aka: ['signals', 'SIGTERM', 'SIGKILL', 'SIGINT', 'SIGHUP'], see: ['process', 'PID'], lesson: 'signals' },
  'exit code': { s: 'A number 0–255 a program returns when it ends: 0 = success.', d: 'Also called exit status or return code. The shell stores the last one in $?. && runs the next command only on 0, || only on non-zero. 126 = not executable, 127 = command not found, 128+N = killed by signal N (130 = Ctrl+C).', aka: ['exit codes', 'exit status', 'return code'], see: ['process'], lesson: 'exitcodes' },
  'root': { s: 'The superuser (UID 0) who bypasses all permission checks.', d: 'root can read and change any file, kill any process and reconfigure the system. Mistakes as root can destroy the system, which is why you normally work as a regular user and use sudo for single commands. Also: the top directory "/" is called the root directory.', aka: ['superuser', 'UID 0'], see: ['sudo', 'UID'], lesson: 'sudo' },
  'UID': { s: 'User ID — the number the kernel uses to identify a user.', d: 'Names like "user" are just labels from /etc/passwd; the kernel only cares about numbers. root is 0, system accounts are usually below 1000, normal users start at 1000. GID is the same idea for groups.', aka: ['UIDs', 'GID', 'user ID'], see: ['root', 'group'] },
  'group': { s: 'A named set of users that can share file permissions.', d: 'Each file has one owner and one group. Users can belong to many groups (see `groups`). Membership is listed in /etc/group; changes apply from your next login.', aka: ['groups'], see: ['UID', 'permissions'], lesson: 'groups' },
  'permissions': { s: 'The r/w/x bits that decide who may read, write or execute a file.', d: 'Three sets of three bits: owner, group, others. For files: r = read content, w = change content, x = run as a program. For directories: r = list names, w = create/delete entries, x = enter/traverse. Shown by ls -l, changed with chmod.', aka: ['permission', 'mode', 'permission bits', 'rwx'], see: ['octal', 'chmod', 'umask'], lesson: 'chmod' },
  'octal': { s: 'Base-8 numbers used to write permissions: r=4, w=2, x=1.', d: 'Add the values for each set: rwx = 4+2+1 = 7, r-x = 5, r-- = 4. So rwxr-xr-x = 755 and rw-r--r-- = 644. A fourth leading digit holds setuid (4), setgid (2) and sticky (1).', aka: ['octal notation'], see: ['permissions'], lesson: 'chmod-octal' },
  'setuid': { s: 'Permission bit that makes a program run with its OWNER\'s privileges.', d: 'Shown as "s" in the owner execute slot (-rwsr-xr-x). /usr/bin/passwd is setuid root so normal users can update /etc/shadow. Powerful and dangerous: a buggy setuid-root program is a privilege-escalation hole.', aka: ['setgid', 'SUID'], see: ['permissions', 'root'], lesson: 'setuid' },
  'sticky bit': { s: 'Directory bit: only a file\'s owner may delete or rename it.', d: 'Shown as "t" (drwxrwxrwt). Used on /tmp so everybody can create files there but cannot delete each other\'s.', see: ['permissions'], lesson: 'sticky' },
  'ACL': { s: 'Access Control List — extra per-user/per-group permissions on a file.', d: 'POSIX ACLs extend the owner/group/others model, e.g. "alice may also write this file". Managed with setfacl/getfacl; ls -l shows a + after the mode.', aka: ['ACLs'], see: ['permissions'], lesson: 'acl' },
  'umask': { s: 'Mask of permission bits removed from newly created files.', d: 'Programs request 666 for files and 777 for directories; bits set in the umask are taken away. umask 022 → files 644, dirs 755. It is inherited by child processes.', see: ['permissions'], lesson: 'umask' },
  '$PATH': { s: 'List of directories the shell searches for programs.', d: 'A colon-separated list such as /usr/local/bin:/usr/bin:/bin. When you type ls, the shell checks each directory in order and runs the first executable called ls. The current directory is NOT in $PATH, which is why you run local scripts as ./script.sh.', aka: ['PATH'], see: ['environment variable', 'which'], lesson: 'which' },
  'environment variable': { s: 'A named value passed from a process to its children.', d: 'Examples: HOME, USER, PATH, LANG, EDITOR. Set a shell variable with NAME=value; export it to make it part of the environment of programs you start. Children can never change their parent\'s environment.', aka: ['environment variables', 'environment', 'env var', 'variable', 'variables'], see: ['$PATH', 'export'], lesson: 'export' },
  'builtin': { s: 'A command implemented inside the shell itself, not as a separate program.', d: 'cd, echo, pwd, export, alias, jobs, fg, bg, umask, source… run without fork/exec. Some MUST be builtins because they change the shell\'s own state (cd changes its directory, export its environment). `type cmd` tells you whether something is a builtin.', aka: ['builtins', 'shell builtin'], see: ['shell', 'fork'] },
  'alias': { s: 'A shortcut name the shell expands into a longer command.', d: 'alias ll="ls -la". Aliases only exist in the interactive shell that defined them; put them in ~/.bashrc to keep them.', aka: ['aliases'], see: ['dotfile'], lesson: 'bashrc' },
  'prompt': { s: 'The text the shell shows when waiting for a command (user@linux:~$).', d: 'Configured by the PS1 variable. Usually shows user, host and current directory, ending with $ for normal users and # for root.', aka: ['PS1'], see: ['shell'] },
  'home directory': { s: 'Your personal folder, /home/<username>, abbreviated ~.', d: 'Where your files and config files (dotfiles like ~/.bashrc) live. cd with no argument takes you there. root\'s home is /root.', aka: ['home', '~'], see: ['path'] },
  'path': { s: 'The location of a file, e.g. /home/user/notes.txt.', d: 'Absolute paths start with / (from the root directory). Relative paths start from the current directory. . = this directory, .. = parent, ~ = your home.', aka: ['absolute path', 'relative path', 'paths'], see: ['working directory', 'home directory'] },
  'working directory': { s: 'The directory a process is currently "in"; relative paths start here.', d: 'Each process has its own. Shown by pwd, changed with cd (a builtin, so it changes the shell\'s own).', aka: ['current directory', 'cwd'], see: ['path'], lesson: 'pwd' },
  'glob': { s: 'A wildcard pattern like *.txt that the shell expands into file names.', d: '* matches anything, ? one character, [abc] one of the listed characters. Expansion is done by the SHELL before the command runs; the command just receives the list of names. Quote the pattern to pass it literally (find -name "*.txt").', aka: ['globs', 'wildcard', 'wildcards', 'globbing'], see: ['expansion'] },
  'expansion': { s: 'The shell rewriting words before running a command (~, $VAR, *, $(…)).', d: 'Order: brace {a,b} → tilde ~ → parameter $VAR / arithmetic $((…)) / command substitution $(…) → word splitting → globbing → quote removal. Single quotes prevent all expansion; double quotes allow $ but not globbing or splitting.', aka: ['expanded', 'command substitution'], see: ['glob', 'environment variable'] },
  'mount point': { s: 'A directory where a filesystem is attached to the tree.', d: 'Linux has a single directory tree. Other disks, USB sticks and virtual filesystems are attached ("mounted") on an existing directory; their files then appear under it. Whatever was in that directory is hidden until you unmount.', aka: ['mount points', 'mounted', 'mount'], see: ['filesystem'], lesson: 'mount' },
  'filesystem': { s: 'The on-disk structure that stores files and directories (ext4, xfs, vfat…).', d: 'A filesystem organises blocks on a partition into inodes, directories and data. Each mounted filesystem has its own inode numbers — that is why hard links cannot cross filesystems and mv between them must copy.', aka: ['filesystems', 'file system'], see: ['mount point', 'inode', 'partition'] },
  'partition': { s: 'A section of a disk that holds one filesystem (sda1, nvme0n1p2…).', d: 'Disks are divided into partitions described by a partition table (GPT or MBR). lsblk shows disks and their partitions.', aka: ['partitions'], see: ['filesystem', 'mount point'], lesson: 'lsblk' },
  'daemon': { s: 'A background service process (sshd, cron, nginx…).', d: 'Daemons start at boot, have no terminal, and wait for work. Names often end in "d". On modern Linux, systemd starts and supervises them as services.', aka: ['daemons', 'service', 'services'], see: ['systemd'], lesson: 'systemctl' },
  'systemd': { s: 'The init system (PID 1) that boots Linux and manages services.', d: 'systemd starts services described by unit files, tracks their processes in cgroups, restarts them if they crash and collects their logs in the journal. Controlled with systemctl and journalctl.', see: ['daemon', 'cgroup', 'boot'], lesson: 'systemctl' },
  'boot': { s: 'The startup sequence: firmware → bootloader → kernel → init → services.', d: 'UEFI/BIOS finds a disk, GRUB loads the kernel and initramfs, the kernel starts PID 1 (systemd), which mounts filesystems and starts services until the default target is reached.', aka: ['booting', 'bootloader', 'GRUB'], see: ['systemd', 'kernel'], lesson: 'boot' },
  'cron': { s: 'A daemon that runs scheduled commands (crontab).', d: 'cron wakes every minute and runs jobs whose five-field schedule (minute hour day-of-month month day-of-week) matches. Jobs run with a minimal environment.', aka: ['crontab', 'cron job'], see: ['daemon'], lesson: 'cron' },
  'package manager': { s: 'Tool that installs, updates and removes software (apt, dnf…).', d: 'Packages are archives with programs, files, metadata and dependencies. apt downloads them from repositories listed in /etc/apt/sources.list(.d), verifies signatures and installs dependencies automatically.', aka: ['package', 'packages', 'repository'], see: ['root'], lesson: 'apt' },
  'archive': { s: 'One file that contains many files and folders (tar, zip).', d: 'Archiving bundles files (tar); compression shrinks data (gzip, xz). .tar.gz does both. zip does both per file.', aka: ['archives', 'tarball'], see: ['compression'], lesson: 'tar' },
  'compression': { s: 'Encoding data so it takes fewer bytes (gzip, xz, zip).', d: 'Lossless compression finds repetition. Text compresses well; JPEG, MP3, video and already-compressed archives barely shrink.', aka: ['compressed', 'compress'], see: ['archive'], lesson: 'gzip' },
  'IP address': { s: 'The numeric address of a machine on a network (e.g. 10.0.0.5).', d: 'IPv4 addresses are four numbers 0–255; IPv6 are longer hex. Private ranges (10.x, 192.168.x, 172.16–31.x) are used inside local networks.', aka: ['IP', 'IP addresses', 'IPv4'], see: ['DNS', 'port'], lesson: 'ip' },
  'port': { s: 'A number (0–65535) identifying a service on a machine (22 SSH, 80 HTTP, 443 HTTPS).', d: 'An IP address finds the machine; the port finds the program on it. Ports below 1024 need root to listen on.', aka: ['ports'], see: ['socket', 'IP address'], lesson: 'ss' },
  'socket': { s: 'An endpoint for network or local communication, used like a file.', d: 'Programs create sockets to talk over TCP/UDP or Unix domain sockets. Each open socket is a file descriptor. ss and lsof list them.', aka: ['sockets'], see: ['port', 'file descriptor'], lesson: 'ss' },
  'DNS': { s: 'Domain Name System — translates names like google.com into IP addresses.', d: 'Your resolver asks root servers, then TLD servers (.com), then the domain\'s authoritative servers, caching answers for their TTL. Record types: A (IPv4), AAAA (IPv6), MX (mail), CNAME (alias), NS (nameservers), TXT.', aka: ['resolver', 'nameserver'], see: ['IP address'], lesson: 'dig' },
  'TCP': { s: 'Reliable, ordered byte-stream network protocol (with a 3-way handshake).', d: 'SYN → SYN-ACK → ACK opens a connection; lost packets are resent; data arrives in order. Used by HTTP, SSH, databases. UDP is the connectionless, best-effort alternative (DNS, video).', aka: ['UDP', 'handshake'], see: ['port'] },
  'SSH': { s: 'Secure Shell — encrypted remote login and command execution.', d: 'ssh user@host connects to the sshd daemon on port 22, verifies the server\'s host key, authenticates you (key or password) and gives you an encrypted shell. scp and rsync can run over it.', aka: ['ssh key'], see: ['TCP', 'port'], lesson: 'ssh' },
  'firewall': { s: 'Rules in the kernel that ACCEPT or DROP network packets.', d: 'Linux\'s packet filter is netfilter (nftables/iptables). Rules are checked top to bottom and the first match wins; if nothing matches, the chain\'s default policy applies. ufw is a friendly front-end.', aka: ['netfilter', 'iptables rules'], see: ['port'], lesson: 'ufw' },
  'namespace': { s: 'A kernel feature that gives a process its own isolated view of a resource.', d: 'Types: pid (process list), net (network stack), mnt (mounts), uts (hostname), ipc, user (UIDs), cgroup, time. Containers are processes placed in new namespaces.', aka: ['namespaces'], see: ['cgroup', 'container'], lesson: 'namespaces' },
  'cgroup': { s: 'Control group — kernel feature that limits and measures resources for a group of processes.', d: 'cgroups v2 (mounted at /sys/fs/cgroup) can cap memory (memory.max), CPU (cpu.max), I/O and number of processes, and account usage. systemd and Docker put every service/container in its own cgroup.', aka: ['cgroups', 'control group'], see: ['namespace', 'container'], lesson: 'cgroups' },
  'container': { s: 'A normal process isolated with namespaces and limited with cgroups.', d: 'Unlike a virtual machine, a container shares the host\'s kernel. It sees its own filesystem (from an image), process list, network and hostname. Docker and Podman manage containers.', aka: ['containers', 'image', 'Docker'], see: ['namespace', 'cgroup'], lesson: 'docker' },
  'zombie': { s: 'A finished process whose exit code hasn\'t been collected by its parent yet.', d: 'Shown with state Z. It uses no memory or CPU, only a slot in the process table. It disappears when the parent calls wait(), or when the parent dies and PID 1 reaps it. You cannot kill a zombie — it is already dead.', aka: ['zombies'], see: ['orphan', 'process state'], lesson: 'ps' },
  'orphan': { s: 'A process whose parent has exited; it is adopted by PID 1.', d: 'Orphans keep running normally. nohup and & are often used to create long-running orphans on purpose.', aka: ['orphans', 'orphaned'], see: ['zombie', 'PPID'] },
  'process state': { s: 'What a process is doing: R running, S sleeping, D disk wait, T stopped, Z zombie.', d: 'Shown in the STAT column of ps. Most processes are S (waiting for input or a timer). D is uninterruptible I/O wait. Extra letters: s session leader, + foreground, < high priority, N low priority.', aka: ['state', 'states'], see: ['process', 'zombie'], lesson: 'ps' },
  'job': { s: 'A command the shell started that you can manage with jobs/fg/bg.', d: 'Jobs are numbered per shell ([1], [2]…), referenced as %1, %2. A job can run in the foreground (has your keyboard), the background (&), or be stopped (Ctrl+Z).', aka: ['jobs', 'job control', 'background', 'foreground'], see: ['process', 'signal'], lesson: 'jobs' },
  'nice value': { s: 'Scheduling hint from -20 (most CPU) to 19 (least CPU).', d: 'Higher = "nicer" to other processes. Each step changes the CPU share by roughly 10%. Only root may lower the value (raise priority).', aka: ['niceness', 'priority', 'nice'], see: ['scheduler'], lesson: 'nice' },
  'scheduler': { s: 'The kernel component deciding which process runs on each CPU next.', d: 'Linux uses a fair scheduler (CFS, now EEVDF) that gives runnable tasks CPU time in proportion to their weight, which comes from the nice value.', see: ['nice value', 'process'] },
  '/proc': { s: 'A virtual filesystem exposing kernel and process information as files.', d: 'Nothing in /proc is on disk: reading /proc/meminfo or /proc/1234/status asks the kernel for live data. Tools like ps, top and free read it.', aka: ['procfs'], see: ['process', 'kernel'], lesson: 'proc' },
  '/etc': { s: 'Directory holding system-wide configuration files.', d: '/etc/passwd (accounts), /etc/group, /etc/shadow (password hashes), /etc/sudoers, /etc/fstab (mounts), /etc/hosts, /etc/crontab, /etc/ssh/sshd_config…', aka: ['/etc/passwd', '/etc/shadow', '/etc/sudoers', '/etc/fstab'], see: ['root'] },
  'sudo': { s: 'Run one command as root (or another user), if /etc/sudoers allows it.', d: 'sudo is a setuid-root program: it checks /etc/sudoers, asks for YOUR password (cached ~15 minutes), logs the command, then runs it with UID 0.', see: ['root', 'setuid'], lesson: 'sudo' },
  'regular expression': { s: 'A pattern language for matching text (used by grep, sed, awk).', d: '. any char, * zero or more, + one or more (ERE), ^ start of line, $ end, [abc] class, \\b word boundary, ( ) groups, | alternation (ERE). grep -E / sed -E use extended syntax.', aka: ['regex', 'regexp', 'pattern'], see: ['glob'], lesson: 'grep' },
  'field': { s: 'One column of a line, split by a separator (space, comma, colon…).', d: 'awk numbers fields $1, $2 … ($0 = whole line, NF = number of fields). cut uses -f with -d to choose the delimiter.', aka: ['fields', 'column', 'columns', 'delimiter'], see: ['regular expression'], lesson: 'awk' },
  'shebang': { s: 'The first line of a script, #!/bin/bash, naming its interpreter.', d: 'When you execute ./script.sh, the kernel reads #! and runs the named interpreter with the script as argument. Without it, the file needs to be run as `bash script.sh`.', aka: ['#!'], see: ['shell'], lesson: 'vars' },
  'dotfile': { s: 'A hidden file whose name starts with "." (e.g. ~/.bashrc).', d: 'ls hides them unless you use -a. Most per-user configuration lives in dotfiles.', aka: ['dotfiles', 'hidden file', 'hidden files', '.bashrc'], see: ['home directory'], lesson: 'bashrc' },
  'stat': { s: 'System call (and command) that reads a file\'s inode metadata.', d: 'stat()/statx() return type, size, permissions, owner, link count and timestamps. ls -l calls it for every entry.', aka: ['stat()', 'statx'], see: ['inode'], lesson: 'stat' },
  'unlink': { s: 'System call that removes a name (directory entry) for a file.', d: 'rm calls unlink(). The data is freed only when no names and no open file descriptors remain — so deleting a log file that a program still writes to does not free space until the program closes it.', aka: ['unlink()', 'unlinkat'], see: ['inode', 'link count'], lesson: 'rm' },
  'syntax notation': { s: 'How manuals describe a command: [optional], ITEM..., a|b, CAPITALS.', d: '[ ] = optional part. ... = may be repeated (SOURCE... = one or more sources). a|b = choose one of them. CAPITALS (FILE, DIR, PATTERN) = replace with your own value. Literal text (like the command name and flags) is typed as shown.', aka: ['synopsis'], see: ['shell'] },
  'terminal': { s: 'The text window where you interact with a shell.', d: 'Historically a physical device; today a terminal emulator program. It provides a "tty" (e.g. /dev/pts/0) that is the process\'s stdin, stdout and stderr by default.', aka: ['tty', 'pts', 'console'], see: ['shell', 'stdin'] },
  'timestamp': { s: 'Times stored in the inode: modification (mtime), change (ctime), access (atime), birth.', d: 'mtime changes when content changes, ctime when metadata (permissions, owner, links) changes, atime on reads (often relaxed). touch updates mtime/atime.', aka: ['timestamps', 'mtime'], see: ['inode'], lesson: 'touch' },
};
